[package]
name = "bitty-terminal"
description = "Bitty terminal binary — thin composition root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "bitty"]
categories = ["command-line-utilities"]
publish = false

[lints]
workspace = true

[[bin]]
name = "bitty"
path = "src/main.rs"

[dependencies]
bitty-config = { path = "../bitty-config" }
bitty-ipc = { git = "https://github.com/bitty-terminal/bitty-ipc", rev = "e9714e7" }
# CTX-0918: developer-only PB-1/PB-4 tracing for `bitty dev trace`; opt-in
# via the `dev-perf` feature so release builds do not link the perf harness.
bitty-perf = { path = "../bitty-perf", optional = true }
bitty-platform = { path = "../bitty-platform" }
bitty-plugin-host = { path = "../bitty-plugin-host" }
bitty-runtime = { path = "../bitty-runtime" }
bitty-render = { path = "../bitty-render" }
bitty-rich = { path = "../bitty-rich" }
bitty-term-state = { path = "../bitty-term-state" }
bitty-vt = { path = "../bitty-vt" }
pollster = { workspace = true }

[features]
default = []
# Enables `bitty dev trace startup|latency` (links `bitty-perf`).
dev-perf = ["dep:bitty-perf"]
# Enables `bitty dev capture|synthesize|dump|overlay` (CTX-0922): developer
# headless captures, dumps, and overlay proofs stay out of release builds.
dev-tools = []

[dev-dependencies]
# Hermetic `ServeContext` constructors and unbound bearer minters (#1519).
bitty-ipc = { git = "https://github.com/bitty-terminal/bitty-ipc", rev = "e9714e7", features = ["test-support"] }
bitty-test-support = { path = "../bitty-test-support" }
