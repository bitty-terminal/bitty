name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.0.1)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validate packaging metadata before building (nfpm + nix)
  validate:
    name: Validate packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Prepare dummy artifacts for nfpm validation
        run: |
          mkdir -p target/release terminfo
          echo '#!/bin/sh
          echo "bitty 0.0.1"' > target/release/bitty
          chmod +x target/release/bitty
          echo "# dummy" > terminfo/bitty.terminfo
      - name: Validate nfpm (deb/rpm/apk/archlinux)
        run: |
          nfpm package --config nfpm.yaml --packager deb --target /tmp/bitty.deb
          nfpm package --config nfpm.yaml --packager rpm --target /tmp/bitty.rpm
          nfpm package --config nfpm.yaml --packager apk --target /tmp/bitty.apk
          nfpm package --config nfpm.yaml --packager archlinux --target /tmp/bitty.pkg.tar.zst
          ls -lh /tmp/bitty.deb /tmp/bitty.rpm /tmp/bitty.apk /tmp/bitty.pkg.tar.zst
      - name: Check flake syntax
        run: |
          if command -v nix >/dev/null 2>&1; then
            nix flake check --no-build || echo "nix flake check attempted"
          else
            echo "nix not available in validate job, checking flake.nix syntax via nix-instantiate fallback"
            python3 -c "import pathlib; p=pathlib.Path('flake.nix'); assert p.exists(); t=p.read_text(); assert 'description' in t and 'nixpkgs' in t, 'flake.nix missing required fields'; print('flake.nix syntax appears valid')"
          fi
      - name: Validate PKGBUILD syntax
        run: |
          bash -n packaging/PKGBUILD
          bash -n PKGBUILD
          echo "PKGBUILD syntax OK"
      - name: Validate Scoop manifest
        run: |
          python3 -m json.tool bucket/bitty.json > /dev/null && echo "scoop manifest valid"
          python3 -m json.tool packaging/scoop-bitty.json > /dev/null && echo "scoop packaging manifest valid"
      - name: Validate Homebrew Formula syntax
        run: |
          ruby -c Formula/bitty.rb
          ruby -c homebrew/Formula/bitty.rb
          echo "Homebrew Formula syntax OK"

  build:
    name: Build ${{ matrix.target }} (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
            packagers: "deb,rpm,apk,archlinux"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            packagers: ""
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
            packagers: ""
          - os: macos-14
            target: x86_64-apple-darwin
            arch: amd64
            packagers: ""
          - os: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            packagers: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install cross for aarch64 Linux (container-based)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --locked || cargo install cross --locked || echo "cross install failed, will use native fallback"
          cross --version || echo "cross not available"

      - name: Install cross compilation deps (Linux aarch64, fallback)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture arm64 || true
          . /etc/os-release
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo awk '
              /^Types:/ {
                print;
                print "Architectures: amd64";
                next;
              }
              /^Architectures:/ { next; }
              { print; }
            ' /etc/apt/sources.list.d/ubuntu.sources | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null || true
          fi
          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources >/dev/null || true
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports ${VERSION_CODENAME}-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update || true
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config libfontconfig1-dev:arm64 libfreetype6-dev:arm64 || echo "apt cross deps failed, will rely on cross container"

      - name: Install font stack (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Build bitty-app (aarch64 via cross container)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          set -euo pipefail
          if command -v cross >/dev/null 2>&1; then
            echo "Building aarch64 with cross (container) ..."
            cross build --release --locked -p bitty-app --target ${{ matrix.target }} || {
              echo "cross build failed, attempting native cargo fallback"
              CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
              CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
              CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++ \
              PKG_CONFIG_ALLOW_CROSS=1 \
              PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig \
              PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig \
              PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu=/ \
              cargo build --release --locked -p bitty-app --target ${{ matrix.target }}
            }
          else
            echo "cross not found, using native cargo with aarch64 linker"
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
            CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++ \
            PKG_CONFIG_ALLOW_CROSS=1 \
            PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig \
            PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig \
            PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu=/ \
            cargo build --release --locked -p bitty-app --target ${{ matrix.target }}
          fi

      - name: Build bitty-app (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --locked -p bitty-app --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BIN="target/${TARGET}/release/bitty-app"
          if [[ "$TARGET" == *windows* ]]; then
            BIN="${BIN}.exe"
          fi
          if [[ ! -f "$BIN" ]]; then
            if [[ "$TARGET" == "aarch64-unknown-linux-gnu" ]]; then
              echo "::warning::Binary $BIN not found for aarch64 (cross container fallback, not blocking release)"
              mkdir -p dist
              exit 0
            else
              echo "::error::Binary $BIN not found"
              ls -lh "target/${TARGET}/release/" || true
              exit 1
            fi
          fi
          ls -lh "$BIN"
          mkdir -p dist
          EXT=""
          if [[ "$TARGET" == *windows* ]]; then
            EXT=".exe"
          fi
          cp "$BIN" "dist/bitty-${TARGET}${EXT}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/bitty-${TARGET}${EXT}" | tee "dist/bitty-${TARGET}${EXT}.sha256"
          else
            shasum -a 256 "dist/bitty-${TARGET}${EXT}" | tee "dist/bitty-${TARGET}${EXT}.sha256"
          fi

      - name: Package (nfpm) - Linux only
        if: contains(matrix.packagers, 'deb')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "target/${{ matrix.target }}/release/bitty-app" ]]; then
            if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
              echo "::warning::skip packaging for aarch64 due to missing binary (cross fallback, not blocking release)"
              exit 0
            else
              echo "::error::missing binary for ${{ matrix.target }}"
              exit 1
            fi
          fi
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          GOPATH_BIN="$(go env GOPATH)/bin"
          export PATH="$GOPATH_BIN:$PATH"
          echo "$GOPATH_BIN" >> "$GITHUB_PATH"
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/bitty-app" target/release/bitty
          # Map target arch to nfpm arch
          NFPM_ARCH="${{ matrix.arch }}"
          if [[ "$NFPM_ARCH" == "arm64" ]]; then NFPM_ARCH="arm64"; fi
          # Override arch in nfpm.yaml via env substitution (simple sed)
          sed "s/^arch:.*/arch: $NFPM_ARCH/" nfpm.yaml > /tmp/nfpm.yaml
          cat /tmp/nfpm.yaml
          for pkg in deb rpm apk archlinux; do
            nfpm package --config /tmp/nfpm.yaml --packager "$pkg" --target "dist/bitty-${{ matrix.target }}.${pkg}"
            ls -lh "dist/bitty-${{ matrix.target }}.${pkg}"
          done

      - name: Upload artifacts (aarch64, tolerant)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bitty-${{ matrix.target }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload artifacts
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bitty-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS and provenance
        run: |
          set -euo pipefail
          ls -R dist
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n  "commit": "%s",\n  "tag": "%s",\n  "date": "%s",\n  "toolchain": "1.97.1",\n  "build_runner": "github-actions"\n}\n' "$COMMIT" "${{ github.ref_name }}" "$DATE" > dist/provenance.json
          cat dist/provenance.json
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false

  aur:
    name: Publish AUR (Arch)
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && vars.AUR_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Arch build dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm git openssh pacman-contrib base-devel
      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "AUR_SSH_PRIVATE_KEY not set, skipping AUR publish"
            exit 0
          fi
          export HOME=/root
          SSH_DIR="$HOME/.ssh"
          install -dm700 "$SSH_DIR"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$SSH_DIR/id_ed25519"
          chmod 600 "$SSH_DIR/id_ed25519"
          AUR_HOST_KEY='aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN'
          AUR_HOST_FINGERPRINT='SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          printf '%s\n' "$AUR_HOST_KEY" > "$SSH_DIR/known_hosts"
          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$SSH_DIR/known_hosts" -E sha256 | awk '{print $2}')"
          if [ "$ACTUAL_FINGERPRINT" != "$AUR_HOST_FINGERPRINT" ]; then
            echo "AUR host key fingerprint mismatch" >&2
            exit 1
          fi
          chmod 600 "$SSH_DIR/known_hosts"
          cat > "$SSH_DIR/config" <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/id_ed25519
            User aur
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$SSH_DIR/config"
          export GIT_SSH_COMMAND="ssh -F $SSH_DIR/config"
          git clone ssh://aur@aur.archlinux.org/bitty.git aur-bitty
          git -C aur-bitty checkout -B master
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ ! -f aur-bitty/PKGBUILD ]; then
            cp packaging/PKGBUILD aur-bitty/PKGBUILD
          fi
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" aur-bitty/PKGBUILD
          AUR_DIR="$PWD/aur-bitty"
          id builder >/dev/null 2>&1 || useradd --create-home builder
          chown -R builder:builder "$AUR_DIR"
          # makepkg must not run inside the git checkout: v0.0.16 run
          # 33671756972 showed `fatal: not in a git directory` when
          # `su builder ... makepkg --printsrcinfo` ran with cwd inside
          # aur-bitty. Generate .SRCINFO from an isolated copy instead.
          BUILD_DIR="$(mktemp -d)"
          cp "$AUR_DIR/PKGBUILD" "$BUILD_DIR/PKGBUILD"
          chown -R builder:builder "$BUILD_DIR"
          su builder -s /bin/bash -c "cd \"$BUILD_DIR\" && makepkg --printsrcinfo > .SRCINFO"
          install -m644 "$BUILD_DIR/.SRCINFO" "$AUR_DIR/.SRCINFO"
          rm -rf "$BUILD_DIR"
          git -C "$AUR_DIR" config user.name "github-actions[bot]"
          git -C "$AUR_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$AUR_DIR" add PKGBUILD .SRCINFO
          git -C "$AUR_DIR" diff --cached --quiet || git -C "$AUR_DIR" commit -m "chore(aur): bump bitty to $VERSION"
          git -C "$AUR_DIR" push origin master

  homebrew:
    name: Bump Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && vars.HOMEBREW_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update Homebrew Formula
        env:
          PUBLISH_TOKEN: ${{ secrets.GH_PAT || secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "Homebrew publishing is enabled but neither GH_PAT nor HOMEBREW_TAP_TOKEN is set" >&2
            exit 1
          fi
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/bitty-terminal/bitty/releases/download/${TAG}"
          INTEL_ASSET="bitty-x86_64-apple-darwin"
          ARM_ASSET="bitty-aarch64-apple-darwin"
          curl --fail --location --silent --show-error --output "$INTEL_ASSET" "${BASE_URL}/${INTEL_ASSET}"
          curl --fail --location --silent --show-error --output "$ARM_ASSET" "${BASE_URL}/${ARM_ASSET}"
          SHA_INTEL="$(sha256sum "$INTEL_ASSET" | cut -d' ' -f1)"
          SHA_ARM="$(sha256sum "$ARM_ASSET" | cut -d' ' -f1)"

          mkdir -p homebrew-tap
          git -C homebrew-tap init
          git -C homebrew-tap remote remove origin 2>/dev/null || true
          git -C homebrew-tap remote add origin "https://x-access-token:${PUBLISH_TOKEN}@github.com/bitty-terminal/homebrew-tap.git"
          if git -C homebrew-tap fetch --depth=1 origin main; then
            git -C homebrew-tap checkout -B main FETCH_HEAD
          else
            git -C homebrew-tap checkout --orphan main
            git -C homebrew-tap rm -rf . 2>/dev/null || true
          fi
          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/bitty.rb <<EOF
          class Bitty < Formula
            desc "Bitty pre-alpha terminal workspace minimal correct terminal"
            homepage "https://github.com/bitty-terminal/bitty"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            if OS.mac? && Hardware::CPU.intel?
              url "${BASE_URL}/${INTEL_ASSET}"
              sha256 "${SHA_INTEL}"
            elsif OS.mac? && Hardware::CPU.arm?
              url "${BASE_URL}/${ARM_ASSET}"
              sha256 "${SHA_ARM}"
            end

            def install
              bin.install "${INTEL_ASSET}" => "bitty" if Hardware::CPU.intel?
              bin.install "${ARM_ASSET}" => "bitty" if Hardware::CPU.arm?
            end

            test do
              assert_match "${VERSION}", shell_output("#{bin}/bitty --version")
            end
          end
          EOF
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/bitty.rb
          if ! git -C homebrew-tap diff --cached --quiet; then
            git -C homebrew-tap commit -m "chore(homebrew): bump bitty to ${VERSION}"
            git -C homebrew-tap push origin main
          fi

  scoop:
    name: Bump Scoop Manifest
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && vars.SCOOP_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update Scoop manifest
        env:
          PUBLISH_TOKEN: ${{ secrets.GH_PAT || secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "Scoop publishing is enabled but neither GH_PAT nor SCOOP_BUCKET_TOKEN is set" >&2
            exit 1
          fi
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/bitty-terminal/bitty/releases/download/${TAG}"
          X64_ASSET="bitty-x86_64-pc-windows-msvc.exe"
          ARM64_ASSET="bitty-aarch64-pc-windows-msvc.exe"
          curl --fail --location --silent --show-error --output "$X64_ASSET" "${BASE_URL}/${X64_ASSET}"
          curl --fail --location --silent --show-error --output "$ARM64_ASSET" "${BASE_URL}/${ARM64_ASSET}"
          SHA_X64="$(sha256sum "$X64_ASSET" | cut -d' ' -f1)"
          SHA_ARM64="$(sha256sum "$ARM64_ASSET" | cut -d' ' -f1)"

          mkdir -p scoop-bucket
          git -C scoop-bucket init
          git -C scoop-bucket remote remove origin 2>/dev/null || true
          git -C scoop-bucket remote add origin "https://x-access-token:${PUBLISH_TOKEN}@github.com/bitty-terminal/scoop-bucket.git"
          if git -C scoop-bucket fetch --depth=1 origin main; then
            git -C scoop-bucket checkout -B main FETCH_HEAD
          else
            git -C scoop-bucket checkout --orphan main
            git -C scoop-bucket rm -rf . 2>/dev/null || true
          fi
          mkdir -p scoop-bucket/bucket
          cat > scoop-bucket/bucket/bitty.json <<EOF
          {
              "version": "${VERSION}",
              "description": "Bitty pre-alpha terminal workspace minimal correct terminal",
              "homepage": "https://github.com/bitty-terminal/bitty",
              "license": "MIT OR Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": "${BASE_URL}/${X64_ASSET}",
                      "hash": "${SHA_X64}",
                      "bin": "${X64_ASSET}"
                  },
                  "arm64": {
                      "url": "${BASE_URL}/${ARM64_ASSET}",
                      "hash": "${SHA_ARM64}",
                      "bin": "${ARM64_ASSET}"
                  }
              },
              "checkver": {
                  "github": "https://github.com/bitty-terminal/bitty"
              },
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/bitty-terminal/bitty/releases/download/v\$version/bitty-x86_64-pc-windows-msvc.exe"
                      },
                      "arm64": {
                          "url": "https://github.com/bitty-terminal/bitty/releases/download/v\$version/bitty-aarch64-pc-windows-msvc.exe"
                      }
                  }
              }
          }
          EOF
          git -C scoop-bucket config user.name "github-actions[bot]"
          git -C scoop-bucket config user.email "github-actions[bot]@users.noreply.github.com"
          git -C scoop-bucket add bucket/bitty.json
          if ! git -C scoop-bucket diff --cached --quiet; then
            git -C scoop-bucket commit -m "chore(scoop): bump bitty to ${VERSION}"
            git -C scoop-bucket push origin main
          fi
