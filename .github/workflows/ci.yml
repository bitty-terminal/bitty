name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test-heavy jobs (quality, linux-x11, linux-wayland, macos, windows) run the
  # full debug suite, measured at 11-15m on 2026-09-06/07 (CTX-0218; precedent
  # CTX-0193 raised soak 90s->120s the same way). Budget is 30m; do not reduce
  # to 15m. Fast jobs (msrv, supply-chain) stay at 15m.
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bitty-render wraps crossfont (ADR-0004), which links the platform
      # font stack on Linux (FreeType + fontconfig) via pkg-config.
      # HK-07: cache downloaded .deb archives across runs (key = OS + the
      # package lists in this file). Install steps below still run
      # unconditionally; a cold archive just refetches.
      - name: Prepare apt archive directory (cache ownership)
        run: sudo mkdir -p /var/cache/apt/archives && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install font stack development libraries
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libfreetype6-dev

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: rustfmt, clippy

      # HK-07: compilation cache on the managed Cache backend. Scoped to
      # OS + toolchain (+ job, Cargo.lock, and rustc hashes appended by the
      # action) with prefix fallback on restore. Raw target/ stays out of
      # actions/cache; nothing here keys on sources, and no install step is
      # gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # Arch tooling is absent on ubuntu-latest, so this gate runs its
      # in-tree assertions and skips the makepkg --printsrcinfo probe.
      - name: Validate packaging recipes (artifact-install consistency)
        run: |
          bash scripts/check-pkgbuild-source.sh
          bash scripts/check-pkgbuild-bin.sh

      - name: Check terminfo shipping decision (034 item 6)
        run: |
          bash scripts/check-terminfo.sh
          bash scripts/tests/check-terminfo.test.sh

      - name: Install desktop/AppStream validation tools
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          appstream desktop-file-utils libxml2-utils

      - name: Check desktop integration and AppStream metadata (034 item 7)
        run: |
          bash scripts/check-desktop-integration.sh
          bash scripts/tests/check-desktop-integration.test.sh

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      # M1-10 / CTX-0574: pin the M1 matrix driver's reporting logic (suite
      # floors, ignored-test rejection, aggregate failure modes, step summary)
      # without running the real suites here; the four Tier 1 platform legs and
      # the `m1-matrix` aggregate job below run the suites themselves. This is
      # also what the mandatory local `just ci-local` run (which targets this
      # job) validates for the new wiring.
      - name: Check M1 matrix driver (fixture test)
        run: bash scripts/tests/m1-matrix.test.sh
      # M1-11 / CTX-0576: the committed parser-throughput baseline guards the
      # compatibility-milestone performance requirement (no pathological
      # regression versus plain-text throughput). The check is bounded
      # (512 KiB/corpus, 3 rounds), deterministic, and headless; the ratio gate
      # is deliberately generous so shared runners do not flake.
      - name: Check parser throughput regression (M1-11 baseline)
        run: cargo test -p bitty-perf --test parser_throughput_regression --locked

      - name: Check status drift gate (OQ/RFC/crate-count/submodule)
        run: |
          bash scripts/check-status-drift.sh
          bash scripts/tests/check-status-drift.test.sh

      # 034 item 4 / CTX-0449: the declared deb/rpm/archlinux runtime deps must
      # cover exactly the sonames the linked binary needs. The fixture test
      # pins the gate logic; the debug-binary run catches nfpm.yaml and
      # packaging/linux/runtime-deps.toml drift on every PR.
      - name: Check runtime dependency declarations (ldd/readelf gate)
        run: |
          bash scripts/tests/check-runtime-deps.test.sh
          cargo build --locked -p bitty-app
          bash scripts/check-runtime-deps.sh --binary target/debug/bitty --packagers deb,rpm,archlinux

      # 034 item 5 / CTX-0450: pin the install-smoke driver's distro leg
      # (package discovery, install command, --version/doctor/headless smoke)
      # without starting a container; the release workflow runs the real legs.
      - name: Check install smoke driver (fixture test)
        run: bash scripts/tests/install-smoke.test.sh

      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/repo"
          --workdir /repo
          docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  msrv:
    name: MSRV 1.85 check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # HK-07: cache downloaded .deb archives across runs (key = OS + the
      # package lists in this file). Install steps below still run
      # unconditionally; a cold archive just refetches.
      - name: Prepare apt archive directory (cache ownership)
        run: sudo mkdir -p /var/cache/apt/archives && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install font stack development libraries
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libfreetype6-dev

      - name: Install MSRV toolchain 1.85
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          # MSRV floor; must match the rust-version in Cargo.toml.
          toolchain: 1.85
          components: clippy

      # HK-07: compilation cache on the managed Cache backend. The toolchain
      # is part of the key, so MSRV 1.85 never shares target cache with the
      # pinned channel (the action also appends job, Cargo.lock, and rustc
      # hashes, with prefix fallback on restore). Nothing here keys on
      # sources, and no install step is gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-1.85

      - name: Check MSRV compilation
        run: cargo +1.85 check --workspace --all-targets --locked

  linux-x11:
    name: Linux X11 (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISPLAY: :99
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # HK-07: cache downloaded .deb archives across runs (key = OS + the
      # package lists in this file). Install steps below still run
      # unconditionally; a cold archive just refetches.
      - name: Prepare apt archive directory (cache ownership)
        run: sudo mkdir -p /var/cache/apt/archives && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install font stack and xvfb
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-0
          libxkbcommon-dev xvfb

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy

      # HK-07: compilation cache on the managed Cache backend. Scoped to
      # OS + toolchain (+ job, Cargo.lock, and rustc hashes appended by the
      # action) with prefix fallback on restore. Raw target/ stays out of
      # actions/cache; nothing here keys on sources, and no install step is
      # gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}

      - name: Run tests under xvfb (X11)
        run: xvfb-run -a cargo test --workspace --all-targets --locked

      # M1-10 / CTX-0574: run the M1 evidence suites by name so a
      # per-platform regression is a distinct, reported result instead of
      # being buried in the blanket test run above. The suites are headless
      # (Parser -> State, plus the deterministic headless rasterizer) and need
      # no display, so this step does not use xvfb.
      - name: Run M1 compatibility matrix
        run: ./scripts/m1-matrix.sh run --platform linux-x11 --out m1-results/linux-x11.tsv

      - name: Upload M1 matrix result (linux-x11)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-results-linux-x11
          path: m1-results/linux-x11.tsv
          if-no-files-found: error
          retention-days: 7

  linux-wayland:
    name: Linux Wayland
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAYLAND_DISPLAY: wayland-0
      XDG_SESSION_TYPE: wayland
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # HK-07: cache downloaded .deb archives across runs (key = OS + the
      # package lists in this file). Install steps below still run
      # unconditionally; a cold archive just refetches.
      - name: Prepare apt archive directory (cache ownership)
        run: sudo mkdir -p /var/cache/apt/archives && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install font stack and Wayland libraries
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libfreetype6-dev libwayland-dev

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy

      # HK-07: compilation cache on the managed Cache backend. Scoped to
      # OS + toolchain (+ job, Cargo.lock, and rustc hashes appended by the
      # action) with prefix fallback on restore. Raw target/ stays out of
      # actions/cache; nothing here keys on sources, and no install step is
      # gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}

      - name: Run tests with Wayland env
        run: cargo test --workspace --all-targets --locked

      # M1-10 / CTX-0574: Wayland leg of the M1 compatibility matrix. The M1
      # suites are display-independent; the Wayland env above only proves the
      # workspace still builds and tests on the Wayland path.
      - name: Run M1 compatibility matrix
        run: ./scripts/m1-matrix.sh run --platform linux-wayland --out m1-results/linux-wayland.tsv

      - name: Upload M1 matrix result (linux-wayland)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-results-linux-wayland
          path: m1-results/linux-wayland.tsv
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ARM64 check and test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy

      # HK-07: compilation cache on the managed Cache backend. Scoped to
      # OS + toolchain (+ job, Cargo.lock, and rustc hashes appended by the
      # action) with prefix fallback on restore. Raw target/ stays out of
      # actions/cache; nothing here keys on sources, and no install step is
      # gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}

      - name: Check workspace compilation (macOS ARM64)
        run: cargo check --workspace --all-targets --locked

      - name: Run tests (macOS ARM64)
        run: cargo test --workspace --all-targets --locked

      # M1-10 / CTX-0574: macOS ARM64 leg of the M1 compatibility matrix. The
      # suites are headless and free of window/font/GPU dependencies, so the
      # macOS path is exercised without a display.
      - name: Run M1 compatibility matrix
        run: ./scripts/m1-matrix.sh run --platform macos --out m1-results/macos.tsv

      - name: Upload M1 matrix result (macos)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-results-macos
          path: m1-results/macos.tsv
          if-no-files-found: error
          retention-days: 7

  supply-chain:
    name: Supply chain (deny/audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Check dependencies (licenses, bans, sources)
        run: cargo deny check

      # Observation only (research 042 item 5, CTX-0505): duplicated transitive
      # versions are expected from winit/wgpu/crossfont/arboard/image/
      # portable-pty and must not be force-unified. `cargo tree --duplicates`
      # exits 0; this step prints the resolved duplicates for PR visibility and
      # never fails the job.
      - name: Observe duplicate dependency versions (informational)
        run: cargo tree --workspace --duplicates --locked

      # unmaintained advisories for ttf-parser/paste are tracked via deny.toml
      # and ignored for audit until upstream replacement lands (winit/metal paths)
      # cargo-deny and cargo-audit share ~/.cargo/advisory-db; deny populates it
      # so clear before audit to avoid "Refusing to initialize non-empty directory" failure.
      - name: Audit advisories
        run: rm -rf ~/.cargo/advisory-db && cargo audit --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0192

  windows:
    name: Windows check and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy

      # HK-07: compilation cache on the managed Cache backend. Scoped to
      # OS + toolchain (+ job, Cargo.lock, and rustc hashes appended by the
      # action) with prefix fallback on restore. Raw target/ stays out of
      # actions/cache; nothing here keys on sources, and no install step is
      # gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}

      - name: Check workspace compilation
        run: cargo check --workspace --all-targets --locked

      - name: Run tests
        run: cargo test --workspace --locked

      # M1-10 / CTX-0574: Windows x86_64 (ConPTY) leg of the M1 compatibility
      # matrix, the third ADR-0002 Tier 1 platform. `shell: bash` selects the
      # Git Bash on windows-latest; the suites are headless and the rasterizer
      # used by the color/title golden is the deterministic headless one, so no
      # window or GPU is required.
      - name: Run M1 compatibility matrix
        shell: bash
        run: ./scripts/m1-matrix.sh run --platform windows --out m1-results/windows.tsv

      - name: Upload M1 matrix result (windows)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-results-windows
          path: m1-results/windows.tsv
          if-no-files-found: error
          retention-days: 7

  # M1-10 / CTX-0574: aggregate the four ADR-0002 Tier 1 platform legs into a
  # single pass/fail view. Each platform job runs the M1 evidence suites by
  # name and uploads a `m1-results-<platform>` artifact; this job stitches them
  # into one table on the run summary and fails if any platform is missing a
  # suite, reported a fail, or had a failed job result. That makes a regression
  # on one Tier 1 platform a single visible check instead of four scattered
  # job logs.
  #
  # MSRV is intentionally not a leg: it is a compile-floor gate
  # (`cargo +1.85 check`), not a Tier 1 platform run. The M1 suites are
  # exercised on Linux X11, Linux Wayland, macOS ARM64, and Windows x86_64
  # above, which is the full Tier 1 platform set.
  m1-matrix:
    name: M1 matrix (Tier 1 aggregate)
    if: always()
    needs: [linux-x11, linux-wayland, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      M1_JOB_LINUX_X11: ${{ needs['linux-x11'].result }}
      M1_JOB_LINUX_WAYLAND: ${{ needs['linux-wayland'].result }}
      M1_JOB_MACOS: ${{ needs.macos.result }}
      M1_JOB_WINDOWS: ${{ needs.windows.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download per-platform M1 results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: m1-results-*
          path: m1-results
          merge-multiple: true

      - name: Aggregate M1 matrix
        run: |
          ls -l m1-results || true
          ./scripts/m1-matrix.sh aggregate --dir m1-results --summary "$GITHUB_STEP_SUMMARY"
