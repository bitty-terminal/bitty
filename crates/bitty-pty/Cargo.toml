[package]
name = "bitty-pty"
description = "PTY wrapper with backpressure and resize for Bitty (native ConPTY spawn on Windows, portable-pty on Unix)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["pty", "terminal", "process", "bitty"]
categories = ["os", "command-line-utilities"]
publish = true

[lints]
workspace = true

# CTX-0978: `portable-pty` backs the Unix backend only. The Windows ConPTY
# backend spawns natively through `bitty-winjob` (job at creation), so
# Windows builds no longer compile the upstream crate at all.
[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"

# CTX-0512: the owned-process-tree boundary (`tree` module). Same workspace
# pins and platform split as `bitty-ipc`/`bitty-runtime` (no new crates);
# both wrap the process-group, pidfd, and kqueue system calls safely, so the
# crate stays `forbid(unsafe_code)`.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { workspace = true, features = ["process", "std"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
nix = { workspace = true, features = ["event", "process", "signal"] }

# CTX-0903 (DEC-0083): the Windows owned-tree backend (Job Objects). The
# first-party `bitty-winjob` adapter holds the reviewed Win32 FFI, so this
# crate stays `forbid(unsafe_code)` on Windows too.
[target.'cfg(windows)'.dependencies]
bitty-winjob = { version = "0.0.22", path = "../bitty-winjob" }

[dev-dependencies]
bitty-test-support = { path = "../bitty-test-support" }
