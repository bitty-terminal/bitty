[package]
name = "bitty-rich"
description = "Rich presentation helpers for Bitty (draft)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "rich", "bitty"]
categories = ["text-processing"]
publish = true

[lints]
workspace = true

[dependencies]
bitty-term-state = { version = "0.0.28", path = "../bitty-term-state" }
bitty-vt = { version = "0.0.28", path = "../bitty-vt" }
bitty-platform = { version = "0.0.28", path = "../bitty-platform" }
# W-103 G-3: the blocking hosted-editor spawn records and kills the whole
# owned process tree through the execution boundary's reviewed tracker
# (`bitty_pty::OwnedTree`); workspace-internal path edge, no new
# supply-chain surface.
bitty-pty = { version = "0.0.28", path = "../bitty-pty" }
# CTX-1412 (#2117): the `bitty-ipc` edge existed only for the unwired
# fragment-to-`RichBlock` projection; it is retired, so this Core crate keeps
# no production edge to the extracted IPC repository.
# 256-bit one-time clipboard-read tokens (CTX-0213). Pinned to the locked
# 0.4.x line; no other RNG is used so token entropy is auditable in one place.
getrandom = "0.4"
# CTX-1186 (#2000): Kitty PNG decode and background PNG decode share the
# minimal `png` codec (same crate and pin as the `bitty-graphics`
# extension seam, `png 0.18`, already in the Core lockfile via `arboard`
# -> `bitty-platform`): no format autodetect, no codecs beyond PNG, no
# color-management stack. Hand-rolling DEFLATE would be an attack surface
# of its own, so decoding delegates here; bounds run before allocation on
# every path and hostile headers are refused from the sniff.
png = "0.18"
# Background-image decode (CTX-0347, RFC-0001/OQ-042): the accepted format set
# is PNG + JPEG (baseline/progressive) + static WebP. PNG travels the
# minimal `png` codec above; JPEG/WebP need their own decoders, and the
# `image` facade is already in the tree (lockfile edge via `arboard` ->
# `bitty-platform`), so this direct edge only narrows the feature set
# (`default-features = false`) instead of adding a new codec stack.
# Animated/multi-frame containers are rejected by our own header sniff
# before this decoder ever runs.
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "webp",
] }


[dev-dependencies]
bitty-test-support = { path = "../bitty-test-support" }
bitty-vt = { path = "../bitty-vt" }
