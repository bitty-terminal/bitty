[package]
name = "bitty-runtime"
description = "Runtime orchestration for Bitty Correct Terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "runtime", "bitty"]
categories = ["command-line-utilities"]
publish = false

[lints]
workspace = true

[dependencies]
bitty-vt = { path = "../bitty-vt" }
bitty-term-state = { path = "../bitty-term-state" }
bitty-pty = { path = "../bitty-pty" }
bitty-render = { path = "../bitty-render" }
bitty-platform = { path = "../bitty-platform" }
bitty-ui = { path = "../bitty-ui" }
bitty-lua = { path = "../bitty-lua" }
bitty-plugin-host = { path = "../bitty-plugin-host" }
bitty-agent = { path = "../bitty-agent" }
bitty-ipc = { path = "../bitty-ipc" }
# CTX-0406: the package-manager staging path evaluates the closed compat
# requirement grammar with the same pure implementation the plugin host uses.
bitty-package = { path = "../bitty-package" }
# CTX-0248: the tick overlay path stores Kitty images and computes
# placement rects through the rich layer (moved from dev-dependencies;
# same workspace crate, no new supply-chain surface).
bitty-rich = { path = "../bitty-rich" }
# CTX-0846: the plugin runtime owns the optional shared network runtime and
# registers the `bitty.network` module per capability-granted plugin VM. Same
# external pin as `bitty-lua`/`bitty-plugin-host` (rev d97c5da); do not bump
# here independently.
bitty-network-lua = { git = "https://github.com/bitty-terminal/bitty-network", rev = "d97c5da" }


[dev-dependencies]
bitty-agent = { path = "../bitty-agent" }
bitty-config = { path = "../bitty-config" }
bitty-test-support = { path = "../bitty-test-support" }
