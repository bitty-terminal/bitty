[package]
name = "bitty-daemon"
description = "bittyd session-host daemon for Bitty: service version, capability set, and handshake seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["daemon", "session", "ipc", "bitty"]
categories = ["command-line-utilities"]
# The daemon ships as a binary, never as a crates.io library: the published
# surface stays inside the workspace until the session-host contract is
# implemented and reviewed (bitty#2606, ADR 0019).
publish = false

[lints]
workspace = true

[[bin]]
name = "bittyd"
path = "src/main.rs"

[dependencies]
# bitty#2607: the service scope registry reuses the `bitty-ipc` v1 method
# grammar and v1 vocabulary instead of defining a second one (bitty#2664
# freeze: one spelling, one registry). The crate is the same git source and
# `rev = "9493674"` pin the workspace already resolves through
# `bitty-runtime`, so this adds no package version and no second wire format.
bitty-ipc-api = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-ipc", rev = "9493674" }
# CTX-1619: server-generated 128-bit ids for the registry (contract D-02).
# The 0.4 line is already in the workspace lockfile (`bitty-rich`,
# `bitty-runtime`, and `tempfile`); this adds no package version, no build-time
# codegen, and no second RNG stack. Entropy failure is a hard refusal.
getrandom = "0.4"
# CTX-1623: the control token is stored as a domain-separated SHA-256 digest
# (contract D-07/D-09). `sha2` 0.11.0 is already in the lockfile through
# `bitty-ipc-devtools`; no new package version is resolved.
sha2 = "0.11"
# CTX-1623: constant-time digest comparison for the control token. `subtle`
# 2.6.1 is already in the lockfile through the ed25519/rustls paths; the crate
# has no dependencies of its own.
subtle = "2.6"
# CTX-1623: zeroize the one-time control token when its response is dropped.
# 1.9.0 is already in the lockfile (bitty-runtime pins the same release).
zeroize = "1.9"
# bitty#2606: the seam declares no mechanism edge yet. The contract fixes the
# allowed direction (bittyd -> bitty-term-state, bitty-pty,
# bitty-plugin-host, bitty-ipc); each edge is added by the slice that
# consumes it (registry bitty#2601, IPC service bitty#2607, platform cells
# bitty#2604). Never add the reverse edge: `tests/dependency_direction.rs`
# reads `cargo metadata` and fails when any non-daemon crate depends on this
# package.

[target.'cfg(unix)'.dependencies]
# bitty#2604: endpoint, lock, and peer-trust primitives. `nix` is already in
# the workspace lockfile; features are the minimum this crate uses: `fs`
# (flock, fcntl), `socket` (SO_PEERCRED / LOCAL_PEER*, the non-blocking stale
# probe), `user` (uid/gid), `signal` (peer liveness), `process` (pid types).
# Windows compiles the typed UnsupportedPlatform path and links no nix code.
nix = { workspace = true, features = ["fs", "process", "signal", "socket", "user"] }

[dev-dependencies]
# CTX-1619: temporary journal directories for the orphan-journal tests. The
# 3.27.0 line is already in the workspace lockfile (through `proptest`), so
# this adds no package version and stays out of the shipped daemon.
tempfile = "3"
# Workspace graph for the one-way dependency check. `serde_json` is already
# in the lockfile through the existing graph, so this adds no package version
# and stays out of the shipped daemon.
serde_json = "1"
