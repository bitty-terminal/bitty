[package]
name = "bitty-runtime"
description = "Runtime orchestration for Bitty Correct Terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "runtime", "bitty"]
categories = ["command-line-utilities"]
publish = true

[lints]
workspace = true

[features]
# Read-only VM accounting and safe construction for the explicit regression.
input-vm-test-support = []

# CTX-0906: hermetic native-component test fixture. Speaks wire protocol v1
# over stdio so the broker integration tests spawn a real coprocess without
# any network access; never installed or packaged (publish = false, and the
# release bundles only ship the `bitty` binary).
[[bin]]
name = "bitty-component-fixture"
path = "src/bin/bitty-component-fixture.rs"
test = false
doc = false

# CTX-1253 (#2123, DIR-030 S-1): hermetic resident-helper test fixture. Speaks
# the accepted bitty-ipc length-prefixed framing over stdio so the
# resident-singleton supervisor integration tests spawn a real coprocess with
# no AI build and no network access; never installed or packaged
# (publish = false, and the release bundles only ship the `bitty` binary).
[[bin]]
name = "bitty-ai-helper-fixture"
path = "src/bin/bitty-ai-helper-fixture.rs"
test = false
doc = false

[dependencies]
bitty-config = { version = "0.0.24", path = "../bitty-config" }
bitty-vt = { version = "0.0.24", path = "../bitty-vt" }
bitty-term-state = { version = "0.0.24", path = "../bitty-term-state" }
bitty-pty = { version = "0.0.24", path = "../bitty-pty" }
bitty-render = { version = "0.0.24", path = "../bitty-render" }
bitty-platform = { version = "0.0.24", path = "../bitty-platform" }
bitty-ui = { version = "0.0.24", path = "../bitty-ui" }
bitty-lua = { version = "0.0.24", path = "../bitty-lua" }
bitty-plugin-host = { version = "0.0.24", path = "../bitty-plugin-host" }
# CTX-1151 (#1984): inherited-OS-confinement adapter for admitted tool
# spawns (Linux Landlock; fail-closed degrade elsewhere). First-party
# workspace crate, no new supply-chain surface (its only syscall dep is the
# workspace `libc`, Linux-gated there).
bitty-sandbox = { version = "0.0.24", path = "../bitty-sandbox" }
# `version` below is required for `cargo publish` (lockfile pins 0.0.1 for
# each); the git rev stays the build source until each crate lands on
# crates.io (see CTX-1172 publish order notes).
bitty-ipc = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-ipc", rev = "aa7259d" }
# CTX-0406: the package-manager staging path evaluates the closed compat
# requirement grammar with the same pure implementation the plugin host uses.
bitty-package = { version = "0.0.24", path = "../bitty-package" }
# CTX-0248: the tick overlay path stores Kitty images and computes
# placement rects through the rich layer (moved from dev-dependencies;
# same workspace crate, no new supply-chain surface).
bitty-rich = { version = "0.0.24", path = "../bitty-rich" }
# CTX-0906 (DIR-030): the component broker speaks native-component wire
# protocol v1 to out-of-process components (first: `bitty-net`). Core links
# the dependency-free codec crate only, never a network implementation
# crate; same exact-rev pin pattern as `bitty-ipc`.
bitty-network-wire = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-network", rev = "c69fe57" }
# Issue #1760 (OQ-004): plaintext URL pattern detection wires the
# dependency-free matcher crate (`bitty-url-detector` v0.0.1, `forbid(unsafe)`,
# `std` only) into the same `ValidatedUrl` + `ActivationGesture` pipeline as
# OSC 8. No crates.io release yet, so the same git-rev pin convention as
# `bitty-ipc` / `bitty-network-wire` applies (7-char short SHA).
bitty-url-detector = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-url-detector", rev = "d211490" }
# CTX-1008 (#1763, OQ-076) plus CTX-1178 (#1998): Core consumes the
# platform notification bridge as its single OS-notification dispatch path.
# Same exact-rev pin pattern as `bitty-ipc` / `bitty-network-wire`: the
# bridge receives an already-gated `{title, body}` pair, applies the
# defensive second rate cap, and delivers through the real per-platform
# backend (`LinuxDbusBackend` / `MacosBackend`, fail-closed elsewhere).
# Pinned to the real-backends commit; the bootstrap rev carried stubs only.
bitty-platform-services = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-platform-services", rev = "3a8a7ed" }

# CORE-RUN-003 (#1526): the supervisor claim lock is an OS-held `flock`.
# Same workspace pins and platform split as `bitty-ipc` (no new crates).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { workspace = true, features = ["fs", "std"] }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }


[dev-dependencies]
# Hermetic `ServeContext` constructors and unbound bearer minters (#1519).
bitty-ipc = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-ipc", rev = "aa7259d", features = ["test-support"] }
bitty-test-support = { path = "../bitty-test-support" }

# CTX-0903: Windows liveness probes for the owned-tree tests (safe API of
# the first-party Job Object adapter; no new third-party crate).
[target.'cfg(windows)'.dev-dependencies]
bitty-winjob = { path = "../bitty-winjob" }
