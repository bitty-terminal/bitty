[workspace]
members = [
    "crates/bitty-agent",
    "crates/bitty-app",
    "crates/bitty-config",
    "crates/bitty-core",
    "crates/bitty-ipc",
    "crates/bitty-lua",
    "crates/bitty-package",
    "crates/bitty-platform",
    "crates/bitty-plugin-host",
    "crates/bitty-pty",
    "crates/bitty-rich",
    "crates/bitty-vt",
    "crates/bitty-term-state",
    "crates/bitty-render",
    "crates/bitty-runtime",
    "crates/bitty-ui",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Bitty terminal workspace"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "emulator", "pty", "vt", "bitty"]
categories = ["command-line-utilities", "emulators"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
