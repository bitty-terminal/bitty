[package]
name = "bitty-render"
description = "GPU rendering pipeline for Bitty (wgpu + harfrust/swash shaped text, crossfont fallback)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["render", "gpu", "wgpu", "terminal", "bitty"]
categories = ["graphics", "rendering"]
publish = true

[lints]
workspace = true
[features]
default = []
# Software fallback seed: a bounded CPU alpha-blit of glyph bitmaps onto an
# in-memory RGBA surface. Opt-in; see `src/software.rs`.
sw-fallback = []


[dependencies]
# ADR-0003 dependency rule 3: bitty-render consumes only the public
# Snapshot/Damage render surface of bitty-term-state, never grid internals.
bitty-term-state = { version = "0.0.31", path = "../bitty-term-state" }
# CTX-1628 (bitty#2760): the renderer consumes the admitted `Scene` snapshot
# (Rich Presentation RFC renderer contract). `bitty-rich` is a presentation
# model crate with no render/GPU edge, so the one-way render -> rich direction
# stays acyclic: `bitty-rich` never depends on `bitty-render`.
bitty-rich = { version = "0.0.31", path = "../bitty-rich" }
# ADR-0003/ADR-0004 platform seam: GpuContext consumes the owned SurfaceTarget
# produced by bitty-platform without leaking winit types.
bitty-platform = { version = "0.0.31", path = "../bitty-platform" }
# Theme preset registry: render consumes bitty-config's single source of
# truth for clear color, default fg/bg, cursor, selection, and ANSI 0-15
# (CTX-0147). bitty-config stays dependency-free (pure std), so no cycle.
bitty-config = { version = "0.0.31", path = "../bitty-config" }
# ADR-0004 rendering rows: ADOPT wgpu (~26.x line); WRAP
# harfrust/swash/fontdb as the production shaped stack (CTX-1607: shape
# with harfrust 0.14, rasterize with swash 0.2 over shared
# skrifa/read-fonts, discover with fontdb 0.24, which vendors its
# query-time parser subset instead of depending on external ttf-parser,
# bitty#1692); WRAP crossfont as the explicit fallback (forced with
# BITTY_TEXT_STACK=classic or selected when shaped init fails).
# Neither upstream type may appear in this crate's public API.
wgpu = "26.0"
crossfont = "0.9"
# HarfBuzz shaping port (MIT, rust-version 1.85 exact). Exact pin: the
# fontations floor drifts under swash (see skrifa note below).
harfrust = "=0.15.0"
# Outline + bitmap rasterization (Apache-2.0 OR MIT, no declared MSRV:
# verified on the 1.85 toolchain by the CTX-0957 implementation task).
# Explicit std+scale+render (== upstream defaults, pinned for audit).
swash = { version = "=0.2.10", default-features = false, features = ["std", "scale", "render"] }
# Font discovery (MIT, rust-version 1.71). memmap stays OFF (owned Vec<u8>
# under MAX_FACE_BYTES instead): no persistent-mmap unsafe, no lifetime
# coupling on the hot path. fontconfig XML discovery stays ON (Linux).
# 0.24 vendors its query-time parser subset: no external ttf-parser edge
# on the fontdb path (bitty#1692; ttf-parser remains only via the
# winit/sctk-adwaita/ab_glyph decoration path until CTX-0961).
fontdb = { version = "=0.24.0", default-features = false, features = ["std", "fs", "fontconfig"] }
# Persistent font-index metadata parser (CTX-1607). ttf-parser is already
# in the dependency graph through the winit/ab_glyph decoration path; this
# direct edge is the pinned version the index is built against. The index
# fills fontdb `FaceInfo`s from it (fontdb itself is the authority for the
# full-scan fallback and for the final query).
ttf-parser = "=0.25.1"
# Font directory + generic-alias discovery for the font index on Linux/BSD.
# Already in the graph through fontdb's `fontconfig` feature; pinned here so
# the index sees the same directory list as `fontdb::Database::load_system_fonts`.
# PATCHES (CTX-1607): the persistent index is additive; setting
# `BITTY_FONT_INDEX=0` restores the upstream full scan for diagnosis.
fontconfig-parser = "=0.5.8"


[dev-dependencies]
# Tests drive the pipeline through real State action scripts; GraphemeCell
# lives in bitty-vt (dev-only edge; the ADR-0003 DAG stays acyclic).
bitty-vt = { version = "0.0.31", path = "../bitty-vt" }
