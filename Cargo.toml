[workspace]
members = [
  "crates/bitty-agent",
  "crates/bitty-app",
  "crates/bitty-compat-lab",
  "crates/bitty-config",
  "crates/bitty-core",
  "crates/bitty-ipc",
  "crates/bitty-lua",
  "crates/bitty-package",
  "crates/bitty-panels",
  "crates/bitty-perf",
  "crates/bitty-platform",
  "crates/bitty-plugin-host",
  "crates/bitty-pty",
  "crates/bitty-rich",
  "crates/bitty-vt",
  "crates/bitty-term-state",
  "crates/bitty-test-support",
  "crates/bitty-test-vm",
  "crates/bitty-render",
  "crates/bitty-runtime",
  "crates/bitty-ui",
]
resolver = "3"

[workspace.package]
version = "0.0.20"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Bitty terminal workspace"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "emulator", "pty", "vt", "bitty"]
categories = ["command-line-utilities", "emulators"]

# Central version policy for direct dependencies shared by more than one crate
# (research 042 item 2). Member manifests consume these with
# `{ workspace = true }` so version drift cannot creep in as the graph grows.
# Features stay declared at the use site: the entries below carry no extra
# features, so no feature is enabled workspace-wide by accident.
[workspace.dependencies]
# Window/event-loop baseline (ADR-0004: adopted inside bitty-platform, used
# again by the bitty-perf real-window trials). Lock resolves this to 0.30.13.
winit = "0.30.13"
# Minimal one-shot executor for the composition root and perf trials.
pollster = "1.0"
# V-C package signatures (OQ-029, bitty#767): pure-Rust Ed25519
# (`ed25519-dalek` 2.x, BSD-3-Clause, rust-version 1.81 <= MSRV 1.85,
# no build script, no network/I/O). Pinned to the 2.x line: the 3.x major
# is new and buys nothing here; re-evaluate on a dated ADR-0004 revision.
ed25519-dalek = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
