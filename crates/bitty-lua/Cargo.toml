[package]
name = "bitty-lua"
description = "Deterministic phodopus Lua VM budgets for Bitty plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["lua", "vm", "phodopus", "bitty"]
categories = ["embedded", "development-tools"]
publish = true

[lints]
workspace = true

[dependencies]
phodopus = { version = "0.2.0", git = "https://github.com/bitty-terminal/phodopus", rev = "f3d6a9b" }
chrono.workspace = true

# bitty#2869: the configuration module loader's descriptor-anchored walk
# (`openat2` with `RESOLVE_BENEATH|RESOLVE_NO_SYMLINKS|RESOLVE_NO_MAGICLINKS`,
# and the per-component `openat` fallback with `O_NOFOLLOW|O_DIRECTORY`). The
# safe wrapper keeps this crate at `#![forbid(unsafe_code)]`; an existing
# workspace dependency, no new crate version.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "std"] }

