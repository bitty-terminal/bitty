# Flathub Flatpak manifest for Bitty (issue #2518).
#
# Unlike most packages here, this is NOT consumed by the release workflow:
# the Flathub submission itself is an owner action. For the submission
# checklist (manifest copies + refresh procedure) see README.md in this
# directory. It therefore avoids relative `path:` sources pointing back into this
# repository, and instead ships everything flatpak-builder needs inside the
# single bundle sources each release already publishes.
#
# Version strategy: every occurrence of the release version is pinned in this
# file and must be refreshed on each release (the SHA256SUMS digests are
# published under https://github.com/bitty-terminal/bitty/releases, so they
# are known ahead of the Flathub re-review).
app-id: run.bitty.Bitty
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: bitty
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  # Allow the terminal to launch host commands through
  # `flatpak-spawn --host` (the standard Flathub escape hatch for
  # terminal emulators, as used by WezTerm and GNOME Console).
  - --talk-name=org.freedesktop.Flatpak
  # Expose host /usr contents read-only under /run/host, so the
  # terminal can detect host shells and run host-side tools.
  - --filesystem=host-os:ro
modules:
  - name: bitty
    buildsystem: simple
    build-commands:
      # bittyd is deliberately not installed (bitty#3004). The bundle carries
      # `bin/bittyd` and `share/systemd/user/bittyd.service`, but the Flatpak
      # sandbox has no systemd user manager, so nothing inside it can enable
      # the unit, and a daemon started here would host shells confined to the
      # sandbox instead of the user's session. The daemon ships on the channels
      # that do have a supervisor (deb/rpm/AUR/prebuilt bundle/install.sh).
      # The omission is recorded again in README.md and in the channel table of
      # packaging/README.md, and gated by
      # scripts/tests/check-distro-recipes.test.sh.
      #
      # The `share/` tree carries the desktop entry, hicolor icons, and
      # AppStream metainfo. Terminfo ships as the raw source `terminfo/bitty.ti`
      # at the bundle ROOT (not inside share/), so it is compiled here with
      # `tic -x`, mirroring PKGBUILD/PKGBUILD.bin/bitty.spec — ncurses cannot
      # read a raw source entry from TERMINFO_DIRS without compilation.
      - install -Dm755 -t /app/bin bin/bitty
      - cp -a share/. /app/share/
      # Drop the bundle's systemd user unit: it points at /usr/bin/bittyd,
      # which this build does not install, and no manager would read it.
      - rm -f /app/share/systemd/user/bittyd.service
      - tic -x -o /app/share/terminfo terminfo/bitty.ti
    # The url and sha256 of each source move together: refresh both from the
    # `*.sha256` sidecar published alongside that release's bundle asset. Never
    # point these at a tag or asset that has not been published yet — the pins
    # would then disagree with what is downloadable and the manifest cannot
    # build. The refresh happens at release time, after the assets are up.
    sources:
      - type: archive
        archive-type: tar-zst
        strip-components: 1
        url: https://github.com/bitty-terminal/bitty/releases/download/v0.0.35/bitty-0.0.35-x86_64-unknown-linux-gnu.tar.zst
        sha256: d9a464c793073ce6ac1dacde03a35898d54e1f4e394bbc0e919e0fea392d55e9
        only-arches:
          - x86_64
      - type: archive
        archive-type: tar-zst
        strip-components: 1
        url: https://github.com/bitty-terminal/bitty/releases/download/v0.0.35/bitty-0.0.35-aarch64-unknown-linux-gnu.tar.zst
        sha256: 17de6d881bccb9a3de1857c3ce7519158aec96a203b85e7e64cc6bdfdb31a14d
        only-arches:
          - aarch64
