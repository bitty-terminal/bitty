[package]
name = "bitty-term-state"
description = "Terminal truth core for Bitty — grid, state, damage, scrollback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "emulator", "grid", "bitty"]
categories = ["data-structures", "emulators"]
publish = true

[lints]
workspace = true

[dependencies]
bitty-vt = { version = "0.0.30", path = "../bitty-vt" }
# CTX-1612 (bitty#1766, OQ-091): UAX #9 resolution for paint-time line
# reordering. MIT OR Apache-2.0, MSRV 1.47, safe Rust, UCD 16.0.0 bidi
# classes (the repo's generated width/cluster tables are UCD 18.0.0; the
# skew is asserted in the conformance fixture). The facade in `src/bidi.rs`
# is the only module that names the crate.
unicode-bidi = "0.3.18"


[dev-dependencies]
proptest = "1"
