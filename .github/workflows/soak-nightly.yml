name: Soak campaign (nightly)

# bitty#2830: the remaining acceptance bullet on the long-uptime
# unresponsiveness class is a long-duration soak campaign. The driver lives in
# `crates/bitty-runtime/tests/soak_campaign.rs` (presentation plane) and
# `crates/bitty-daemon/tests/soak_campaign.rs` (daemon event plane); both are
# `#[ignore]`d, so no PR job pays for them. This workflow is the nightly,
# multi-minute form.
#
# Deliberately NOT part of the PR-required check set (branch protection lists
# only the CI `Quality gates` and platform jobs): a multi-minute campaign on
# every push would spend the review budget without new signal. Manual runs use
# `workflow_dispatch` with an explicit per-plane budget, capped at 600 s so the
# three serial plane runs fit this job's 60-minute timeout; an owner campaign
# that needs hours runs the driver directly with `just soak-campaign <secs>`.
#
# The evidence artifact is the driver's sampled series (`BITTY_SOAK_EVIDENCE_DIR`),
# uploaded even when the campaign fails, so a regression is diagnosable from the
# run page alone.

on:
  schedule:
    # 03:17 UTC daily, off the top of the hour to avoid the scheduler burst.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      duration_secs:
        description: "Wall-clock budget per plane, in seconds (60..600)"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: soak-campaign-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # One target tree per runner, matching the PR jobs' layout.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  # The campaign is debug-built like the rest of the suite; drop DWARF so the
  # runner disk is not spent on symbols the campaign never reads.
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  campaign:
    name: Long-duration soak campaign (${{ inputs.duration_secs || '300' }}s per plane)
    runs-on: ubuntu-24.04
    # Budget accounting inside the 60-minute job timeout, with margin for a
    # cold dependency build plus checkout and setup:
    #
    #   3 x MAX_CAMPAIGN_SECS (600) = 30 min of driving
    #   + 3 x 180 s step margin    =  9 min
    #   + ~20 min cold build       = 59 min
    #
    # The per-plane budget is capped at 600 s for that reason. An owner
    # campaign that needs hours runs the driver directly (the driver itself
    # accepts up to 86,400 s) instead of through this runner-bound job. The
    # campaign also owns a wall-clock bound, so these limits are backstops.
    timeout-minutes: 60
    env:
      # Validity is enforced by the "Clamp campaign budget" step below.
      BITTY_SOAK_CAMPAIGN_SECS: ${{ inputs.duration_secs || '300' }}
      BITTY_SOAK_EVIDENCE_DIR: ${{ github.workspace }}/soak-evidence
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The campaign only reads the tree; never leave the job token in the
          # local git config for later steps.
          persist-credentials: false

      - name: Clamp campaign budget
        run: |
          set -euo pipefail
          secs="${BITTY_SOAK_CAMPAIGN_SECS//[!0-9]/}"
          if [[ -z "$secs" ]]; then secs=300; fi
          if (( secs < 60 )); then secs=60; fi
          if (( secs > 600 )); then secs=600; fi
          echo "BITTY_SOAK_CAMPAIGN_SECS=$secs" >> "$GITHUB_ENV"
          echo "campaign budget: ${secs}s per plane"

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      # bitty-runtime links bitty-render, which links the platform font stack
      # through crossfont/pkg-config.
      - name: Install font stack development libraries
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libfreetype6-dev

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the campaign tracks the PR jobs.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A separate namespace from the PR jobs: the nightly campaign must
          # never evict the cache the required checks depend on.
          prefix-key: v1-soak-campaign
          shared-key: campaign

      # Build first so a compile error is not reported as a campaign timeout.
      - name: Build campaign binaries
        run: |
          set -euo pipefail
          mkdir -p "$BITTY_SOAK_EVIDENCE_DIR"
          cargo test --locked \
            -p bitty-runtime --test soak_campaign \
            -p bitty-daemon --test soak_campaign \
            --no-run 2>&1 | tee "$BITTY_SOAK_EVIDENCE_DIR/build.log"

      # `cargo test` (not nextest) on purpose: the driver owns a wall-clock
      # budget and nextest's slow-timeout would kill a legitimate campaign.
      # Each step gets a bound of its own nominal driving time plus a fixed
      # margin, so a wedge ends that step while the job timeout still has room
      # for the remaining steps. The campaign count is ENUMERATED from the test
      # binary instead of assumed: a new `#[ignore]`d campaign must not silently
      # exceed the step budget. The assumed-two form failed every nightly from
      # 2026-11-04 on, when the idle-baseline campaign became the third one and
      # the step was TERMed mid-campaign (exit 124).
      - name: Run runtime planes
        run: |
          set -euo pipefail
          campaigns=$(cargo test --locked -p bitty-runtime --test soak_campaign \
            -- --ignored --list 2>/dev/null | grep -c ': test$' || true)
          if [ "${campaigns}" -lt 1 ]; then
            echo "::error::no ignored soak campaigns enumerated for bitty-runtime"
            exit 1
          fi
          limit=$(( BITTY_SOAK_CAMPAIGN_SECS * campaigns + 180 ))
          echo "bitty-runtime soak campaigns: ${campaigns} (step budget ${limit}s)"
          timeout --signal=TERM "${limit}s" \
            cargo test --locked -p bitty-runtime --test soak_campaign \
              -- --ignored --nocapture --test-threads=1 2>&1 \
            | tee "$BITTY_SOAK_EVIDENCE_DIR/runtime-planes.log"

      - name: Run daemon event plane
        run: |
          set -euo pipefail
          campaigns=$(cargo test --locked -p bitty-daemon --test soak_campaign \
            -- --ignored --list 2>/dev/null | grep -c ': test$' || true)
          if [ "${campaigns}" -lt 1 ]; then
            echo "::error::no ignored soak campaigns enumerated for bitty-daemon"
            exit 1
          fi
          limit=$(( BITTY_SOAK_CAMPAIGN_SECS * campaigns + 180 ))
          echo "bitty-daemon soak campaigns: ${campaigns} (step budget ${limit}s)"
          timeout --signal=TERM "${limit}s" \
            cargo test --locked -p bitty-daemon --test soak_campaign \
              -- --ignored --nocapture --test-threads=1 2>&1 \
            | tee "$BITTY_SOAK_EVIDENCE_DIR/daemon-plane.log"

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-campaign-evidence-${{ github.run_id }}
          path: soak-evidence/
          if-no-files-found: warn
          retention-days: 30
