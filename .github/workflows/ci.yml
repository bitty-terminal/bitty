  # dependency at an exact revision). The compat release matrix adds a third
  # -- the pinned bitty-compat-lab checkout, also a full product graph from
  # git -- so a large rust-cache restore left the runner with 5 MB free
  # and rust-lld's mmap'd output write died with `signal 7 [Bus error]`
  # (runs 39706484182, 39692561675: `collect2: fatal error: ld terminated
  # with signal 7`). SIGBUS, not SIGKILL: the failure is the disk budget, not
  # memory, and not linker concurrency. One graph per runner makes the budget
  # deterministic, and the required Linux lanes no longer carry the matrix's
  # build on top of their own.
  #
  # Coverage is unchanged: the same eight suites, the same per-suite floors,
  # the same four Tier 1 legs, and the same aggregate gate below -- which now
  # requires these jobs instead of the platform test jobs. There is no
  # `continue-on-error` and no skip list; a compat failure still fails the
  # run.
  #
  # No rust-cache here on purpose: its key would follow the pinned
  # bitty-compat-lab lockfile (stable across product changes), so it would
  # pin a multi-GB target in the shared 10 GiB repo cache quota and evict the
  # product caches. sccache already reuses the pinned graph's objects across
  # runs once the first one warms the namespace.
  compat-linux-x11:
    name: Linux X11 compat matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DISPLAY: :99
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # Bound parallel rustc/link jobs. rust-lld is internally parallel and
      # this is the largest single build on the runner; two jobs keeps the
      # peak disk and memory footprint predictable on a 4-core runner.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      # The suites assert terminal behavior, not backtrace depth. Full
      # debuginfo dominated the test-binary footprint; line tables keep
      # file:line in panic output at a fraction of the size, which is what
      # makes this build fit one runner.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # W-105: pinned bitty-compat-lab checkout (see the validation-pins step).
      BITTY_COMPAT_LAB_DIR: external/bitty-compat-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CTX-0971 R4: same Cargo.lock-scoped sccache namespace as quality and
      # the platform jobs, so the pinned graph's objects are shared.
      - name: Scope sccache namespace to Cargo.lock hash
        run: echo "SCCACHE_GHA_VERSION=v1-$(sha256sum Cargo.lock | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Resolve validation pins
        id: validation-pins
        run: |
          set -a
          . ./validation-pins.env
          set +a
          echo "compat-lab-rev=$BITTY_COMPAT_LAB_REV" >> "$GITHUB_OUTPUT"

      - name: Check out pinned bitty-compat-lab suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitty-terminal/bitty-compat-lab
          ref: ${{ steps.validation-pins.outputs.compat-lab-rev }}
          path: external/bitty-compat-lab

      # The compat-lab graph links against the same font stack / input
      # libraries as the platform job it was extracted from; without them the
      # suites fail to link rather than run.
      - name: Prepare apt archive directory (cache ownership)
        run: sudo mkdir -p /var/cache/apt/archives && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install font stack and X11 input libraries
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-0
          libxkbcommon-dev

      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # #2448: fail with a readable infrastructure signal when the runner
      # image shrinks, instead of letting rust-lld die on an mmap write.
      - name: Check runner disk budget
        run: |
          set -euo pipefail
          min_kb=$((6 * 1024 * 1024))
          avail_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          df -h "$GITHUB_WORKSPACE"
          if [ "$avail_kb" -lt "$min_kb" ]; then
            echo "::error::runner disk budget too small: ${avail_kb} KiB free, ${min_kb} KiB required before the compat build (#2448)"
            exit 1
          fi

      - name: Run compat release matrix
        run: ./scripts/compat-matrix.sh run --platform linux-x11 --out compat-results/linux-x11.tsv

      - name: Upload compat matrix result (linux-x11)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # CTX-1624 / #2753: one stable artifact per platform. `overwrite`
          # replaces it on a re-run, so a partially re-run workflow still
          # leaves exactly one TSV per platform for the Tier 1 aggregate.
          name: compat-results-linux-x11
          path: compat-results/linux-x11*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Show sccache stats (compat-linux-x11)
        if: always()
        run: ${SCCACHE_PATH} --show-stats

      - name: Show disk usage (compat-linux-x11)
        if: always()
        run: df -h "$GITHUB_WORKSPACE"

