  linux-wayland:
    name: Linux Wayland
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CTX-0971 R4: sccache shares dep units with quality/linux-x11 via
    # the same Cargo.lock-scoped GHA namespace (see quality job comment).
    env:
      WAYLAND_DISPLAY: wayland-0
      XDG_SESSION_TYPE: wayland
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # W-105: compat-lab suites run from this pinned checkout (see the
      # validation-pins steps below); runtime M1 suites run in-workspace.
      BITTY_COMPAT_LAB_DIR: external/bitty-compat-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CTX-0971 R4: same Cargo.lock-scoped sccache namespace as quality so
      # the three ubuntu jobs share dep units.
      - name: Scope sccache namespace to Cargo.lock hash
        run: echo "SCCACHE_GHA_VERSION=v1-$(sha256sum Cargo.lock | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Resolve validation pins
        id: validation-pins
        run: |
          set -a
          . ./validation-pins.env
          set +a
          echo "compat-lab-rev=$BITTY_COMPAT_LAB_REV" >> "$GITHUB_OUTPUT"
          echo "perf-rev=$BITTY_PERF_REV" >> "$GITHUB_OUTPUT"

      - name: Check out pinned bitty-perf suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitty-terminal/bitty-perf
          ref: ${{ steps.validation-pins.outputs.perf-rev }}
          path: external/bitty-perf

      - name: Check out pinned bitty-compat-lab suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitty-terminal/bitty-compat-lab
          ref: ${{ steps.validation-pins.outputs.compat-lab-rev }}
          path: external/bitty-compat-lab

      # HK-07: cache downloaded .deb archives across runs (key = OS + the
      # package lists in this file). Install steps below still run
      # unconditionally; a cold archive just refetches.
      - name: Prepare apt archive directory (cache ownership)
        run: sudo mkdir -p /var/cache/apt/archives && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Glob only the .deb files: caching the directory itself makes the
          # post-job save walk into /var/cache/apt/archives/partial, which
          # `apt-get install` recreates as root while downloading. tar then
          # fails with "Cannot open: Permission denied" and emits a cache-save
          # warning. In-progress downloads are not worth caching anyway.
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install font stack and Wayland libraries
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libfreetype6-dev libwayland-dev

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy

      # CTX-0971 R4: sccache on the GHA backend alongside rust-cache below.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # HK-07: compilation cache on the managed Cache backend. Scoped to
      # OS + toolchain (+ job, Cargo.lock, and rustc hashes appended by the
      # action) with prefix fallback on restore. Raw target/ stays out of
      # actions/cache; nothing here keys on sources, and no install step is
      # gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}

      # CTX-0847: nextest (isolated processes, bounded timeouts, capped
      # real-process group) plus explicit doctests and the two harness=false
      # platform entry points that nextest cannot list.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: nextest@0.9.145

      - name: Run tests with Wayland env (nextest ci profile)
        run: cargo nextest run --workspace --locked --profile ci

      - name: Run doctests (Wayland)
        run: cargo test --workspace --doc --locked

      - name: Run harness=false platform entry points (Wayland)
        run: cargo test -p bitty-platform --test headless_run --test winit_window --locked

      # CTX-0847: the previous `--all-targets` run also executed the bitty-perf
      # benches; nextest runs none of them, so that coverage is kept
      # explicitly here, executed in the pinned external bitty-perf checkout
      # (W-105 thin gate). The bitty-ipc example moved with the CTX-1585
      # extraction to the independent bitty-ipc repository (own CI).
      - name: Run benches (Wayland, pinned bitty-perf suite)
        working-directory: external/bitty-perf
        run: cargo test --benches --locked

      # M1-10 / CTX-0574: Wayland leg of the M1 compatibility matrix. The M1
      # suites are display-independent; the Wayland env above only proves the
      # workspace still builds and tests on the Wayland path.
      - name: Run M1 compatibility matrix
        run: ./scripts/m1-matrix.sh run --platform linux-wayland --out m1-results/linux-wayland.tsv

      - name: Upload M1 matrix result (linux-wayland)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-results-linux-wayland
          path: m1-results/linux-wayland.tsv
          if-no-files-found: error
          retention-days: 7

      # PERF-11 / CTX-0692: linux-wayland leg of the compat release matrix.
      # The suites are display-independent; see the linux-x11 leg above.
      - name: Run compat release matrix
        run: ./scripts/compat-matrix.sh run --platform linux-wayland --out compat-results/linux-wayland.tsv

      - name: Upload compat matrix result (linux-wayland)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compat-results-linux-wayland
          path: compat-results/linux-wayland*
          if-no-files-found: error
          retention-days: 7

      # CTX-0971 R4: sccache hit-rate for the expected-savings table.
      - name: Show sccache stats (linux-wayland)
        if: always()
        run: ${SCCACHE_PATH} --show-stats

