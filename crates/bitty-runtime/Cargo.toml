[package]
name = "bitty-runtime"
description = "Runtime orchestration for Bitty Correct Terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "runtime", "bitty"]
categories = ["command-line-utilities"]
publish = true

[lints]
workspace = true

[features]
# Read-only VM accounting and safe construction for the explicit regression.
input-vm-test-support = []
# CTX-1373 (bitty#2199): opt-in Core-side launch seam for authenticated
# provider publication. Default-off: the shipped terminal build keeps no
# TLS, certificate-generation, or crypto-provider surface. Slice 1 ends at
# TLS establishment; `ai_helper` spawn wiring is a follow-up.
publication-control = [
    "dep:bitty-ipc-api",
    "dep:bitty-network-publication",
    "dep:getrandom",
    "dep:libc",
    "dep:zeroize",
]
# Test-only fixture server for the launch seam. `tls12` exists solely so a
# test can build a TLS 1.2-only server and prove the TLS 1.3-only client
# refuses it; the shipped `publication-control` build stays TLS 1.3-only.
# Never enable in a released build.
publication-control-test-support = ["publication-control", "dep:rustls"]

# CTX-0906: hermetic native-component test fixture. Speaks wire protocol v1
# over stdio so the broker integration tests spawn a real coprocess without
# any network access; never installed or packaged (publish = false, and the
# release bundles only ship the `bitty` binary).
[[bin]]
name = "bitty-component-fixture"
path = "src/bin/bitty-component-fixture.rs"
test = false
doc = false

# CTX-1253 (#2123, DIR-030 S-1): hermetic resident-helper test fixture. Speaks
# the accepted bitty-ipc length-prefixed framing over stdio so the
# resident-singleton supervisor integration tests spawn a real coprocess with
# no AI build and no network access; never installed or packaged
# (publish = false, and the release bundles only ship the `bitty` binary).
[[bin]]
name = "bitty-ai-helper-fixture"
path = "src/bin/bitty-ai-helper-fixture.rs"
test = false
doc = false

# bitty#2494: hermetic execution-component fixture. Serves the execution
# component wire protocol v2 by delegating to the pinned
# `bitty_execution::component::server` (the same server the installable
# `bitty-execution` binary ships), with fault-injection modes for the Core
# host client's malformed/oversized-frame, crash, and handshake paths. Never
# installed or packaged (the release bundles only ship the `bitty` binary).
[[bin]]
name = "bitty-execution-component-fixture"
path = "src/bin/bitty-execution-component-fixture.rs"
test = false
doc = false

# bitty#2494: hermetic child for execution parity tests (stdout/stderr, exit
# status, sleep, large output). Keeping it a binary avoids libtest output on
# the child's stdout, which the execution component protocol would reject.
[[bin]]
name = "bitty-execution-job-fixture"
path = "src/bin/bitty-execution-job-fixture.rs"
test = false
doc = false

[dependencies]
bitty-config = { version = "0.0.27", path = "../bitty-config" }
bitty-vt = { version = "0.0.27", path = "../bitty-vt" }
bitty-term-state = { version = "0.0.27", path = "../bitty-term-state" }
bitty-pty = { version = "0.0.27", path = "../bitty-pty" }
bitty-render = { version = "0.0.27", path = "../bitty-render" }
bitty-platform = { version = "0.0.27", path = "../bitty-platform" }
bitty-ui = { version = "0.0.27", path = "../bitty-ui" }
bitty-lua = { version = "0.0.27", path = "../bitty-lua" }
bitty-plugin-host = { version = "0.0.27", path = "../bitty-plugin-host" }
# CTX-1151 (#1984): inherited-OS-confinement adapter for admitted tool
# spawns (Linux Landlock; fail-closed degrade elsewhere). First-party
# workspace crate, no new supply-chain surface (its only syscall dep is the
# workspace `libc`, Linux-gated there).
bitty-sandbox = { version = "0.0.27", path = "../bitty-sandbox" }
# `version` below is required for `cargo publish` (lockfile pins 0.0.1 for
# each); the git rev stays the build source until each crate lands on
# crates.io (see CTX-1172 publish order notes).
bitty-ipc = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-ipc", rev = "9493674" }
# Issue #2249 (W-140 integration): tool/plugin spawns route through the
# extracted execution supervisor's `JobRegistry`, so every mediated spawn has
# a real job identity, lifecycle, cancellation, and bounded output instead of
# a Core-local one-shot supervisor. The pin carries the host
# `SpawnPreparer` seam Core uses for CTX-1151 Landlock exec confinement and
# the `bitty-ipc` revision shared with this workspace. bitty#2494 adds the
# executable component protocol/server. Core's
# `bitty-runtime::execution_jobs` and `bitty-runtime::execution_component`
# are the only modules allowed to name the extension implementation (W-147
# seam exception). Re-pin to the merged #2494 component commit before this
# workspace merges it; until then the revision is the component PR tip.
bitty-execution = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-execution", rev = "36404ab" }
# CTX-1390 (bitty#2322): the pure provider-publication control-record contract
# (header, bodies, canonical payload, named bounds). Optional and enabled only
# by `publication-control`: the control driver reuses this codec instead of
# defining a second wire format. Same git source and rev as the `bitty-ipc`
# pin above, so Cargo resolves one `bitty-ipc-api` package.
bitty-ipc-api = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-ipc", rev = "9493674", optional = true }
# CTX-0406: the package-manager staging path evaluates the closed compat
# requirement grammar with the same pure implementation the plugin host uses.
bitty-package = { version = "0.0.27", path = "../bitty-package" }
# CTX-0248: the tick overlay path stores Kitty images and computes
# placement rects through the rich layer (moved from dev-dependencies;
# same workspace crate, no new supply-chain surface).
bitty-rich = { version = "0.0.27", path = "../bitty-rich" }
# CTX-0906 (DIR-030): the component broker speaks native-component wire
# protocol v1 to out-of-process components (first: `bitty-net`). On this path
# Core links only the dependency-free codec crate, never a general network
# implementation crate; same exact-rev pin pattern as `bitty-ipc`.
bitty-network-wire = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-network", rev = "c8710e0" }
# CTX-1373 (bitty#2199): launch-scoped mutual-certificate provider-publication
# control transport (launch material, bounded bootstrap manifest, TLS 1.3
# client). Opt-in behind `publication-control`; same exact-rev pin pattern as
# `bitty-ipc` / `bitty-network-wire` (7-char short SHA, merged main c8710e0).
bitty-network-publication = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-network", rev = "c8710e0", optional = true }
# CTX-1373: OS-random launch/channel nonces. Already resolved through
# `bitty-ipc-auth`; the direct edge is optional and needs no new crate version.
getrandom = { version = "0.4", optional = true }
# CTX-1373: serialized bootstrap record zeroization. Optional and feature-bound
# so the default terminal build keeps no extra dependency edge.
zeroize = { version = "=1.9.0", optional = true }
# CTX-1373: fixture-side TLS server for the feature-gated launch tests only
# (`publication-control-test-support`). The shipped client configuration stays
# TLS 1.3-only; this optional dev-facing edge is never part of a terminal build.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws-lc-rs", "tls12"], optional = true }
# Issue #1760 (OQ-004): plaintext URL pattern detection wires the
# dependency-free matcher crate (`bitty-url-detector` v0.0.1, `forbid(unsafe)`,
# `std` only) into the same `ValidatedUrl` + `ActivationGesture` pipeline as
# OSC 8. No crates.io release yet, so the same git-rev pin convention as
# `bitty-ipc` / `bitty-network-wire` applies (7-char short SHA).
bitty-url-detector = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-url-detector", rev = "be035a0" }
# CTX-1008 (#1763, OQ-076) plus CTX-1178 (#1998): Core consumes the
# platform notification bridge as its single OS-notification dispatch path.
# Same exact-rev pin pattern as `bitty-ipc` / `bitty-network-wire`: the
# bridge receives an already-gated `{title, body}` pair, applies the
# defensive second rate cap, and delivers through the real per-platform
# backend (`LinuxDbusBackend` / `MacosBackend`, fail-closed elsewhere).
# Pinned to the real-backends commit; the bootstrap rev carried stubs only.
bitty-platform-services = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-platform-services", rev = "7c6b84b" }

# CORE-RUN-003 (#1526): the supervisor claim lock is an OS-held `flock`.
# Same workspace pins and platform split as `bitty-ipc` (no new crates).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
# CTX-1373: `pipe` backs the one-shot bootstrap channel for the opt-in
# publication-control launch seam. The safe wrapper keeps channel creation out
# of the adapter's single audited unsafe block.
rustix = { workspace = true, features = ["fs", "pipe", "std"] }

# CTX-1373: the single audited pre-exec hook (`ai_publication_launch/unix.rs`)
# duplicates the inherited child descriptors with `fcntl`/`dup2`/`close`. Same
# workspace `libc` line already linked by bitty-pty/bitty-sandbox; no new crate
# version. Optional: only the `publication-control` feature compiles the
# adapter that uses it.
#
# bitty#2494: `nix` is also the safe Unix process-group signal surface for the
# execution component host client (own group on spawn, group kill on loss).
# `fs` serves the BSD/macOS activation record opener; `signal` provides
# `killpg` without adding an `unsafe` block.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }
nix = { workspace = true, features = ["fs", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }


[dev-dependencies]
# Hermetic `ServeContext` constructors and unbound bearer minters (#1519).
bitty-ipc = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-ipc", rev = "9493674", features = ["test-support"] }
bitty-test-support = { path = "../bitty-test-support" }
# CTX-1361: the production component-host slice drives the real
# `bitty extension add` implementation through the composition-root library
# target instead of re-creating the staging layout in the test. Cargo allows
# this test-only cycle (the library's normal dependency on this crate stays
# the only production edge).
bitty-terminal = { path = "../bitty-terminal" }

# CTX-0903: Windows liveness probes for the owned-tree tests (safe API of
# the first-party Job Object adapter; no new third-party crate).
[target.'cfg(windows)'.dev-dependencies]
bitty-winjob = { path = "../bitty-winjob" }
