[package]
name = "bitty-platform"
description = "Window and event-loop adapter for Bitty (wraps winit)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["window", "winit", "platform", "bitty"]
categories = ["gui", "os"]
publish = true

[lints]
workspace = true
[features]
# Opt-in integration tests that require a live display server (Wayland/X11).
# They are excluded from CI and from the default test run; execute locally with
# `cargo test -p bitty-platform --features gui-tests`.
gui-tests = []
# Headless mode marker: no code is gated behind it, but the feature exists so
# `cargo test --features headless` still exercises the headless fallback
# (`App::run` -> DisplayUnavailable) without requiring a window system.
# CI never enables gui-tests; the default run proves headless still works.
headless = []
# In-memory EventContext backend; never enabled by default release builds.
input-vm-test-support = []

# Runs as a plain process entry point (`harness = false`) because winit
# requires event-loop creation on the OS main thread; see the file header.

[dependencies]
winit = { workspace = true }
# Wayland-first clipboard: `wayland-data-control` enables arboard's
# wl-clipboard-rs backend, which selects Wayland when `WAYLAND_DISPLAY` is set
# and falls back to X11 otherwise (see `src/clipboard.rs`). The `wl-clipboard-rs`
# dependency reuses the `wayland-client`/`wayland-protocols` stack already
# vendored via `winit`, so no new protocol stack is introduced.
# CTX-0922: default features are off; Bitty uses the text API only, so the
# default `image-data` feature (the `image` crate plus image-only
# CoreGraphics/GDI bindings) is not linked.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
# ADR-0004 wrapper-rule exception: raw display/window handles are unavoidable
# at the GPU surface boundary (wgpu 25 consumes 0.6), so the exact version is
# pinned and re-exported; see crate-level ownership rules and src/surface.rs.
raw-window-handle = "=0.6.2"

# CTX-1315 (R-004): bounded Wayland text acquisition lives in
# `src/clipboard_bounded.rs`. `wl-clipboard-rs` and `nix` are already in the
# lockfile (the former transitively through `arboard 3.6.1` at 0.9.3, the
# latter through the PTY/runtime crates), so this declares the direct surface
# the bound needs without adding or upgrading a crate version. The direct
# import exists because `arboard` exposes no bounded or deadline-aware read;
# its own private Wayland module is not copied. CTX-1366 adds a bounded X11
# client, a bounded Windows `GlobalSize` scan, and a macOS read refusal;
# `arboard` remains for writes and clear only.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "emscripten"))))'.dependencies]
wl-clipboard-rs = "0.9"
# `poll` bounds the Wayland transfer deadline. The X11 flood regression test
# adds the `socket` feature through a dev-dependency below, so release builds
# do not compile that surface.
nix = { workspace = true, features = ["poll"] }
# CTX-1366: bounded X11 acquisition replaces the unbounded `arboard` property /
# INCR read. `x11rb` 0.13.2 is already in the lockfile through `arboard` and
# `winit`, so this declares the direct surface the bounded client needs without
# adding or upgrading a crate version.
x11rb = { version = "0.14", default-features = false }

# CTX-1366: bounded Windows read uses the safe `clipboard-win::raw` wrappers
# (`size` is `GlobalSize` before any copy; `get` copies into a caller-sized
# slice). The crate is already in the lockfile through `arboard 3.6.1` at
# 5.4.1.
[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["std"] }


[[test]]
name = "headless_run"
harness = false

[[test]]
name = "winit_window"
harness = false

# CTX-1366: the X11 socket-level flood regression test sizes its Unix socket
# buffers with nix's safe `setsockopt` wrapper. Dev-only, so release builds
# compile nix with `poll` only.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "emscripten"))))'.dev-dependencies]
nix = { workspace = true, features = ["socket"] }
