          ref: ${{ steps.validation-pins.outputs.compat-lab-rev }}
          path: external/bitty-compat-lab

      # HK-07: cache downloaded .deb archives across runs (key = OS + the
      # package lists in this file). Install steps below still run
      # unconditionally; a cold archive just refetches.
      - name: Prepare apt archive directory (cache ownership)
        run: sudo mkdir -p /var/cache/apt/archives && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Glob only the .deb files: caching the directory itself makes the
          # post-job save walk into /var/cache/apt/archives/partial, which
          # `apt-get install` recreates as root while downloading. tar then
          # fails with "Cannot open: Permission denied" and emits a cache-save
          # warning. In-progress downloads are not worth caching anyway.
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install font stack and xvfb
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-0
          libxkbcommon-dev xvfb

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy

      # CTX-0971 R4: sccache on the GHA backend alongside rust-cache below.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # HK-07: compilation cache on the managed Cache backend. Scoped to
      # OS + toolchain (+ job, Cargo.lock, and rustc hashes appended by the
      # action) with prefix fallback on restore. Raw target/ stays out of
      # actions/cache; nothing here keys on sources, and no install step is
      # gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}

      # CTX-0847: nextest (isolated processes, bounded timeouts, capped
      # real-process group) plus explicit doctests and the two harness=false
      # platform entry points that nextest cannot list.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.145

      - name: Run tests under xvfb (X11, nextest ci profile)
        run: xvfb-run -a cargo nextest run --workspace --locked --profile ci

      - name: Run doctests (X11)
        run: cargo test --workspace --doc --locked

      - name: Run harness=false platform entry points (X11)
        run: xvfb-run -a cargo test -p bitty-platform --test headless_run --test winit_window --locked

      # bitty#2605: the real-service conformance row runs in the Linux Tier-1
      # job. The corpus records typed skips for the injected-clock and
      # adapter-owned rows; a fake pass never closes a real row. The parity
      # document compares the two typed signatures.
      - name: Run bittyd conformance (real service)
        run: cargo test -p bitty-daemon --test conformance --locked

      - name: Upload bittyd conformance evidence (linux-x86_64)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bittyd-conformance-linux-x86_64
          path: |
            target/conformance/linux-x86_64.real.json
            target/conformance/linux-x86_64.parity.json
          if-no-files-found: error
          retention-days: 7

      # #2561: report the budget before the bench build and fail with an
      # infrastructure signal when it cannot fit (see the quality job step).
      - name: Report bench disk budget (X11)
        run: ./scripts/ci-disk-budget.sh --label "before pinned bitty-perf benches (X11)" --min-free-mib 6144

      # CTX-0847: the previous `--all-targets` run also executed the bitty-perf
      # benches; nextest runs none of them, so that coverage is kept
      # explicitly here (headless, opt-in benches exit 0 with UNMEASURED
      # without their BITTY_PERF_* env gates), executed in the pinned
      # external bitty-perf checkout (W-105 thin gate). The bitty-ipc example
      # moved with the CTX-1585 extraction to the independent bitty-ipc
      # repository (own CI).
      - name: Run benches (X11, pinned bitty-perf suite)
        working-directory: external/bitty-perf
        env:
          # #2561: each bench binary statically links the whole product graph,
          # so bound concurrent rustc/link jobs to keep the peak predictable.
          CARGO_BUILD_JOBS: "2"
        run: cargo test --benches --locked

      # #2561: peak footprint of the bench build, and proof that it compiled
      # into the shared workspace target dir instead of a second tree.
      - name: Report bench disk usage (X11)
        if: always()
        run: ./scripts/ci-disk-budget.sh --label "after pinned bitty-perf benches (X11)"

      # #2448 / #2561: the bench graph now lives in the shared workspace
      # target dir, so M1 below reuses it and there is no separate perf tree to
      # free. Keep the removal as a fail-safe: it drops a stale tree restored
      # from cache or reintroduced by a step-level CARGO_TARGET_DIR, so one
      # runner never holds two product graphs again.
      - name: Reclaim perf build directory
        run: |
          rm -rf external/bitty-perf/target
          df -h "$GITHUB_WORKSPACE"

      # M1-10 / CTX-0574: run the M1 evidence suites by name so a
      # per-platform regression is a distinct, reported result instead of
      # being buried in the blanket test run above. The suites are headless
      # (Parser -> State, plus the deterministic headless rasterizer) and need
      # no display, so this step does not use xvfb.
      - name: Run M1 compatibility matrix
        run: ./scripts/m1-matrix.sh run --platform linux-x11 --out m1-results/linux-x11.tsv

      - name: Upload M1 matrix result (linux-x11)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-results-linux-x11
          path: m1-results/linux-x11.tsv
          if-no-files-found: error
          retention-days: 7

      # PERF-11 / CTX-0692: the compat release matrix leg for this platform
      # runs in `compat-linux-x11` (#2448); M1 evidence stays here because the
      # required Linux lanes must keep proving it.
      # CTX-0971 R4: sccache hit-rate for the expected-savings table.
      - name: Show sccache stats (linux-x11)
        if: always()
        run: ${SCCACHE_PATH} --show-stats

