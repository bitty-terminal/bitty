[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# ttf-parser (winit/metal paths) and paste are unmaintained upstream; the
# advisories are tracked here and ignored until the replacement lands, matching
# the cargo-audit step in CI (ADR-0004 maintenance policy).
# Time bound (CTX-0634, P0-AC-034 exception policy): re-check both upstream
# replacements no later than 2027-03-31 and drop each ignore when its
# replacement lands; any extension needs a dated ADR-0004 revision.
ignore = ["RUSTSEC-2026-0192", "RUSTSEC-2024-0436"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
# ADR-0004 rule 5 admits the permissive core set (MIT, Apache-2.0, BSD, ISC,
# Zlib). The extras below are permissive licenses in use by unavoidable
# transitive dependencies and are recorded for the ADR-0004 revision:
# Unicode-3.0 -> unicode-ident, CC0-1.0 -> hexf-parse (naga),
# BSL-1.0 -> clipboard-win / error-code (arboard on Windows).
# CDLA-Permissive-2.0 (webpki-root-certs) left the graph with the embedded
# bitty-network-lua path (CTX-0906, DIR-030).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.8
# ADR-0004 rule 5 prohibits MPL-2.0 anywhere in the shipped dependency graph.
# The single MPL-2.0 node is dwrote (crossfont's Windows DirectWrite binding),
# which has no permissive alternative today; scope it per crate instead of a
# global allowance and revisit when crossfont drops dwrote (CTX-0505).
# Time bound (CTX-0634, P0-AC-034 exception policy): re-check no later than
# 2027-03-31; any further copyleft node needs a dated ADR-0004 revision.
exceptions = [{ allow = ["MPL-2.0"], crate = "dwrote" }]

[licenses.private]
ignore = true
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Exact-rev git pins only. phodopus is the direct swap target (RUN-28);
# kyren/gc-arena is phodopus's own rev-pinned transitive dep (arena backing
# for the Lua GC), not bitty's choice — kept visible here rather than hidden
# behind a wildcard so any new git source still fails loudly.
# bitty-network is pinned to commit c69fe57 for the `bitty-network-wire`
# crate only (CTX-0906, DIR-030): the dependency-free native-component wire
# protocol v1 codec the component broker speaks to out-of-process components.
# Core never links a bitty-network implementation crate (HTTP/TLS/DNS stay
# in the separately installed `bitty-net` component); the embedded
# `bitty-network-lua` path at d97c5da was removed.
# bitty-ipc is a first-party extraction target (CTX-1585, bitty#1585) and
# stays linked as Core's inbound socket mechanism (DIR-030): pulled from the
# independent bitty-terminal/bitty-ipc repository at an exact rev (e9714e7) by
# bitty-runtime/bitty-terminal/bitty-rich, following the same
# adopted-as-git-dependency pattern as bitty-network (CTX-0917). bitty-agent
# is no longer linked by Core (CTX-0918); it lives in its own repository.
# Time bound (CTX-0634, P0-AC-034 exception policy): re-audit all pins
# (rev freshness, source trust) no later than 2027-03-31; any new git source
# needs a dated ADR-0004/ADR-0012 revision, never a silent allowlist edit.
# bitty-storage is a first-party extraction target (W-146, CTX-0939, bitty
# #1622): the bounded isolated storage mechanics behind the Core-owned
# durable-commit seam. Linked ONLY by the application wiring crate
# (bitty-terminal) at an exact rev (5e720b4, post-merge main: session codec,
# atomic IO, KV backend); no Core library crate links it (Core consumes
# persistence exclusively through Core-owned traits). std-only API (no
# database, serialization, PTY, or Core dependency). The approving boundary
# decisions are DEC-W146-1..4 (W-131/W-137 accepted); a dated ADR-0004/
# ADR-0012 revision recording this source is tracked as a CTX-0939
# follow-up. Falls under the same 2027-03-31 re-audit bound above.
allow-git = [
    "https://github.com/bitty-terminal/phodopus",
    "https://github.com/kyren/gc-arena",
    "https://github.com/bitty-terminal/bitty-network",
    "https://github.com/bitty-terminal/bitty-ipc",
    "https://github.com/bitty-terminal/bitty-storage",
]
