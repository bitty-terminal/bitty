[workspace]
members = [
  "crates/bitty-terminal",
  "crates/bitty-config",
  "crates/bitty-lua",
  "crates/bitty-package",
  "crates/bitty-platform",
  "crates/bitty-plugin-host",
  "crates/bitty-pty",
  "crates/bitty-rich",
  "crates/bitty-sandbox",
  "crates/bitty-vt",
  "crates/bitty-term-state",
  "crates/bitty-test-support",
  "crates/bitty-test-vm",
  "crates/bitty-render",
  "crates/bitty-runtime",
  "crates/bitty-ui",
  "crates/bitty-winjob",
]
resolver = "3"

[workspace.package]
version = "0.0.25"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Bitty terminal workspace"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "emulator", "pty", "vt", "bitty"]
categories = ["command-line-utilities", "emulators"]

# Central version policy for direct dependencies shared by more than one crate
# (research 042 item 2). Member manifests consume these with
# `{ workspace = true }` so version drift cannot creep in as the graph grows.
# Features stay declared at the use site: the entries below carry no extra
# features, so no feature is enabled workspace-wide by accident.
[workspace.dependencies]
# Window/event-loop baseline (ADR-0004: adopted inside bitty-platform, used
# again by the bitty-perf real-window trials). Lock resolves this to 0.30.13.
winit = "0.30.13"
# Minimal one-shot executor for the composition root and perf trials.
pollster = "1.0"
# V-C package signatures (OQ-029, bitty#767): pure-Rust Ed25519
# (`ed25519-dalek` 2.x, BSD-3-Clause, rust-version 1.81 <= MSRV 1.85,
# no build script, no network/I/O). Pinned to the 2.x line: the 3.x major
# is new and buys nothing here; re-evaluate on a dated ADR-0004 revision.
ed25519-dalek = "3"
rustix = { version = "1.1.4", default-features = false }
nix = { version = "0.31.3", default-features = false }
# CTX-1020: errno constants for the Unix PTY backend's transient-spawn
# classifier (`EPERM`/`ENOTTY` from the child `TIOCSCTTY`). Lock already
# carries the 0.2 line via `portable-pty`; no new crate version.
libc = { version = "0.2", default-features = false }
# Local calendar conversion for the restricted Lua `os.date` (owner report:
# the clock showed UTC). Safe Rust, MIT OR Apache-2.0, no build script.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# CTX-0903 (DEC-0083): Win32 bindings for the `bitty-winjob` Job Object
# adapter only (MIT OR Apache-2.0, rust-version 1.71 <= MSRV 1.85). Reuses
# the 0.61.2 line already in the lockfile; no new crate version.
windows-sys = { version = "0.61", default-features = false }

# bitty#2249: the execution extension is compiled against the workspace's
# current Core mechanism crates instead of its own older `bitty` git pin.
# Without this patch Cargo builds two `bitty-pty`/`bitty-plugin-host` trees
# (0.0.21 from the extension pin and 0.0.25 path crates), which duplicates
# Core code in the shipped graph and makes the compat-lab `live_compat` link
# exceed the Linux runner's linker budget. The patch does not change the
# extension's public contract or its exact `bitty-execution` pin; it aligns
# the one-way extension -> Core mechanism edge with this workspace
# (the W-132 contract's "workspace path dependency vs pinned dependency"
# integration choice).
[patch."https://github.com/bitty-terminal/bitty"]
bitty-pty = { path = "crates/bitty-pty" }
bitty-plugin-host = { path = "crates/bitty-plugin-host" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

