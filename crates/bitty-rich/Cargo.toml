[package]
name = "bitty-rich"
description = "Rich presentation helpers for Bitty (draft)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "rich", "bitty"]
categories = ["text-processing"]
publish = false

[lints]
workspace = true

[dependencies]
bitty-term-state = { path = "../bitty-term-state" }
bitty-vt = { path = "../bitty-vt" }
bitty-platform = { path = "../bitty-platform" }
# 256-bit one-time clipboard-read tokens (CTX-0213). Pinned to the locked
# 0.3.x line; no other RNG is used so token entropy is auditable in one place.
getrandom = "0.3"


[dev-dependencies]
bitty-vt = { path = "../bitty-vt" }
