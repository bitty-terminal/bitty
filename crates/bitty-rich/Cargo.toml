[package]
name = "bitty-rich"
description = "Rich presentation helpers for Bitty (draft)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "rich", "bitty"]
categories = ["text-processing"]
publish = false

[lints]
workspace = true

[dependencies]
bitty-term-state = { path = "../bitty-term-state" }
bitty-vt = { path = "../bitty-vt" }
bitty-platform = { path = "../bitty-platform" }
# Fragment-to-RichBlock projection (CTX-0439) reads the bounded ingestion
# DTOs; workspace-internal edge, no new supply-chain surface.
bitty-ipc = { git = "https://github.com/bitty-terminal/bitty-ipc", rev = "e9714e7" }
# 256-bit one-time clipboard-read tokens (CTX-0213). Pinned to the locked
# 0.4.x line; no other RNG is used so token entropy is auditable in one place.
getrandom = "0.4"
# W-141: the bounded Kitty PNG codec (`png = "0.18"`) traveled with the
# decode unit to the `bitty-graphics` extension crate. Core retains no PNG
# edge; background decode (CTX-0347) stays Core-owned via the `image`
# facade below and is out of extraction scope.
# Background-image decode (CTX-0347, RFC-0001/OQ-042): the accepted format set
# is PNG + JPEG (baseline/progressive) + static WebP. PNG alone is already
# covered by `png`; JPEG/WebP need their own decoders, and the `image` facade
# is already in the tree (lockfile edge via `arboard` -> `bitty-platform`), so
# this direct edge only narrows the feature set (`default-features = false`)
# instead of adding a new codec stack. Animated/multi-frame containers are
# rejected by our own header sniff before this decoder ever runs.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }


[dev-dependencies]
bitty-test-support = { path = "../bitty-test-support" }
bitty-vt = { path = "../bitty-vt" }
