[package]
name = "bitty-platform"
description = "Window and event-loop adapter for Bitty (wraps winit)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["window", "winit", "platform", "bitty"]
categories = ["gui", "os"]
publish = true

[lints]
workspace = true
[features]
# Opt-in integration tests that require a live display server (Wayland/X11).
# They are excluded from CI and from the default test run; execute locally with
# `cargo test -p bitty-platform --features gui-tests`.
gui-tests = []
# Headless mode marker: no code is gated behind it, but the feature exists so
# `cargo test --features headless` still exercises the headless fallback
# (`App::run` -> DisplayUnavailable) without requiring a window system.
# CI never enables gui-tests; the default run proves headless still works.
headless = []

# Runs as a plain process entry point (`harness = false`) because winit
# requires event-loop creation on the OS main thread; see the file header.

[dependencies]
winit = "0.30"
# Wayland-first clipboard: `wayland-data-control` enables arboard's
# wl-clipboard-rs backend, which selects Wayland when `WAYLAND_DISPLAY` is set
# and falls back to X11 otherwise (see `src/clipboard.rs`). The `wl-clipboard-rs`
# dependency reuses the `wayland-client`/`wayland-protocols` stack already
# vendored via `winit`, so no new protocol stack is introduced.
arboard = { version = "3.6", features = ["wayland-data-control"] }
# ADR-0004 wrapper-rule exception: raw display/window handles are unavoidable
# at the GPU surface boundary (wgpu 25 consumes 0.6), so the exact version is
# pinned and re-exported; see crate-level ownership rules and src/surface.rs.
raw-window-handle = "=0.6.2"


[[test]]
name = "headless_run"
harness = false

[[test]]
name = "winit_window"
harness = false
