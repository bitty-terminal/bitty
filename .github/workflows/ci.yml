      # table (remote CI is the measurement; no live timing run locally).
      - name: Show sccache stats (shard ${{ matrix.shard }}/2)
        if: always()
        run: ${SCCACHE_PATH} --show-stats

  # CTX-1363 (#2255): extracted-extension pins move only in a dedicated task,
  # so the table must show the distance from upstream main. Policy: a pin not
  # reachable from upstream main fails; over-threshold drift (default 10
  # commits) annotates a warning; an unreachable upstream (offline) skips
  # with a clear message. The fixture test is hermetic and runs first.
  pins:
    name: Extension pin drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check extracted-extension pin drift
        run: |
          bash scripts/tests/check-extension-pins.test.sh
          bash scripts/check-extension-pins.sh

  msrv:
    name: MSRV 1.85 check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # HK-07: cache downloaded .deb archives across runs (key = OS + the
      # package lists in this file). Install steps below still run
      # unconditionally; a cold archive just refetches.
      - name: Prepare apt archive directory (cache ownership)
        run: sudo mkdir -p /var/cache/apt/archives && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Glob only the .deb files: caching the directory itself makes the
          # post-job save walk into /var/cache/apt/archives/partial, which
          # `apt-get install` recreates as root while downloading. tar then
          # fails with "Cannot open: Permission denied" and emits a cache-save
          # warning. In-progress downloads are not worth caching anyway.
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install font stack development libraries
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libfreetype6-dev

      - name: Install MSRV toolchain 1.85
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # MSRV floor; must match the rust-version in Cargo.toml.
          toolchain: 1.85
          components: clippy

      # HK-07: compilation cache on the managed Cache backend. The toolchain
      # is part of the key, so MSRV 1.85 never shares target cache with the
      # pinned channel (the action also appends job, Cargo.lock, and rustc
      # hashes, with prefix fallback on restore). Nothing here keys on
      # sources, and no install step is gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust-${{ runner.os }}-1.85

      # CTX-0697: deny rustc warnings so new warnings fail CI going forward.
      - name: Check MSRV compilation
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo +1.85 check --workspace --all-targets --locked

  linux-x11:
    name: Linux X11 (xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # CTX-0971 R4: sccache shares dep units with quality/linux-wayland via
    # the same Cargo.lock-scoped GHA namespace (see quality job comment).
    env:
      DISPLAY: :99
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # W-105: compat-lab suites run from this pinned checkout (see the
      # validation-pins steps below); runtime M1 suites run in-workspace.
      BITTY_COMPAT_LAB_DIR: external/bitty-compat-lab
      # #2561: one target tree for the whole job. The pinned bitty-perf bench
      # build, and the M1 compat-lab suites this job runs through
      # scripts/m1-matrix.sh, all compile into this workspace's target dir
      # instead of allocating their own full debug tree beside it (ld SIGBUS,
      # then ENOSPC; see the quality job comment).
