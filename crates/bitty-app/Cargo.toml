[package]
name = "bitty-app"
description = "Bitty terminal binary — thin composition root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "bitty"]
categories = ["command-line-utilities"]
publish = false

[lints]
workspace = true

[[bin]]
name = "bitty"
path = "src/main.rs"

[dependencies]
bitty-config = { path = "../bitty-config" }
bitty-ipc = { path = "../bitty-ipc" }
bitty-perf = { path = "../bitty-perf" }
bitty-platform = { path = "../bitty-platform" }
bitty-plugin-host = { path = "../bitty-plugin-host" }
bitty-runtime = { path = "../bitty-runtime" }
bitty-render = { path = "../bitty-render" }
bitty-term-state = { path = "../bitty-term-state" }
pollster = "1.0"

[dev-dependencies]
bitty-test-support = { path = "../bitty-test-support" }
