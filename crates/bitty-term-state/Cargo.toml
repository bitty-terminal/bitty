[package]
name = "bitty-term-state"
description = "Terminal truth core for Bitty — grid, state, damage, scrollback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "emulator", "grid", "bitty"]
categories = ["data-structures", "emulators"]
publish = true

[lints]
workspace = true

[dependencies]
bitty-vt = { version = "0.0.1", path = "../bitty-vt" }


[dev-dependencies]
proptest = "1"
# Test-only dev-graph cycle exception (ses_fb7edd547 low #3):
# bitty-term-state (prod) -> bitty-vt only; this dev-dep on bitty-ui is used
# solely by `tests/resize_scrollback.rs` to exercise View+State composition
# headlessly and does not affect the production dependency graph. Candidate
# alternative is to move that test to `bitty-runtime`/`bitty-ui`; kept here with
# this documented exception to preserve locality of the singular reflow proof.
bitty-ui = { path = "../bitty-ui" }
