# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
# nfpm configuration for Bitty terminal
# Supports: deb (Debian/Ubuntu), rpm (Fedora/RHEL/OpenSUSE), apk (Alpine), archlinux (Arch/AUR)
name: bitty
arch: amd64
platform: linux
version: 0.0.20
section: utils
priority: optional
maintainer: Bitty Maintainers <maintainers@bitty-terminal.dev>
description: Bitty pre-alpha terminal workspace minimal correct terminal
vendor: Bitty Terminal
homepage: https://github.com/bitty-terminal/bitty
license: MIT OR Apache-2.0
contents:
  - src: ./target/release/bitty
    dst: /usr/bin/bitty
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/licenses/bitty/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/bitty/README.md
  - src: ./CHANGELOG.md
    dst: /usr/share/doc/bitty/CHANGELOG.md
  - src: ./packaging/run.bitty.Bitty.desktop
    dst: /usr/share/applications/run.bitty.Bitty.desktop
  - src: ./packaging/run.bitty.Bitty.metainfo.xml
    dst: /usr/share/metainfo/run.bitty.Bitty.metainfo.xml
  - src: ./packaging/icons/hicolor/16x16/apps/bitty.png
    dst: /usr/share/icons/hicolor/16x16/apps/bitty.png
  - src: ./packaging/icons/hicolor/32x32/apps/bitty.png
    dst: /usr/share/icons/hicolor/32x32/apps/bitty.png
  - src: ./packaging/icons/hicolor/64x64/apps/bitty.png
    dst: /usr/share/icons/hicolor/64x64/apps/bitty.png
  - src: ./packaging/icons/hicolor/128x128/apps/bitty.png
    dst: /usr/share/icons/hicolor/128x128/apps/bitty.png
  - src: ./packaging/icons/hicolor/256x256/apps/bitty.png
    dst: /usr/share/icons/hicolor/256x256/apps/bitty.png
  - src: ./packaging/icons/hicolor/512x512/apps/bitty.png
    dst: /usr/share/icons/hicolor/512x512/apps/bitty.png
  - src: ./packaging/icons/hicolor/scalable/apps/bitty.svg
    dst: /usr/share/icons/hicolor/scalable/apps/bitty.svg
deb:
  fields:
    Bugs: https://github.com/bitty-terminal/bitty/issues
    Origin: bitty-terminal
rpm:
  summary: Bitty terminal minimal correct terminal
  group: Applications/System
archlinux:
  pkgbase: bitty
  packager: Bitty Maintainers <maintainers@bitty-terminal.dev>
# Runtime dependencies per format (034 item 4): the packages that provide the
# ELF sonames the release binary links (fontconfig, FreeType, libgcc_s), in
# each distro's package nomenclature. Keep in sync with
# packaging/linux/runtime-deps.toml; scripts/check-runtime-deps.sh fails the
# package when these declared names diverge from the binary's ldd/readelf -d
# output. Base libraries (glibc, musl, ld.so) are intentionally not declared.
overrides:
  deb:
    depends:
      - libfontconfig1
      - libfreetype6
      - libgcc-s1
  rpm:
    depends:
      - fontconfig
      - freetype
      - libgcc
  apk:
    depends:
      - fontconfig
      - freetype
      - libgcc
  archlinux:
    depends:
      - fontconfig
      - freetype2
      - gcc-libs
