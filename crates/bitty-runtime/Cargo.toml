[package]
name = "bitty-runtime"
description = "Runtime orchestration for Bitty Correct Terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "runtime", "bitty"]
categories = ["command-line-utilities"]
publish = true

[lints]
workspace = true

# CTX-0906: hermetic native-component test fixture. Speaks wire protocol v1
# over stdio so the broker integration tests spawn a real coprocess without
# any network access; never installed or packaged (publish = false, and the
# release bundles only ship the `bitty` binary).
[[bin]]
name = "bitty-component-fixture"
path = "src/bin/bitty-component-fixture.rs"
test = false
doc = false

[dependencies]
bitty-config = { version = "0.0.22", path = "../bitty-config" }
bitty-vt = { version = "0.0.22", path = "../bitty-vt" }
bitty-term-state = { version = "0.0.22", path = "../bitty-term-state" }
bitty-pty = { version = "0.0.22", path = "../bitty-pty" }
bitty-render = { version = "0.0.22", path = "../bitty-render" }
bitty-platform = { version = "0.0.22", path = "../bitty-platform" }
bitty-ui = { version = "0.0.22", path = "../bitty-ui" }
bitty-lua = { version = "0.0.22", path = "../bitty-lua" }
bitty-plugin-host = { version = "0.0.22", path = "../bitty-plugin-host" }
bitty-ipc = { git = "https://github.com/bitty-terminal/bitty-ipc", rev = "e9714e7" }
# CTX-0406: the package-manager staging path evaluates the closed compat
# requirement grammar with the same pure implementation the plugin host uses.
bitty-package = { version = "0.0.22", path = "../bitty-package" }
# CTX-0248: the tick overlay path stores Kitty images and computes
# placement rects through the rich layer (moved from dev-dependencies;
# same workspace crate, no new supply-chain surface).
bitty-rich = { version = "0.0.22", path = "../bitty-rich" }
# CTX-0906 (DIR-030): the component broker speaks native-component wire
# protocol v1 to out-of-process components (first: `bitty-net`). Core links
# the dependency-free codec crate only, never a network implementation
# crate; same exact-rev pin pattern as `bitty-ipc`.
bitty-network-wire = { git = "https://github.com/bitty-terminal/bitty-network", rev = "c69fe57" }
# Issue #1760 (OQ-004): plaintext URL pattern detection wires the
# dependency-free matcher crate (`bitty-url-detector` v0.0.1, `forbid(unsafe)`,
# `std` only) into the same `ValidatedUrl` + `ActivationGesture` pipeline as
# OSC 8. No crates.io release yet, so the same git-rev pin convention as
# `bitty-ipc` / `bitty-network-wire` applies (7-char short SHA).
bitty-url-detector = { git = "https://github.com/bitty-terminal/bitty-url-detector", rev = "d211490" }
# CTX-1008 (#1763, OQ-076): Core consumes the platform notification bridge
# for the defensive second rate cap. Same exact-rev pin pattern as
# `bitty-ipc` / `bitty-network-wire`: the bridge receives an already-gated
# `{title, body}` pair and re-caps over-ceiling callers fail-closed.
bitty-platform-services = { git = "https://github.com/bitty-terminal/bitty-platform-services", rev = "2fc794a" }

# CORE-RUN-003 (#1526): the supervisor claim lock is an OS-held `flock`.
# Same workspace pins and platform split as `bitty-ipc` (no new crates).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { workspace = true, features = ["fs", "std"] }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
nix = { workspace = true, features = ["fs"] }


[dev-dependencies]
# Hermetic `ServeContext` constructors and unbound bearer minters (#1519).
bitty-ipc = { git = "https://github.com/bitty-terminal/bitty-ipc", rev = "e9714e7", features = ["test-support"] }
bitty-test-support = { path = "../bitty-test-support" }

# CTX-0903: Windows liveness probes for the owned-tree tests (safe API of
# the first-party Job Object adapter; no new third-party crate).
[target.'cfg(windows)'.dev-dependencies]
bitty-winjob = { path = "../bitty-winjob" }
