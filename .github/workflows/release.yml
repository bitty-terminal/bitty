name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.0.1)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Single pin for the Cloudflare Wrangler CLI used by release-time R2 jobs.
  WRANGLER_VERSION: 4.135.0
  # Pinned fingerprint of packaging/apt/bitty-archive-keyring.gpg. The APT
  # publisher imports the release secret and verifies this fingerprint before
  # it signs anything (scripts/import-apt-gpg-key.sh).
  APT_GPG_KEY_FINGERPRINT: BCB87D7B489A64168080D900DF4751B6EA711CB8

# Channel source policy (CTX-1413, #1847): the package-manager publishers
# (`aur-bin`, `homebrew`, `scoop`) prefer the R2-backed CDN at
# https://cdn.bitty.run/releases/<TAG>/ and wait for `r2-mirror`. GitHub
# Releases carries the same bytes and stays the documented fallback; every
# channel verifies its published sha256 before publishing a recipe or manifest.

jobs:
  # Validate packaging metadata before building (nfpm + nix)
  validate:
    name: Validate packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      stable: ${{ steps.stable.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One explicit stable-tag predicate shared by every publisher. A job
      # must not infer stability from its `needs` chain: preview-shaped tags
      # also match the broad `startsWith(refs/tags/v)` trigger. `stable` is
      # true only for an exact vX.Y.Z tag; every other ref is false.
      - name: Compute the stable tag predicate
        id: stable
        run: |
          set -euo pipefail
          stable=false
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              stable=true
            fi
          fi
          echo "stable=${stable}" >>"$GITHUB_OUTPUT"
          echo "stable tag predicate: stable=${stable} ref=${GITHUB_REF:-none}"
      - name: Require a stable release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must be stable vX.Y.Z tags: ${TAG}" >&2
            exit 1
          fi
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Prepare dummy artifacts for nfpm validation
        run: |
          mkdir -p target/release
          echo '#!/bin/sh
          echo "bitty 0.0.1"' > target/release/bitty
          chmod +x target/release/bitty
          tic -x -o target/terminfo terminfo/bitty.ti
      - name: Validate nfpm (deb/rpm/apk/archlinux)
        run: |
          nfpm package --config nfpm.yaml --packager deb --target /tmp/bitty.deb
          nfpm package --config nfpm.yaml --packager rpm --target /tmp/bitty.rpm
          nfpm package --config nfpm.yaml --packager apk --target /tmp/bitty.apk
          nfpm package --config nfpm.yaml --packager archlinux --target /tmp/bitty.pkg.tar.zst
          ls -lh /tmp/bitty.deb /tmp/bitty.rpm /tmp/bitty.apk /tmp/bitty.pkg.tar.zst
      - name: Check flake syntax
        run: |
          if command -v nix >/dev/null 2>&1; then
            nix flake check --no-build || echo "nix flake check attempted"
          else
            echo "nix not available in validate job, checking flake.nix syntax via nix-instantiate fallback"
            python3 -c "import pathlib; p=pathlib.Path('flake.nix'); assert p.exists(); t=p.read_text(); assert 'description' in t and 'nixpkgs' in t, 'flake.nix missing required fields'; print('flake.nix syntax appears valid')"
          fi
      - name: Validate PKGBUILD syntax
        run: |
          bash -n packaging/PKGBUILD
          bash -n packaging/PKGBUILD.bin
          echo "PKGBUILD syntax OK"
      - name: Validate bitty-bin template (render test)
        run: |
          bash scripts/check-pkgbuild-bin.sh
      - name: Validate AUR bitty-bin publish assertion (#2417)
        run: |
          bash scripts/tests/check-aur-bin-render.test.sh
      - name: Validate package-manager manifests (R2/CDN primary)
        run: |
          bash scripts/tests/check-package-manifests.test.sh
      - name: Validate APT repository generator and deb822 integration
        run: |
          bash scripts/tests/check-apt-repo.test.sh
      - name: Validate release-channel key import and Copr CLI wiring
        run: |
          bash scripts/tests/import-apt-gpg-key.test.sh
          bash scripts/tests/check-release-channels.test.sh
      - name: Validate Nix Flake and Cachix binary cache integration
        run: |
          bash scripts/tests/check-nix-flake.test.sh
          bash scripts/tests/check-nix-patch-stub.test.sh
      - name: Validate source PKGBUILD (artifact-install consistency)
        run: |
          bash scripts/check-pkgbuild-source.sh
      - name: Check terminfo shipping decision (034 item 6)
        run: |
          bash scripts/check-terminfo.sh
      - name: Check desktop integration and AppStream metadata (034 item 7)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils libxml2-utils
          bash scripts/check-desktop-integration.sh
      - name: Check release version alignment (Cargo <-> packaging <-> tag)
        run: |
          bash scripts/check-release-version.sh
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            bash scripts/check-release-version.sh --tag "${GITHUB_REF#refs/tags/}"
          fi

  build:
    name: Build ${{ matrix.target }} (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
            # apk is musl-only and comes from the `build-alpine` job (CTX-0447).
            packagers: "deb,rpm,archlinux"
          # Linux ARM64 cross build (CTX-0446 / 034 item 1): ubuntu-22.04 keeps
          # the glibc baseline older; the cross install/build branches below key
          # off this target. Packagers stay deb,rpm until ARM64 packaging is
          # hardened (034 item 8); apk is musl-only (CTX-0447).
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            arch: arm64
            packagers: "deb,rpm"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            packagers: ""
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
            packagers: ""
          - os: macos-15
            target: x86_64-apple-darwin
            arch: amd64
            packagers: ""
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
            packagers: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          targets: ${{ matrix.target }}

      # CTX-2402: panic-location strings embed the builder's cargo/rustup
      # roots, so every release build remaps them to `/build/...` first. The
      # flag set is derived from this runner's environment by the repo-owned
      # script (no runner path is committed) and is identical to what
      # `just release-build` uses locally.
      - name: Resolve release RUSTFLAGS (remapped builder roots)
        id: release-flags
        shell: bash
        run: |
          set -euo pipefail
          flags="$(scripts/release-rustflags.sh)"
          printf 'flags=%s\n' "$flags" >>"$GITHUB_OUTPUT"
          echo "release RUSTFLAGS: $flags"

      # Linux ARM64 is cross-compiled on x86_64 with Ubuntu's aarch64 toolchain
      # (CTX-0446 / 034 item 1). The container-based `cross` path never linked:
      # its image installs host-arch fontconfig/FreeType, and the old fallback
      # never had arm64 native libs. A real arm64 multiarch sysroot replaces
      # both. The runner's host `cc` still links build scripts and proc macros.
      - name: Install aarch64 cross toolchain and arm64 native deps
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          # Ubuntu's main/security archives serve amd64 only; arm64 packages come
          # from ports.ubuntu.com. Restrict the existing sources to amd64 and add
          # the arm64 ports archive (classic .list and deb822 .sources forms).
          # The rewrite keeps other options (for example signed-by) and replaces
          # any existing arch= token, so lines that already carry [arch=...] do
          # not become invalid.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            tmp="$(mktemp)"
            awk '
              /^deb(-src)?[[:space:]]/ {
                line = $0
                match(line, /^deb(-src)?/)
                head = substr(line, 1, RLENGTH)
                rest = substr(line, RLENGTH + 1)
                sub(/^[[:space:]]+/, "", rest)
                opts = ""
                if (rest ~ /^\[/) {
                  match(rest, /^\[[^]]*\]/)
                  opts = substr(rest, 2, RLENGTH - 2)
                  rest = substr(rest, RLENGTH + 1)
                  sub(/^[[:space:]]+/, "", rest)
                }
                n = split(opts, o, /[[:space:]]+/)
                kept = ""
                for (i = 1; i <= n; i++) if (o[i] != "" && o[i] !~ /^arch=/) kept = kept (kept == "" ? "" : " ") o[i]
                printf "%s [arch=amd64%s] %s\n", head, (kept == "" ? "" : " " kept), rest
                next
              }
              { print }
            ' "$f" > "$tmp"
            sudo cp "$tmp" "$f"
            rm -f "$tmp"
          done
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            tmp="$(mktemp)"
            awk '
              /^Types:/ { print; print "Architectures: amd64"; next }
              /^Architectures:/ { next }
              { print }
            ' "$f" > "$tmp"
            sudo cp "$tmp" "$f"
            rm -f "$tmp"
          done
          . /etc/os-release
          {
            echo "Types: deb"
            echo "URIs: http://ports.ubuntu.com/ubuntu-ports"
            echo "Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports ${VERSION_CODENAME}-security"
            echo "Components: main universe restricted multiverse"
            echo "Architectures: arm64"
            echo "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg"
          } | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross \
            pkg-config libfontconfig1-dev:arm64 libfreetype6-dev:arm64

      - name: Install font stack (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Build bitty binary (Linux aarch64 cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          RUSTFLAGS: ${{ steps.release-flags.outputs.flags }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu: /
        run: cargo build --release --locked -p bitty-terminal --target ${{ matrix.target }}

      - name: Build bitty binary (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        env:
          RUSTFLAGS: ${{ steps.release-flags.outputs.flags }}
        run: cargo build --release --locked -p bitty-terminal --target ${{ matrix.target }}

      # CTX-2402: the fail-closed builder-path gate. Stripping cannot remove
      # panic-location paths, so this proves the remap actually applied on
      # every shipped target before the artifact is renamed or packaged.
      - name: Check release binary has no builder paths
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          bin="target/${TARGET}/release/bitty"
          if [[ "$TARGET" == *windows* ]]; then
            bin="${bin}.exe"
          fi
          bash scripts/check-release-paths.sh --binary "$bin"

      # CTX-0502: host-cross is verified (#819), so a wrong-architecture
      # artifact must fail here instead of being renamed, packaged, and
      # uploaded as ARM64. Mirrors the musl readelf check in `build-alpine`
      # (CTX-0447 / #824).
      - name: Assert the binary is aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          scripts/check-binary-arch.sh \
            --binary "target/${{ matrix.target }}/release/bitty" \
            --arch aarch64

      # 034 item 4 / CTX-0449: fail the package when the declared per-distro
      # runtime deps in nfpm.yaml diverge from the binary's ldd/readelf -d
      # output (missing, unlinked, or unmapped sonames). The runtime-dependency
      # gate itself still covers x86_64 only; aarch64 declarations land with
      # 034 item 8 (the arm64 build is otherwise hard-gated by CTX-0502).
      - name: Verify runtime deps (ldd + readelf vs nfpm declarations)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          bash scripts/check-runtime-deps.sh \
            --binary "target/${{ matrix.target }}/release/bitty" \
            --packagers "${{ matrix.packagers }}"

      - name: Rename artifact
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BIN="target/${TARGET}/release/bitty"
          if [[ "$TARGET" == *windows* ]]; then
            BIN="${BIN}.exe"
          fi
          if [[ ! -f "$BIN" ]]; then
            echo "::error::Binary $BIN not found"
            ls -lh "target/${TARGET}/release/" || true
            exit 1
          fi
          ls -lh "$BIN"
          mkdir -p dist
          EXT=""
          if [[ "$TARGET" == *windows* ]]; then
            EXT=".exe"
          fi
          cp "$BIN" "dist/bitty-${TARGET}${EXT}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/bitty-${TARGET}${EXT}" | tee "dist/bitty-${TARGET}${EXT}.sha256"
          else
            shasum -a 256 "dist/bitty-${TARGET}${EXT}" | tee "dist/bitty-${TARGET}${EXT}.sha256"
          fi

      - name: Package (nfpm) - Linux only
        if: contains(matrix.packagers, 'deb')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "target/${{ matrix.target }}/release/bitty" ]]; then
            echo "::error::missing binary for ${{ matrix.target }}"
            exit 1
          fi
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          GOPATH_BIN="$(go env GOPATH)/bin"
          export PATH="$GOPATH_BIN:$PATH"
          echo "$GOPATH_BIN" >> "$GITHUB_PATH"
          mkdir -p target/release dist
          cp "target/${{ matrix.target }}/release/bitty" target/release/bitty
          # Stage the compiled terminfo entry for the nFPM mapping
          # (nfpm.yaml maps ./target/terminfo/b/bitty). Each packaging job
          # runs in its own workspace, so the validate job's tic output is
          # unavailable here; compile in this workspace instead (tic from
          # ncurses-bin, preinstalled on ubuntu-24.04).
          tic -x -o target/terminfo terminfo/bitty.ti
          # Map target arch to nfpm arch
          NFPM_ARCH="${{ matrix.arch }}"
          if [[ "$NFPM_ARCH" == "arm64" ]]; then NFPM_ARCH="arm64"; fi
          # Override arch in nfpm.yaml via env substitution (simple sed)
          sed "s/^arch:.*/arch: $NFPM_ARCH/" nfpm.yaml > /tmp/nfpm.yaml
          cat /tmp/nfpm.yaml
          # Honor the matrix packagers list so a target only emits the packages
          # it declares (x86_64 Linux: deb,rpm,archlinux; aarch64 Linux:
          # deb,rpm). The apk is built by the `build-alpine` job.
          IFS=',' read -ra PACKAGERS <<< "${{ matrix.packagers }}"
          for pkg in "${PACKAGERS[@]}"; do
            if [[ "$pkg" == "archlinux" ]]; then
              # CTX-0448 / 034 item 3: an explicit `bitty-<target>.archlinux`
              # target produced a name pacman cannot install. A directory
              # target makes nfpm emit its conventional pacman name,
              # bitty-<version>-<pkgrel>-<arch>.pkg.tar.zst.
              nfpm package --config /tmp/nfpm.yaml --packager "$pkg" --target dist
            else
              nfpm package --config /tmp/nfpm.yaml --packager "$pkg" --target "dist/bitty-${{ matrix.target }}.${pkg}"
              ls -lh "dist/bitty-${{ matrix.target }}.${pkg}"
            fi
          done
          ls -lh dist/

      # Universal Linux AppImage bundle (CTX-1468, #2555)
      - name: Package (AppImage) - Linux only
        if: contains(matrix.packagers, 'deb')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(bash scripts/check-release-version.sh --print)"
          scripts/make-appimage.sh \
            --version "$VERSION" \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/bitty" \
            --output "dist/bitty-${{ matrix.target }}.AppImage"
          ls -lh "dist/bitty-${{ matrix.target }}.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitty-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Native musl build (CTX-0447 / 034 item 2). The .apk must ship a musl binary
  # and Alpine's runtime is musl, so it is built inside an Alpine container
  # instead of repackaging the glibc binary from `build`. `-crt-static` yields
  # a dynamically linked musl binary: fontconfig/FreeType link against the
  # system libraries and runtime dlopen (Vulkan/X11/Wayland) keeps working,
  # which a fully static musl binary cannot do.
  build-alpine:
    name: Build x86_64-unknown-linux-musl (Alpine)
    needs: validate
    runs-on: ubuntu-24.04
    container: alpine:3.22
    timeout-minutes: 30
    steps:
      - name: Install Alpine build prerequisites
        run: |
          apk add --no-cache bash git build-base curl ca-certificates pkgconf \
            fontconfig-dev freetype-dev nfpm ncurses

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}

      # CTX-2402: derive the builder-root remap from this container's
      # environment; RUSTFLAGS also keeps the dynamic-musl link flag.
      - name: Resolve release RUSTFLAGS (remapped builder roots)
        id: release-flags
        shell: bash
        run: |
          set -euo pipefail
          flags="$(scripts/release-rustflags.sh)"
          printf 'flags=%s\n' "$flags" >>"$GITHUB_OUTPUT"
          echo "release RUSTFLAGS: $flags"

      - name: Build bitty binary (native musl, dynamic)
        env:
          RUSTFLAGS: "-C target-feature=-crt-static ${{ steps.release-flags.outputs.flags }}"
        shell: bash
        run: cargo build --release --locked -p bitty-terminal

      # CTX-2402: same fail-closed builder-path gate as the glibc/macOS/Windows
      # legs; the musl target ships in the .apk.
      - name: Check release binary has no builder paths
        shell: bash
        run: bash scripts/check-release-paths.sh --binary target/release/bitty

      - name: Rename artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/bitty dist/bitty-x86_64-unknown-linux-musl
          sha256sum dist/bitty-x86_64-unknown-linux-musl | tee dist/bitty-x86_64-unknown-linux-musl.sha256

      - name: Assert the binary is musl, not glibc
        shell: bash
        run: |
          set -euo pipefail
          apk add --no-cache binutils
          # Capture readelf output once, then match. Piping readelf straight into
          # `grep -q` makes grep exit on the first match, readelf takes SIGPIPE,
          # and `set -o pipefail` turns that into exit 141 (GH Actions reports it
          # as a failed assertion even though the binary is correct).
          program_headers="$(readelf -l target/release/bitty)"
          if ! grep -q 'ld-musl-x86_64.so.1' <<<"$program_headers"; then
            echo "::error::binary does not request the musl loader" >&2
            exit 1
          fi
          if grep -q 'ld-linux' <<<"$program_headers"; then
            echo "::error::musl build carries a glibc interpreter" >&2
            exit 1
          fi
          readelf -d target/release/bitty | grep NEEDED

      # 034 item 4 / CTX-0449: the apk declarations (fontconfig, freetype,
      # libgcc) must match the musl binary's ldd/readelf -d output.
      - name: Verify runtime deps (ldd + readelf vs nfpm declarations)
        shell: bash
        run: |
          set -euo pipefail
          command -v readelf >/dev/null 2>&1 || apk add --no-cache binutils
          bash scripts/check-runtime-deps.sh --binary target/release/bitty --packagers apk

      - name: Package apk (nfpm)
        shell: bash
        run: |
          set -euo pipefail
          # Stage the compiled terminfo entry for the nFPM mapping
          # (nfpm.yaml maps ./target/terminfo/b/bitty). Each packaging job
          # runs in its own workspace, so the validate job's tic output is
          # unavailable here; compile in this workspace instead (tic from
          # the ncurses prerequisite above).
          tic -x -o target/terminfo terminfo/bitty.ti
          nfpm package --config nfpm.yaml --packager apk \
            --target dist/bitty-x86_64-unknown-linux-musl.apk
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitty-x86_64-unknown-linux-musl
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # FreeBSD x86_64 (ADR-0002 Tier 2, CTX-0849 / #1509): a first-party binary
  # plus a portable versioned tarball. There is no FreeBSD runner on GitHub
  # Actions, so the build runs inside a real FreeBSD VM. nfpm has no FreeBSD
  # `pkg` backend, so the package format is a plain `tar.xz` with the repo's
  # fixed payload (bin/bitty + LICENSE + README.md + CHANGELOG.md); a native
  # `.pkg` is deferred (see release-distribution.md). The tarball is assembled
  # inside the guest, where the native binary lives, and synced back to the
  # runner for upload. ADR-0002's Tier 2 release gate is "build plus core unit
  # tests", so this job builds the binary for the artifact and runs the core
  # headless suites before packaging.
  build-freebsd:
    name: Build x86_64-unknown-freebsd (FreeBSD 15.1)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # `cargo test` would otherwise emit target/debug/incremental output that
    # the VM action syncs between guest and runner for no benefit.
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the v1.6.0 commit (the tag is mutable).
      - name: Start FreeBSD 15.1 VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: freebsd
          version: "15.1"
          memory: 6G
          cpu_count: 8

      # clang is in the FreeBSD base image; cmake + pkgconf drive
      # crossfont's fontconfig/FreeType probes. git + ca_root_nss let
      # `cargo --locked` fetch the pinned git dependencies over TLS.
      - name: Install FreeBSD build prerequisites
        run: |
          set -eux
          sudo pkg update
          sudo pkg install -y git cmake pkgconf ca_root_nss freetype2 fontconfig bash

      - name: Install pinned Rust toolchain (rustup)
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component rustfmt --component clippy
          . "$HOME/.cargo/env"
          cargo --version
          rustc --version

      - name: Build bitty binary (native FreeBSD)
        run: |
          set -eux
          . "$HOME/.cargo/env"
          RUSTFLAGS="$(bash scripts/release-rustflags.sh)" \
            cargo build --release --locked -p bitty-terminal

      # CTX-2402: fail closed when the FreeBSD build embeds a builder path
      # (the tier-2 tarball and bare binary ship this artifact).
      - name: Check release binary has no builder paths
        run: |
          set -eux
          bash scripts/check-release-paths.sh --binary target/release/bitty

      - name: Run core headless suites
        run: |
          set -eux
          . "$HOME/.cargo/env"
          # CTX-1029 (#1796): cap test threads on the emulated FreeBSD VM
          # (same rationale as the bsd-tier leg: parallel PTY spawns race
          # TIOCSCTTY EPERM/ENOTTY; library retry + gated respawn absorb the
          # residual, the cap lowers the trigger rate).
          cargo test --locked \
            -p bitty-vt \
            -p bitty-term-state \
            -p bitty-ui \
            -p bitty-pty -- --test-threads=4

      # Assemble the published artifacts inside the guest so the binary, the
      # versioned tarball, and the checksums are generated where the binary is
      # native. `tar` (with xz) is in the FreeBSD base system; checksums use
      # FreeBSD's `sha256` because the base system has no `sha256sum`.
      - name: Assemble FreeBSD artifacts
        run: |
          set -eux
          mkdir -p dist
          BIN="target/release/bitty"
          TARGET="x86_64-unknown-freebsd"
          cp "$BIN" "dist/bitty-${TARGET}"
          version="$(bash scripts/check-release-version.sh --print)"
          TOPDIR="bitty-${version}-${TARGET}"
          stage="$(mktemp -d)"
          mkdir -p "$stage/$TOPDIR/bin"
          cp "$BIN" "$stage/$TOPDIR/bin/bitty"
          cp LICENSE README.md CHANGELOG.md "$stage/$TOPDIR/"
          (cd "$stage" && tar -cJf - "$TOPDIR") > "dist/${TOPDIR}.tar.xz"
          rm -rf "$stage"
          cd dist
          for f in "bitty-${TARGET}" "${TOPDIR}.tar.xz"; do
            printf '%s  %s\n' "$(sha256 -q "$f")" "$f"
          done > "bitty-${TARGET}.sha256"
          cat "bitty-${TARGET}.sha256"
          ls -lh .

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitty-x86_64-unknown-freebsd
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Clean-container install smoke for every package (034 item 5 / CTX-0450):
  # a package that cannot install and run must not reach a release. The Alpine
  # leg keeps the CTX-0447 musl-apk check and extends it with the same
  # --version / doctor / headless smoke as the other distros. Per-distro
  # runtime dependencies are 034 item 4 (CTX-0449) and ship with the packages;
  # scripts/install-smoke.sh still installs the font stack explicitly so the
  # smoke does not depend on how each distro resolves them.
  verify-install:
    name: Install smoke (${{ matrix.distro }})
    needs: [build, build-alpine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            artifact: bitty-x86_64-unknown-linux-gnu
          - distro: fedora
            artifact: bitty-x86_64-unknown-linux-gnu
          - distro: arch
            artifact: bitty-x86_64-unknown-linux-gnu
          - distro: alpine
            artifact: bitty-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download ${{ matrix.artifact }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: pkg

      - name: Install smoke (${{ matrix.distro }})
        run: bash scripts/install-smoke.sh --distro "${{ matrix.distro }}" --dir pkg

  # macOS Universal 2 DMG (CTX-0454 / 034 item 9): fuse the two macOS slices
  # into one `Bitty.app` inside `Bitty-<version>-universal.dmg` so ordinary
  # users never choose a target triple. The app is intentionally unsigned
  # (codesign/notarize is 034 item 11); the bare triple binaries keep shipping
  # for Homebrew and direct downloads. Assembly lives in
  # `scripts/make-macos-dmg.sh` and the step verifies the DMG by mounting it
  # and launching both slices before anything is published.
  macos-universal:
    name: macOS Universal 2 DMG
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download macOS build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bitty-*-apple-darwin
          path: dist
          merge-multiple: true

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ -z "$version" ]]; then
            version="$(bash scripts/check-release-version.sh --print)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version: $version"

      - name: Assemble Bitty.app and create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG="dist/Bitty-${VERSION}-universal.dmg"
          bash scripts/make-macos-dmg.sh \
            --version "$VERSION" \
            --arm64 dist/bitty-aarch64-apple-darwin \
            --x86_64 dist/bitty-x86_64-apple-darwin \
            --output "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Verify DMG mount, Universal 2 slices, and both-arch launches
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG="dist/Bitty-${VERSION}-universal.dmg"
          MOUNT_DIR="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          APP_BIN="$MOUNT_DIR/Bitty.app/Contents/MacOS/bitty"
          if [[ ! -x "$APP_BIN" ]]; then
            echo "::error::Bitty.app binary missing or not executable"
            exit 1
          fi
          ARCHS="$(lipo -archs "$APP_BIN")"
          echo "universal slices: $ARCHS"
          if [[ "$ARCHS" != *arm64* || "$ARCHS" != *x86_64* ]]; then
            echo "::error::bundled binary is not Universal 2: $ARCHS"
            exit 1
          fi
          scripts/check-version-output.sh "$VERSION" "$APP_BIN"
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          scripts/check-version-output.sh "$VERSION" arch -x86_64 "$APP_BIN"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitty-macos-universal
          path: dist/*.dmg*
          if-no-files-found: error
          retention-days: 14

  # Windows x86_64 portable ZIP (CTX-0455 / 034 item 10): unzip-and-run with no
  # installer. The archive is assembled on Linux from the x86_64 MSVC artifact
  # (fixed payload list, `bitty.exe` at the archive root) and a clean Windows
  # runner then expands it and runs the executable. The bare `.exe` assets keep
  # shipping for Scoop and direct downloads; ARM64 stays a bare `.exe` for now.
  windows-zip:
    name: Windows x86_64 Portable ZIP
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download x86_64 executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bitty-x86_64-pc-windows-msvc
          path: dist

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ -z "$version" ]]; then
            version="$(bash scripts/check-release-version.sh --print)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version: $version"

      - name: Assemble portable ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="dist/bitty-${VERSION}-windows-x86_64.zip"
          bash scripts/make-windows-zip.sh \
            --version "$VERSION" \
            --exe dist/bitty-x86_64-pc-windows-msvc.exe \
            --output "$ZIP"
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitty-x86_64-pc-windows-msvc-zip
          path: dist/bitty-*-windows-x86_64.zip*
          if-no-files-found: error
          retention-days: 14

  # Clean-runner acceptance for the portable ZIP (034 item 10): a fresh Windows
  # runner expands the published archive and runs `bitty.exe --version`.
  verify-windows-zip:
    name: Verify Windows ZIP unzip-and-run
    needs: windows-zip
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download portable ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bitty-x86_64-pc-windows-msvc-zip
          path: pkg

      - name: Expand archive and run bitty.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -Path pkg -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'portable ZIP artifact not found' }
          Write-Host "archive: $($zip.Name)"
          if ($zip.BaseName -notmatch '^bitty-(?<version>.+)-windows-x86_64$') {
            throw "unexpected archive name: $($zip.BaseName)"
          }
          $version = $Matches['version']
          $dest = Join-Path $env:RUNNER_TEMP 'bitty-portable-zip'
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $zip.FullName -DestinationPath $dest
          $dirs = @(Get-ChildItem -Path $dest -Directory)
          if ($dirs.Count -ne 0) {
            throw "unexpected directories in archive root: $($dirs.Name -join ', ')"
          }
          $expected = @('bitty.exe', 'LICENSE', 'README.md', 'CHANGELOG.md')
          $actual = @(Get-ChildItem -Path $dest -File | ForEach-Object { $_.Name })
          if (Compare-Object $expected $actual) {
            throw "archive contents mismatch: $($actual -join ', ')"
          }
          $exe = Join-Path $dest 'bitty.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "bitty.exe is not a file: $exe" }
          $output = (& $exe --version 2>&1 | Out-String)
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "bitty --version exited $code" }
          $pattern = '\Abitty ' + [regex]::Escape($version) + ' \([^\s()]+ [^\s()]+\)(?:\r\n|\n)\z'
          Write-Host "bitty --version => $($output.TrimEnd())"
          if ($output -cnotmatch $pattern) {
            throw "version mismatch: archive $version, binary '$output'"
          }

  # Windows x64 setup installer (CTX-1064 / #1810): Inno Setup 6 wizard
  # compiled on windows-latest (choco install, no paid infra). Input is the
  # x86_64 MSVC executable from `build` plus LICENSE/README.md/CHANGELOG.md
  # (the portable-ZIP payload); the version resolves exactly like `windows-zip`
  # (tag > workflow input > Cargo workspace version), never hardcoded. The
  # 0.1.0 installer is intentionally unsigned (paid signing deferred past
  # 0.2.0 per the owner decision on #1810): no SignTool is configured and the
  # verify job asserts NotSigned. Scoop keeps shipping the bare exes on its
  # own track; install.ps1 keeps fetching the portable ZIP.
  windows-installer:
    name: Windows x64 Setup installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download x86_64 executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bitty-x86_64-pc-windows-msvc
          path: dist

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ -z "$version" ]]; then
            version="$(bash scripts/check-release-version.sh --print)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version: $version"
        shell: bash

      - name: Stage installer payload
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/wininst-stage
          cp dist/bitty-x86_64-pc-windows-msvc.exe dist/wininst-stage/bitty.exe
          cp LICENSE README.md CHANGELOG.md dist/wininst-stage/
          ls -lh dist/wininst-stage/
          bash scripts/check-windows-installer.sh
        shell: bash

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc /? | Select-Object -First 5

      - name: Compile setup installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist\wininst-stage'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          & $iscc /DMyAppVersion="$env:VERSION" "/DMySourceDir=$stage" "/O$outDir" packaging\windows\bitty.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          Get-ChildItem dist/*setup.exe | Format-Table Name, Length

      - name: Checksum setup artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SETUP="dist/bitty-${VERSION}-windows-x86_64-setup.exe"
          if [[ ! -f "$SETUP" ]]; then
            echo "::error::setup artifact missing: $SETUP"
            ls -lh dist/
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$SETUP" | tee "$SETUP.sha256"
          else
            shasum -a 256 "$SETUP" | tee "$SETUP.sha256"
          fi
        shell: bash

      - name: Upload setup artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitty-x86_64-pc-windows-msvc-setup
          path: dist/bitty-*-windows-x86_64-setup.exe*
          if-no-files-found: error
          retention-days: 14

  # Clean-runner acceptance for the setup installer (CTX-1064): silent
  # per-user install/uninstall round-trip asserting the Start Menu shortcut,
  # the opt-in Desktop shortcut, the automatic registry uninstall entry, the
  # payload, and the version match. Unsigned 0.1.0 is asserted as NotSigned
  # so a silent signing without updating bitty.iss and packaging/README.md
  # fails here instead of shipping quietly.
  # CTX-1250 (#2120): the maiden verify run never got the setup process
  # started (empty $LASTEXITCODE from the bare call operator, ~250ms after
  # start) while the artifact itself was intact. The launch therefore goes
  # through Start-Process -Wait -PassThru (a process that never starts throws
  # instead of leaving an empty exit code), pre-flight diagnostics (file size,
  # Zone.Identifier MOTW stream, Windows build, Defender status) distinguish a
  # scan/SmartScreen first-launch block from a corrupt artifact, and exactly
  # ONE bounded 45s retry absorbs a transient on-access scan storm.
  verify-windows-installer:
    name: Verify Windows setup install/uninstall
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download setup installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bitty-x86_64-pc-windows-msvc-setup
          path: pkg

      - name: Install/uninstall round-trip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Path pkg -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'setup artifact not found' }
          Write-Host "setup: $($setup.Name)"
          if ($setup.BaseName -notmatch '^bitty-(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.]+)?)-windows-x86_64-setup$') {
            throw "unexpected setup name: $($setup.BaseName)"
          }
          $version = $Matches['version']
          $sig = Get-AuthenticodeSignature -FilePath $setup.FullName
          Write-Host "signature status: $($sig.Status)"
          if ("$($sig.Status)" -ne 'NotSigned') {
            throw "expected unsigned setup (NotSigned), got $($sig.Status); update bitty.iss and packaging/README.md before shipping signed builds"
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'bitty-setup-test'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          # CTX-1250 (#2120) pre-flight: distinguish a first-launch
          # scan/SmartScreen block from a corrupt artifact. All queries are
          # best-effort diagnostics; only the launch assertions below fail.
          Write-Host "setup file: $($setup.FullName)"
          Write-Host ("setup length: {0} bytes" -f $setup.Length)
          $zone = Get-Content -Path "$($setup.FullName):Zone.Identifier" -ErrorAction SilentlyContinue
          if ($zone) {
            Write-Host 'Zone.Identifier stream present (MOTW):'
            $zone | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host 'Zone.Identifier stream: none'
          }
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          try {
            $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
            Write-Host "Windows build: $($cv.CurrentBuildNumber).$($cv.UBR) ($($cv.DisplayVersion))"
          } catch {
            Write-Host "Windows build query unavailable: $($_.Exception.Message)"
          }
          try {
            $mp = Get-MpComputerStatus -ErrorAction Stop
            Write-Host "Defender: AMService=$($mp.AMServiceEnabled) Antivirus=$($mp.AntivirusEnabled) RealTime=$($mp.RealTimeProtectionEnabled) Signatures=$($mp.AntivirusSignatureVersion)"
          } catch {
            Write-Host "Defender status query unavailable: $($_.Exception.Message)"
          }
          try {
            $svc = Get-Service -Name WinDefend -ErrorAction Stop
            Write-Host "WinDefend service: $($svc.Status)"
          } catch {
            Write-Host "WinDefend service query unavailable: $($_.Exception.Message)"
          }
          # CTX-1250 (#2120): Start-Process -Wait -PassThru captures the TRUE
          # exit code. The bare call operator left $LASTEXITCODE empty when the
          # process never started, hiding a first-launch block behind
          # 'setup exited '. Exactly one bounded retry absorbs a transient
          # on-access scan storm; a genuine failure still throws below.
          $setupArgs = @('/SILENT', '/NORESTART', '/SUPPRESSMSGBOXES', "/DIR=`"$installDir`"", '/TASKS="desktopicon"')
          $attempt = 0
          $exitCode = $null
          $lastError = $null
          while ($attempt -lt 2) {
            $attempt++
            try {
              Write-Host "setup launch attempt $attempt/2 ..."
              $proc = Start-Process -FilePath $setup.FullName -ArgumentList $setupArgs -Wait -PassThru
              $exitCode = $proc.ExitCode
              Write-Host "setup attempt $attempt exit code: $exitCode"
            } catch {
              $lastError = $_.Exception.Message
              Write-Host "setup attempt $attempt failed to start: $lastError"
              $exitCode = $null
            }
            if ($exitCode -eq 0) { break }
            if ($attempt -lt 2) {
              Write-Host 'first attempt did not succeed; waiting 45s for the on-access scan to settle before one bounded retry ...'
              Start-Sleep -Seconds 45
            }
          }
          if ($exitCode -ne 0) {
            if ($null -eq $exitCode) { throw "setup never started (Start-Process threw): $lastError" }
            throw "setup exited $exitCode after $attempt attempt(s)"
          }
          $exe = Join-Path $installDir 'bitty.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw "bitty.exe missing after install: $exe" }
          $output = (& $exe --version 2>&1 | Out-String)
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "bitty --version exited $code" }
          $pattern = '\Abitty ' + [regex]::Escape($version) + ' \([^\s()]+ [^\s()]+\)(?:\r\n|\n)\z'
          Write-Host "bitty --version => $($output.TrimEnd())"
          if ($output -cnotmatch $pattern) {
            throw "version mismatch: setup $version, binary '$output'"
          }
          foreach ($f in @('LICENSE', 'README.md', 'CHANGELOG.md')) {
            if (-not (Test-Path (Join-Path $installDir $f) -PathType Leaf)) { throw "payload missing after install: $f" }
          }
          $startMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Bitty\Bitty.lnk'
          if (-not (Test-Path $startMenu)) { throw "Start Menu shortcut missing: $startMenu" }
          Write-Host "Start Menu shortcut OK: $startMenu"
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Bitty.lnk'
          if (-not (Test-Path $desktop)) { throw "Desktop shortcut missing (desktopicon task): $desktop" }
          Write-Host "Desktop shortcut OK: $desktop"
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match '^Bitty' } | Select-Object -First 1
          if (-not $entry) {
            $entry = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -match '^Bitty' } | Select-Object -First 1
          }
          if (-not $entry) { throw 'registry uninstall entry missing (DisplayName Bitty)' }
          Write-Host "uninstall entry OK: $($entry.DisplayName) $($entry.DisplayVersion)"
          # Inno Setup writes AppVersion verbatim, but Windows may re-pad the
          # uninstall DisplayVersion with trailing zero components. Accept only
          # the exact version (optionally zero-padded), never a substring.
          $display = "$($entry.DisplayVersion)".Trim()
          if ($display -cnotmatch ('^' + [regex]::Escape($version) + '(\.0+)*$')) {
            throw "uninstall version mismatch: '$display' vs $version"
          }
          if (-not $entry.UninstallString) { throw 'uninstall entry missing UninstallString' }
          $unins = "$($entry.UninstallString)"
          if ($unins -match '"([^"]+)"') { $unins = $Matches[1] } else { $unins = ($unins -split '\s+')[0] }
          if (-not (Test-Path $unins)) { throw "uninstaller missing: $unins" }
          # CTX-1250 (#2120): same true-exit-code discipline as the setup
          # launch above; the uninstaller is locally generated (no MOTW), so
          # no retry is warranted here.
          $uproc = Start-Process -FilePath $unins -ArgumentList @('/SILENT', '/NORESTART', '/SUPPRESSMSGBOXES') -Wait -PassThru
          if ($uproc.ExitCode -ne 0) { throw "uninstaller exited $($uproc.ExitCode)" }
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw 'bitty.exe survived uninstall' }
          if (Test-Path $startMenu) { throw 'Start Menu shortcut survived uninstall' }
          if (Test-Path $desktop) { throw 'Desktop shortcut survived uninstall' }
          $gone = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match '^Bitty' } | Select-Object -First 1
          if ($gone) { throw 'registry uninstall entry survived uninstall' }
          Write-Host 'install/uninstall round-trip PASS'

  # Versioned Linux binary bundles (REL-07 / #1110):
  # `bitty-<version>-<target>.tar.zst` carrying `bin/bitty`, `share/`
  # (desktop entry, icons, metainfo), LICENSE, README.md, and CHANGELOG.md —
  # the primary long-term artifact per the binary-compression section of
  # release-distribution.md. Bare target-triple binaries keep shipping for
  # now. Assembly lives in `scripts/make-unix-bundle.sh`; the version comes
  # from repo metadata (tag > workflow input > Cargo workspace version),
  # never hardcoded, and the target comes from the matrix.
  unix-bundle:
    name: Unix bundle (${{ matrix.target }})
    needs: [build, build-alpine]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download ${{ matrix.target }} binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bitty-${{ matrix.target }}
          path: dist

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ -z "$version" ]]; then
            version="$(bash scripts/check-release-version.sh --print)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version: $version"

      - name: Assemble versioned bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="dist/bitty-${VERSION}-${{ matrix.target }}.tar.zst"
          bash scripts/make-unix-bundle.sh \
            --version "$VERSION" \
            --target "${{ matrix.target }}" \
            --binary "dist/bitty-${{ matrix.target }}" \
            --output "$BUNDLE"
          sha256sum "$BUNDLE" | tee "$BUNDLE.sha256"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitty-${{ matrix.target }}-bundle
          # Exact path, not a glob. The `build` job's Arch packaging writes
          # `bitty-<version>-<pkgrel>-<arch>.pkg.tar.zst` into the same `dist/`
          # tree (nfpm's conventional pacman name), so `dist/bitty-*.tar.zst*`
          # also swept up the pacman package. `verify-unix-bundle` then tried
          # to treat that archive as a Bitty source bundle and failed with
          # "extracts outside its top-level directory".
          path: |
            dist/bitty-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.zst
            dist/bitty-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.zst.sha256
          if-no-files-found: error
          retention-days: 14

  # Clean-runner acceptance for the versioned bundles (REL-07 / #1110): a
  # fresh Ubuntu runner expands each published archive and runs
  # `bin/bitty --version`, asserting the archive name, the single top-level
  # directory, the fixed member roots, and the version match.
  verify-unix-bundle:
    name: Verify Unix bundle
    needs: unix-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The foreign-arch branch calls the repo-owned scripts/check-binary-arch.sh,
      # so this job needs the working tree, not just the downloaded bundles.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download bundle artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bitty-*-bundle
          path: pkg
          merge-multiple: true

      - name: Expand archives and run bitty
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          shopt -s nullglob
          # Only the versioned source bundles belong here. A pacman package
          # (`*.pkg.tar.zst`) or any other archive that leaked into the
          # artifact is a packaging bug, not something to silently ignore.
          stray=(pkg/*.pkg.tar.zst)
          if [[ "${#stray[@]}" -ne 0 ]]; then
            echo "::error::non-bundle archives present: ${stray[*]}" >&2
            exit 1
          fi
          bundles=(pkg/bitty-*.tar.zst)
          if [[ "${#bundles[@]}" -eq 0 ]]; then
            echo "::error::no versioned bundle artifacts found"
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            base="$(basename "$bundle" .tar.zst)"
            if [[ ! "$base" =~ ^bitty-([0-9]+\.[0-9]+\.[0-9]+)-(.+)$ ]]; then
              echo "::error::unexpected bundle name: $base"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            echo "bundle: $base (version=$version)"
            if [[ "$(tar -tf "$bundle" | cut -d/ -f1 | sort -u)" != "$base" ]]; then
              echo "::error::$base extracts outside its top-level directory" >&2
              exit 1
            fi
            expected="$(printf '%s\n' CHANGELOG.md LICENSE README.md bin share terminfo)"
            # `tar -tf` also lists the archive's own top-level directory entry
            # ("<base>/"), which yields an empty field from `cut -d/ -f2` and a
            # leading empty line. That made this comparison impossible to
            # satisfy for every well-formed bundle, so the check rejected the
            # release's own archives. Filter empty fields.
            actual="$(tar -tf "$bundle" | cut -d/ -f2 | sed '/^$/d' | LC_ALL=C sort -u)"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$base member roots mismatch (actual: $actual)" >&2
              exit 1
            fi
            dest="$(mktemp -d)"
            tar -xf "$bundle" -C "$dest"
            exe="$dest/$base/bin/bitty"
            if [[ ! -x "$exe" ]]; then
              echo "::error::$base bin/bitty missing or not executable" >&2
              exit 1
            fi
            # The matrix carries aarch64 bundles, and this gate runs on one
            # x86_64 runner. Executing a foreign-arch binary fails with 126
            # (Exec format error) and says nothing about the archive, so only
            # the host-native target is run; every target is still checked for
            # ELF machine and interpreter by the repo-owned inspector.
            # Strip the leading "bitty-<version>-" to recover the full target
            # triple; `${base##*-}` would only drop the final segment and
            # leave a bare "gnu"/"musl". The inner expansion is quoted so it is
            # matched literally rather than treated as a glob pattern.
            target="${base#"bitty-${version}-"}"
            case "$target" in
              x86_64-unknown-linux-gnu)
                scripts/check-version-output.sh "$version" "$exe"
                ;;
              x86_64-unknown-linux-musl)
                # The musl bundle is built with `-crt-static` disabled so that
                # fontconfig/FreeType and the runtime dlopen of Vulkan/X11/
                # Wayland keep working (see the build-alpine job). That makes
                # it a dynamically linked musl binary, so it needs
                # /lib/ld-musl-x86_64.so.1, which this glibc runner does not
                # ship: executing it here fails with 127 and "required file
                # not found" while the archive is perfectly fine. The Alpine
                # `install smoke` job already executes the same binary on musl
                # and is the authoritative runtime check, so this gate only
                # asserts the ELF machine and records that it was not run.
                head_out="$(readelf -h "$exe" 2>&1)" || {
                  echo "::error::readelf -h failed for $base: $head_out" >&2
                  exit 1
                }
                machine="$(printf '%s\n' "$head_out" \
                  | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p' | head -n1)"
                case "$machine" in
                  *X86-64*) ;;
                  *)
                    echo "::error::$base machine mismatch: expected X86-64, got '${machine}'" >&2
                    exit 1
                    ;;
                esac
                echo "$base: X86-64 ELF verified (not executed: needs the musl loader; runtime covered by install smoke on Alpine)"
                ;;
              *)
                case "$target" in
                  aarch64-unknown-linux-gnu) arch=aarch64 ;;
                  *)
                    echo "::error::unknown bundle target: $target" >&2
                    exit 1
                    ;;
                esac
                if ! bash scripts/check-binary-arch.sh \
                  --binary "$exe" --arch "$arch"; then
                  echo "::error::$base binary is not a valid $arch ELF" >&2
                  exit 1
                fi
                echo "$base: $arch ELF verified (not executed: foreign arch on this runner)"
                ;;
            esac
            rm -rf "$dest"
          done

  release:
    name: Create GitHub Release
    needs:
      [
        validate,
        build,
        build-alpine,
        build-freebsd,
        verify-install,
        macos-universal,
        windows-zip,
        verify-windows-zip,
        windows-installer,
        verify-windows-installer,
        unix-bundle,
        verify-unix-bundle,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.stable == 'true' && !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS and provenance
        run: |
          set -euo pipefail
          ls -R dist
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TOOLCHAIN="$(scripts/rust-channel.sh)"
          printf '{\n  "commit": "%s",\n  "tag": "%s",\n  "date": "%s",\n  "toolchain": "%s",\n  "build_runner": "github-actions"\n}\n' "$COMMIT" "${{ github.ref_name }}" "$DATE" "$TOOLCHAIN" > dist/provenance.json
          cat dist/provenance.json
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          generate_release_notes: true
          # Release tags are stable vX.Y.Z only; prereleases are rejected by
          # the validation job and are not part of this publication contract.
          prerelease: false
          draft: false

  aur:
    name: Publish AUR (Arch)
    environment: release
    needs: [release, validate]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && vars.AUR_PUBLISH == 'true' && needs.validate.outputs.stable == 'true' && !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Arch build dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm git openssh pacman-contrib base-devel
      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "AUR_SSH_PRIVATE_KEY not set, skipping AUR publish"
            exit 0
          fi
          export HOME=/root
          SSH_DIR="$HOME/.ssh"
          install -dm700 "$SSH_DIR"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$SSH_DIR/id_ed25519"
          chmod 600 "$SSH_DIR/id_ed25519"
          AUR_HOST_KEY='aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN'
          AUR_HOST_FINGERPRINT='SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          printf '%s\n' "$AUR_HOST_KEY" > "$SSH_DIR/known_hosts"
          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$SSH_DIR/known_hosts" -E sha256 | awk '{print $2}')"
          if [ "$ACTUAL_FINGERPRINT" != "$AUR_HOST_FINGERPRINT" ]; then
            echo "AUR host key fingerprint mismatch" >&2
            exit 1
          fi
          chmod 600 "$SSH_DIR/known_hosts"
          cat > "$SSH_DIR/config" <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/id_ed25519
            User aur
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$SSH_DIR/config"
          export GIT_SSH_COMMAND="ssh -F $SSH_DIR/config"
          git clone ssh://aur@aur.archlinux.org/bitty.git aur-bitty
          AUR_DIR="$PWD/aur-bitty"
          git config --global --add safe.directory "$AUR_DIR"
          git -C "$AUR_DIR" checkout -B master
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # Always sync the source recipe from the tagged tree, matching the
          # `aur-bin` job: a first-run-only copy would strand later PKGBUILD
          # fixes (for example the bounded check() in CTX-0351) on AUR.
          cp packaging/PKGBUILD "$AUR_DIR/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$AUR_DIR/PKGBUILD"
          id builder >/dev/null 2>&1 || useradd --create-home builder
          # Keep the AUR checkout root-owned so root git stays trusted; run
          # makepkg as builder only inside an isolated BUILD_DIR copy.
          BUILD_DIR="$(mktemp -d)"
          cp "$AUR_DIR/PKGBUILD" "$BUILD_DIR/PKGBUILD"
          chown -R builder:builder "$BUILD_DIR"
          su builder -s /bin/bash -c "cd \"$BUILD_DIR\" && makepkg --printsrcinfo > .SRCINFO"
          install -m644 "$BUILD_DIR/.SRCINFO" "$AUR_DIR/.SRCINFO"
          rm -rf "$BUILD_DIR"
          git -C "$AUR_DIR" config user.name "github-actions[bot]"
          git -C "$AUR_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$AUR_DIR" add PKGBUILD .SRCINFO
          git -C "$AUR_DIR" diff --cached --quiet || git -C "$AUR_DIR" commit -m "chore(aur): bump bitty to $VERSION"
          git -C "$AUR_DIR" push origin master

  aur-bin:
    name: Publish AUR bitty-bin (Arch, prebuilt)
    environment: release
    # The PKGBUILD points at the R2/CDN release path (CTX-1413, #1847), so the
    # publish waits for the immutable mirror instead of racing it.
    needs: [r2-mirror, validate]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && vars.AUR_BIN_PUBLISH == 'true' && needs.validate.outputs.stable == 'true' && !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Arch build dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm git openssh pacman-contrib base-devel curl
      - name: Publish bitty-bin to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "AUR_SSH_PRIVATE_KEY not set, skipping AUR bitty-bin publish"
            exit 0
          fi
          export HOME=/root
          SSH_DIR="$HOME/.ssh"
          install -dm700 "$SSH_DIR"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$SSH_DIR/id_ed25519"
          chmod 600 "$SSH_DIR/id_ed25519"
          AUR_HOST_KEY='aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN'
          AUR_HOST_FINGERPRINT='SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          printf '%s\n' "$AUR_HOST_KEY" > "$SSH_DIR/known_hosts"
          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$SSH_DIR/known_hosts" -E sha256 | awk '{print $2}')"
          if [ "$ACTUAL_FINGERPRINT" != "$AUR_HOST_FINGERPRINT" ]; then
            echo "AUR host key fingerprint mismatch" >&2
            exit 1
          fi
          chmod 600 "$SSH_DIR/known_hosts"
          cat > "$SSH_DIR/config" <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/id_ed25519
            User aur
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$SSH_DIR/config"
          export GIT_SSH_COMMAND="ssh -F $SSH_DIR/config"
          # First-time registration: the bitty-bin AUR repo may not exist yet.
          if ! git clone ssh://aur@aur.archlinux.org/bitty-bin.git aur-bitty-bin; then
            echo "bitty-bin AUR repo not found, initializing for first push"
            mkdir -p aur-bitty-bin
            git -C aur-bitty-bin init
            git -C aur-bitty-bin remote add origin ssh://aur@aur.archlinux.org/bitty-bin.git
          fi
          AUR_DIR="$PWD/aur-bitty-bin"
          git config --global --add safe.directory "$AUR_DIR"
          git -C "$AUR_DIR" checkout -B master
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # Asset stem comes from the template, never hardcoded twice:
          # CTX-0164 (bitty-terminal -> bitty) must keep this dist name stable.
          ASSET="$(awk -F'"' '/^_bitty_asset=/{print $2; exit}' packaging/PKGBUILD.bin)"
          ASSET="${ASSET//\$\{pkgver\}/$VERSION}"
          if [ -z "$ASSET" ]; then
            echo "could not derive _bitty_asset from packaging/PKGBUILD.bin" >&2
            exit 1
          fi
          # R2/CDN is the preferred source for every package channel
          # (CTX-1413, #1847); GitHub Releases stays the documented fallback.
          BASE_URL="https://cdn.bitty.run/releases/${TAG}"
          echo "bitty-bin asset: $ASSET at $TAG (R2/CDN primary)"
          # Download the exact bytes the PKGBUILD will fetch and verify them
          # against the published `${BASE_URL}/${ASSET}.sha256` sidecar; never
          # SKIP the binary checksum. The shared verifier (CTX-1433, #2364) is
          # the same code path the package-manifest gate exercises, so a local
          # digest compared against a locally written sidecar cannot pass.
          SHA="$(scripts/verify-cdn-sidecar.sh "$BASE_URL" "$ASSET")"
          cp packaging/PKGBUILD.bin "$AUR_DIR/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$AUR_DIR/PKGBUILD"
          sed -i "s/REPLACE_WITH_RELEASE_SHA256/$SHA/" "$AUR_DIR/PKGBUILD"
          if grep -q "REPLACE_WITH_RELEASE_SHA256" "$AUR_DIR/PKGBUILD"; then
            echo "sha256 placeholder not fully replaced" >&2
            exit 1
          fi
          id builder >/dev/null 2>&1 || useradd --create-home builder
          # Keep the AUR checkout root-owned so root git stays trusted; run
          # makepkg as builder only inside an isolated BUILD_DIR copy.
          BUILD_DIR="$(mktemp -d)"
          cp "$AUR_DIR/PKGBUILD" "$BUILD_DIR/PKGBUILD"
          chown -R builder:builder "$BUILD_DIR"
          su builder -s /bin/bash -c "cd \"$BUILD_DIR\" && makepkg --printsrcinfo > .SRCINFO"
          install -m644 "$BUILD_DIR/.SRCINFO" "$AUR_DIR/.SRCINFO"
          rm -rf "$BUILD_DIR"
          # Pin the rendered recipe to the R2/CDN host and the verified digest
          # before it reaches AUR (the fallback GitHub URL is a comment only).
          # CTX-1436 (#2417): assert the *resolved* source URL. The template
          # renders the download name through `${_bitty_asset}`, so the former
          # literal asset-name needle could never match and failed v0.0.25's
          # bitty-bin channel after every other channel had published.
          if ! scripts/assert-aur-bin-render.sh \
            "$AUR_DIR/PKGBUILD" "$VERSION" "$SHA" "$AUR_DIR/.SRCINFO"; then
            echo "::error::bitty-bin channel failed: rendered AUR recipe violates the R2/CDN + digest contract"
            exit 1
          fi
          git -C "$AUR_DIR" config user.name "github-actions[bot]"
          git -C "$AUR_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$AUR_DIR" add PKGBUILD .SRCINFO
          git -C "$AUR_DIR" diff --cached --quiet || git -C "$AUR_DIR" commit -m "chore(aur): bump bitty-bin to $VERSION"
          git -C "$AUR_DIR" push origin master

  homebrew:
    name: Bump Homebrew Formula
    environment: release
    # R2/CDN is the primary formula source (CTX-1413, #1847); wait for the
    # immutable mirror so the rendered URLs and digests describe published bytes.
    needs: [r2-mirror, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && vars.HOMEBREW_PUBLISH == 'true' && needs.validate.outputs.stable == 'true' && !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update Homebrew Formula
        env:
          PUBLISH_TOKEN: ${{ secrets.GH_PAT || secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "Homebrew publishing is enabled but neither GH_PAT nor HOMEBREW_TAP_TOKEN is set" >&2
            exit 1
          fi
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # GitHub Releases fallback is documented in the rendered formula.
          BASE_URL="https://cdn.bitty.run/releases/${TAG}"
          INTEL_ASSET="bitty-x86_64-apple-darwin"
          ARM_ASSET="bitty-aarch64-apple-darwin"
          # Fetch the artifact plus its published sidecar and fail closed on a
          # mismatch; the sidecar digest is what the formula embeds. The shared
          # verifier (CTX-1433, #2364) pins `${BASE_URL}/${asset}.sha256`.
          SHA_INTEL="$(scripts/verify-cdn-sidecar.sh "$BASE_URL" "$INTEL_ASSET")"
          SHA_ARM="$(scripts/verify-cdn-sidecar.sh "$BASE_URL" "$ARM_ASSET")"

          mkdir -p homebrew-tap
          git -C homebrew-tap init
          git -C homebrew-tap remote remove origin 2>/dev/null || true
          git -C homebrew-tap remote add origin "https://x-access-token:${PUBLISH_TOKEN}@github.com/bitty-terminal/homebrew-tap.git"
          if git -C homebrew-tap fetch --depth=1 origin main; then
            git -C homebrew-tap checkout -B main FETCH_HEAD
          else
            git -C homebrew-tap checkout --orphan main
            git -C homebrew-tap rm -rf . 2>/dev/null || true
          fi
          mkdir -p homebrew-tap/Formula
          scripts/render-package-manifests.sh homebrew \
            --version "$VERSION" \
            --base-url "$BASE_URL" \
            --intel-asset "$INTEL_ASSET" \
            --arm-asset "$ARM_ASSET" \
            --sha-intel "$SHA_INTEL" \
            --sha-arm "$SHA_ARM" >homebrew-tap/Formula/bitty.rb
          # The rendered formula must carry the R2/CDN host and the verified
          # digests, not just whichever values the renderer happened to get.
          grep -qF "version \"${VERSION}\"" homebrew-tap/Formula/bitty.rb ||
            { echo "rendered formula lost the release version" >&2; exit 1; }
          grep -qF "url \"${BASE_URL}/${INTEL_ASSET}\"" homebrew-tap/Formula/bitty.rb ||
            { echo "rendered formula lost the R2/CDN Intel URL" >&2; exit 1; }
          grep -qF "url \"${BASE_URL}/${ARM_ASSET}\"" homebrew-tap/Formula/bitty.rb ||
            { echo "rendered formula lost the R2/CDN ARM URL" >&2; exit 1; }
          grep -qF "sha256 \"${SHA_INTEL}\"" homebrew-tap/Formula/bitty.rb ||
            { echo "rendered formula lost the Intel digest" >&2; exit 1; }
          grep -qF "sha256 \"${SHA_ARM}\"" homebrew-tap/Formula/bitty.rb ||
            { echo "rendered formula lost the ARM digest" >&2; exit 1; }
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/bitty.rb
          if ! git -C homebrew-tap diff --cached --quiet; then
            git -C homebrew-tap commit -m "chore(homebrew): bump bitty to ${VERSION}"
            git -C homebrew-tap push origin main
          fi

  scoop:
    name: Bump Scoop Manifest
    environment: release
    # R2/CDN is the primary manifest source (CTX-1413, #1847); wait for the
    # immutable mirror so the rendered URLs and hashes describe published bytes.
    needs: [r2-mirror, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && vars.SCOOP_PUBLISH == 'true' && needs.validate.outputs.stable == 'true' && !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update Scoop manifest
        env:
          PUBLISH_TOKEN: ${{ secrets.GH_PAT || secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "Scoop publishing is enabled but neither GH_PAT nor SCOOP_BUCKET_TOKEN is set" >&2
            exit 1
          fi
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # GitHub Releases fallback is documented in the rendered manifest.
          BASE_URL="https://cdn.bitty.run/releases/${TAG}"
          X64_ASSET="bitty-x86_64-pc-windows-msvc.exe"
          ARM64_ASSET="bitty-aarch64-pc-windows-msvc.exe"
          # Fetch the artifact plus its published sidecar and fail closed on a
          # mismatch; the sidecar digest is what the manifest embeds. The shared
          # verifier (CTX-1433, #2364) pins `${BASE_URL}/${asset}.sha256`.
          SHA_X64="$(scripts/verify-cdn-sidecar.sh "$BASE_URL" "$X64_ASSET")"
          SHA_ARM64="$(scripts/verify-cdn-sidecar.sh "$BASE_URL" "$ARM64_ASSET")"

          mkdir -p scoop-bucket
          git -C scoop-bucket init
          git -C scoop-bucket remote remove origin 2>/dev/null || true
          git -C scoop-bucket remote add origin "https://x-access-token:${PUBLISH_TOKEN}@github.com/bitty-terminal/scoop-bucket.git"
          if git -C scoop-bucket fetch --depth=1 origin main; then
            git -C scoop-bucket checkout -B main FETCH_HEAD
          else
            git -C scoop-bucket checkout --orphan main
            git -C scoop-bucket rm -rf . 2>/dev/null || true
          fi
          mkdir -p scoop-bucket/bucket
          scripts/render-package-manifests.sh scoop \
            --version "$VERSION" \
            --base-url "$BASE_URL" \
            --x64-asset "$X64_ASSET" \
            --arm64-asset "$ARM64_ASSET" \
            --sha-x64 "$SHA_X64" \
            --sha-arm64 "$SHA_ARM64" >scoop-bucket/bucket/bitty.json
          # The rendered manifest must carry the R2/CDN host and the verified
          # digests, not just whichever values the renderer happened to get.
          grep -qF "\"version\": \"${VERSION}\"" scoop-bucket/bucket/bitty.json ||
            { echo "rendered manifest lost the release version" >&2; exit 1; }
          grep -qF "\"url\": \"${BASE_URL}/${X64_ASSET}\"" scoop-bucket/bucket/bitty.json ||
            { echo "rendered manifest lost the R2/CDN x64 URL" >&2; exit 1; }
          grep -qF "\"url\": \"${BASE_URL}/${ARM64_ASSET}\"" scoop-bucket/bucket/bitty.json ||
            { echo "rendered manifest lost the R2/CDN arm64 URL" >&2; exit 1; }
          grep -qF "\"hash\": \"${SHA_X64}\"" scoop-bucket/bucket/bitty.json ||
            { echo "rendered manifest lost the x64 digest" >&2; exit 1; }
          grep -qF "\"hash\": \"${SHA_ARM64}\"" scoop-bucket/bucket/bitty.json ||
            { echo "rendered manifest lost the arm64 digest" >&2; exit 1; }
          git -C scoop-bucket config user.name "github-actions[bot]"
          git -C scoop-bucket config user.email "github-actions[bot]@users.noreply.github.com"
          git -C scoop-bucket add bucket/bitty.json
          if ! git -C scoop-bucket diff --cached --quiet; then
            git -C scoop-bucket commit -m "chore(scoop): bump bitty to ${VERSION}"
            git -C scoop-bucket push origin main
          fi

  copr:
    name: Publish Fedora Copr
    environment: release
    needs: [validate, build, r2-mirror]
    runs-on: ubuntu-24.04
    # Allow a full 10800 s Copr timeout plus check-out/SRPM overhead; the job
    # waits synchronously for the slowest enabled chroot (ctx-1584).
    timeout-minutes: 200
    if: startsWith(github.ref, 'refs/tags/v') && vars.COPR_PUBLISH != 'false' && needs.validate.outputs.stable == 'true' && !contains(github.ref_name, '-')
    env:
      TAG: ${{ github.ref_name }}
      # Slow mirrors (e.g. openeuler-24.03-aarch64, bitty#2693) need more than
      # the Copr default 1800 s to install the mock buildroot. Override with
      # the COPR_BUILD_TIMEOUT repovar; Copr hard-caps builds at 10800 s.
      COPR_BUILD_TIMEOUT: ${{ vars.COPR_BUILD_TIMEOUT || '10800' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install RPM build tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm zstd
          rpm --version
          rpmbuild --version
          zstd --version
      - name: Download Copr source bundles from the CDN
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SOURCEDIR="$RUNNER_TEMP/copr-sources"
          BASE_URL="https://cdn.bitty.run/releases/${TAG}"
          mkdir -p "$SOURCEDIR"
          curl -fsSL --retry 3 --retry-delay 2 -o "$SOURCEDIR/SHA256SUMS" "$BASE_URL/SHA256SUMS"
          for arch in x86_64 aarch64; do
            asset="bitty-${VERSION}-${arch}-unknown-linux-gnu.tar.zst"
            echo "Downloading ${BASE_URL}/${asset}"
            curl -fsSL --retry 3 --retry-delay 2 -o "$SOURCEDIR/$asset" "$BASE_URL/$asset"
          done
          ls -l "$SOURCEDIR"
      - name: Build Copr SRPM
        id: srpm
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SRPM="$(scripts/build-copr-srpm.sh \
            --version "$VERSION" \
            --sourcedir "$RUNNER_TEMP/copr-sources" \
            --output-dir "$RUNNER_TEMP/copr-srpm")"
          echo "srpm=$SRPM" >> "$GITHUB_OUTPUT"
          echo "built ${SRPM}"
      - name: Install copr-cli in a virtual environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/copr-cli"
          "$RUNNER_TEMP/copr-cli/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/copr-cli/bin/pip" install copr-cli
          echo "$RUNNER_TEMP/copr-cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/copr-cli/bin/copr-cli" --version
      - name: Submit SRPM to Copr
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT || 'xuepoo/bitty-terminal' }}
        run: |
          set -euo pipefail
          if [ -z "${COPR_CONFIG:-}" ]; then
            echo "::error::Copr publishing is enabled but COPR_CONFIG is not set" >&2
            exit 1
          fi
          if ! [[ "$COPR_BUILD_TIMEOUT" =~ ^[0-9]+$ ]]; then
            echo "::error::COPR_BUILD_TIMEOUT must be an integer number of seconds, got: $COPR_BUILD_TIMEOUT" >&2
            exit 1
          fi
          if [ "$COPR_BUILD_TIMEOUT" -lt 600 ] || [ "$COPR_BUILD_TIMEOUT" -gt 10800 ]; then
            echo "::error::COPR_BUILD_TIMEOUT must be within 600-10800 seconds (Copr hard-caps builds at 10800), got: $COPR_BUILD_TIMEOUT" >&2
            exit 1
          fi
          echo "Copr build timeout: ${COPR_BUILD_TIMEOUT}s"
          SRPM="${{ steps.srpm.outputs.srpm }}"
          if [ -z "$SRPM" ] || [ ! -f "$SRPM" ]; then
            echo "::error::Copr SRPM was not built" >&2
            exit 1
          fi
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr

          echo "Querying enabled chroots for ${COPR_PROJECT}..."
          PROJECT_INFO="$(copr-cli get "$COPR_PROJECT")"
          CHROOTS="$(printf '%s\n' "$PROJECT_INFO" | awk '/^[[:space:]]+.*-(x86_64|aarch64):/{print $1}' | tr -d ':' | sort -u)"
          if [ -z "$CHROOTS" ]; then
            echo "::error::No enabled x86_64/aarch64 chroots found for project ${COPR_PROJECT}" >&2
            exit 1
          fi
          ARGS=()
          while IFS= read -r chroot; do
            ARGS+=(-r "$chroot")
            echo "  chroot: ${chroot}"
          done <<< "$CHROOTS"
          echo "Submitting ${SRPM} to ${COPR_PROJECT}"
          copr-cli build --timeout "$COPR_BUILD_TIMEOUT" "${ARGS[@]}" "$COPR_PROJECT" "$SRPM"
  apt:
    name: Publish Debian/Ubuntu APT (R2)
    environment: release
    needs: [validate, build, r2-mirror]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') && vars.APT_PUBLISH != 'false' && needs.validate.outputs.stable == 'true' && !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bitty-x86_64-unknown-linux-gnu
          path: dist/x86_64
      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bitty-aarch64-unknown-linux-gnu
          path: dist/aarch64
      - name: Install Wrangler
        run: |
          set -euo pipefail
          npm install -g "wrangler@${WRANGLER_VERSION}"
          wrangler --version
      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/apt-gnupg
        run: |
          set -euo pipefail
          install -d -m 0700 "$GNUPGHOME"
          scripts/import-apt-gpg-key.sh --fingerprint "$APT_GPG_KEY_FINGERPRINT"

      - name: Generate and sign APT repository
        env:
          GNUPGHOME: ${{ runner.temp }}/apt-gnupg
        run: |
          set -euo pipefail
          mkdir -p stage/dist apt_repo
          find dist/x86_64 dist/aarch64 -name '*.deb' -exec cp -t stage/dist {} +

          DEB_COUNT="$(find stage/dist -name '*.deb' | wc -l)"
          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "::error::No .deb artifacts found for APT publication" >&2
            exit 1
          fi

          python3 scripts/generate-apt-repo.py \
            --dist-dir stage/dist \
            --repo-dir apt_repo \
            --assets-dir packaging/apt \
            --gpg-key "$APT_GPG_KEY_FINGERPRINT"

          KEYRING="$PWD/packaging/apt/bitty-archive-keyring.gpg"
          gpgv --keyring "$KEYRING" apt_repo/dists/stable/InRelease
          gpgv --keyring "$KEYRING" apt_repo/dists/stable/Release.gpg apt_repo/dists/stable/Release

      - name: Upload APT repository to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Cloudflare credentials not set; cannot upload to R2" >&2
            exit 1
          fi

          cd apt_repo
          {
            find . -type f -not -path './dists/*'
            find . -type f -path './dists/*' ! -name Release ! -name Release.gpg ! -name InRelease
            find . -type f -path './dists/*' \( -name Release -o -name Release.gpg -o -name InRelease \)
          } | while IFS= read -r FILE; do
            REL_PATH="${FILE#./}"
            KEY="bitty/apt/${REL_PATH}"
            if [[ "$REL_PATH" == pool/* ]]; then
              CACHE="public, max-age=31536000, immutable"
            else
              CACHE="public, max-age=300, must-revalidate"
            fi
            echo "Uploading ${REL_PATH} -> ${KEY} (${CACHE})"
            wrangler r2 object put "$KEY" --file "$REL_PATH" --remote --cache-control "$CACHE"
          done

      - name: Verify APT repository read-back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler r2 object get "bitty/apt/dists/stable/Release" --remote --pipe | cmp - apt_repo/dists/stable/Release
          wrangler r2 object get "bitty/apt/dists/stable/InRelease" --remote --pipe | cmp - apt_repo/dists/stable/InRelease
          echo "verified R2 APT repository indices (byte-identical)"

  nix:
    name: Publish Nix Flake (Cachix)
    environment: release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/v') && vars.NIX_PUBLISH != 'false' && needs.validate.outputs.stable == 'true' && !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: bitty
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - name: Build and push Nix package to Cachix
        run: nix build .#bitty --print-build-logs
      - name: Verify build artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -x result/bin/bitty
          version="${TAG#v}"
          scripts/check-version-output.sh "$version" result/bin/bitty

  # CTX-1413 (#1847): the immutable mirror is the preferred download source
  # for the AUR bitty-bin, Homebrew, and Scoop publishers above. Those jobs
  # wait on this one and verify every artifact against its published .sha256
  # sidecar before rendering; GitHub Releases stays the documented fallback.
  r2-mirror:
    name: Mirror release to R2
    environment: release
    needs: [release, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.stable == 'true' && !contains(github.ref_name, '-')
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS and provenance
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -R dist
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TOOLCHAIN="$(scripts/rust-channel.sh)"
          printf '{\n  "commit": "%s",\n  "tag": "%s",\n  "date": "%s",\n  "toolchain": "%s",\n  "build_runner": "github-actions"\n}\n' "$COMMIT" "$TAG" "$DATE" "$TOOLCHAIN" > dist/provenance.json
          cat dist/provenance.json
      - name: Install Wrangler
        run: |
          set -euo pipefail
          npm install -g "wrangler@${WRANGLER_VERSION}"
          wrangler --version
      - name: Sync dist to R2
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; cannot mirror to R2" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set; cannot mirror to R2" >&2
            exit 1
          fi
          # Immutable guard (CTX-1270): release paths are immutable once published
          # (cache-control immutable). Re-runs rebuild non-reproducible bytes,
          # so a blind put can desync tarballs from SHA256SUMS (0.0.23 hit the
          # x86_64-unknown-linux-gnu asset and broke AUR). Before each put,
          # fetch the existing object: skip when bytes match, fail on mismatch.
          # Graphics-pilot and future r2-components publishers are follow-up.
          for FILE in dist/*; do
            NAME="$(basename "$FILE")"
            KEY="bitty/releases/${TAG}/${NAME}"
            TMP="$(mktemp)"
            ERR="${TMP}.err"
            if wrangler r2 object get "$KEY" --remote --pipe > "$TMP" 2>"$ERR"; then
              if cmp -s "$FILE" "$TMP"; then
                echo "skip ${NAME}: remote object exists with identical bytes"
                rm -f "$TMP" "$ERR"
                continue
              else
                echo "::error::R2 object ${KEY} already exists with different bytes; refusing to overwrite immutable release artifact ${NAME}" >&2
                rm -f "$TMP" "$ERR"
                exit 1
              fi
            else
              GET_STATUS=$?
              if grep -qiE 'not[ _-]?found|NoSuchKey|404|does not exist' "$ERR"; then
                echo "uploading ${NAME}: no existing object at ${KEY}"
              else
                echo "::error::failed to check existing R2 object ${KEY} (exit ${GET_STATUS}); refusing to upload blindly" >&2
                cat "$ERR" >&2 || true
                rm -f "$TMP" "$ERR"
                exit 1
              fi
            fi
            rm -f "$TMP" "$ERR"
            wrangler r2 object put "bitty/releases/${TAG}/${NAME}" \
              --file "$FILE" --remote \
              --cache-control "public, max-age=31536000, immutable"
          done
      - name: Verify R2 read-back hashes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FAIL=0
          while read -r EXPECTED NAME; do
            [ -n "${EXPECTED:-}" ] || continue
            ACTUAL="$(wrangler r2 object get "bitty/releases/${TAG}/${NAME}" --remote --pipe | sha256sum | cut -d' ' -f1)" || ACTUAL="DOWNLOAD-FAILED"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::R2 hash mismatch for ${NAME}: expected ${EXPECTED}, got ${ACTUAL}"
              FAIL=1
            else
              echo "verified ${NAME} ${ACTUAL}"
            fi
          done < dist/SHA256SUMS
          # Manifest files travel alongside the payload and must round-trip
          # byte-identical even though they are not listed in SHA256SUMS.
          for META in SHA256SUMS provenance.json; do
            if wrangler r2 object get "bitty/releases/${TAG}/${META}" --remote --pipe | cmp - "dist/${META}"; then
              echo "verified ${META} (byte-identical)"
            else
              echo "::error::R2 content mismatch for ${META}"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "R2 read-back verification failed" >&2
            exit 1
          fi
          echo "All R2 objects verified against SHA256SUMS"

  # CTX-1056 (#1794): publish the mutable stable install pointers after the
  # immutable mirror verifies. latest.txt holds TAG (for example v0.0.23) with
  # a trailing newline; install.sh/install.ps1 resolve TAG here, then derive
  # VERSION by stripping the leading v. Short cache-control bounds staleness;
  # scripts re-fetch every run. install.sh/install.ps1 upload in this job too
  # (CTX-1210 #1847): the scripts landed in CTX-1047 Phase 2 and their keys
  # and cache policy were reserved in packaging/README.md; this wires the two
  # puts plus read-back verify with no convention change. The monotonic guard
  # covers the scripts as well: an older tag finishing later must not regress
  # the stable scripts, so the skip path leaves them untouched.
  r2-stable:
    name: Publish R2 stable pointers
    environment: release
    needs: [r2-mirror, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && needs.validate.outputs.stable == 'true'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write latest.txt
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ref name is not a version tag: $TAG" >&2
            exit 1
          fi
          printf '%s\n' "$TAG" > latest.txt
          cat latest.txt
      - name: Install Wrangler
        run: |
          set -euo pipefail
          npm install -g "wrangler@${WRANGLER_VERSION}"
          wrangler --version
      - name: Publish latest.txt to R2
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; cannot publish stable pointers" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set; cannot publish stable pointers" >&2
            exit 1
          fi
          # Monotonic pointer: tag runs share one key but run in per-tag
          # concurrency groups, so an older tag finishing later must not move
          # latest.txt backward. Missing key means first publish and proceeds.
          base() { printf '%s' "${1#v}" | cut -d- -f1; }
          STORED="$(wrangler r2 object get "bitty/install/latest.txt" --remote --pipe 2>/dev/null | head -n 1 | tr -d '\r' || true)"
          if [[ -n "${STORED:-}" && "$STORED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] && [ "$(printf '%s\n%s\n' "$(base "$TAG")" "$(base "$STORED")" | sort -V | head -n 1)" = "$(base "$TAG")" ] && [ "$(base "$TAG")" != "$(base "$STORED")" ]; then
            echo "candidate $TAG older than stored $STORED; skipping stable-pointer update"
            printf '%s\n' "$STORED" > retained.txt
            touch stable.skip
            if wrangler r2 object get "bitty/install/latest.txt" --remote --pipe | cmp - retained.txt; then
              echo "verified retained pointer $STORED"
            else
              echo "::error::R2 content mismatch for retained pointer $STORED"
              exit 1
            fi
            exit 0
          fi
          rm -f stable.skip
          wrangler r2 object put "bitty/install/latest.txt" \
            --file latest.txt --remote \
            --cache-control "public, max-age=300, must-revalidate"
      # CTX-1210 (#1847): publish the stable bootstrap scripts alongside
      # latest.txt. Keys and cache policy are the ones reserved in
      # packaging/README.md (mutable stable class, 5-minute bound). The
      # sources are the tag's own scripts/install.sh + scripts/install.ps1
      # (this job checks out the tag), so the stable scripts always match a
      # TAG that latest.txt can point at. The skip path leaves both keys
      # untouched: an older tag finishing later must not regress them.
      - name: Publish install scripts to R2
        run: |
          set -euo pipefail
          if [ -f stable.skip ]; then
            echo "candidate older than stored pointer; skipping install-script upload"
            exit 0
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; cannot publish install scripts" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set; cannot publish install scripts" >&2
            exit 1
          fi
          for SCRIPT in install.sh install.ps1; do
            if [ ! -f "scripts/${SCRIPT}" ]; then
              echo "::error::missing install script: scripts/${SCRIPT}" >&2
              exit 1
            fi
          done
          wrangler r2 object put "bitty/install/install.sh" \
            --file scripts/install.sh --remote \
            --cache-control "public, max-age=300, must-revalidate"
          wrangler r2 object put "bitty/install/install.ps1" \
            --file scripts/install.ps1 --remote \
            --cache-control "public, max-age=300, must-revalidate"
      - name: Verify latest.txt read-back
        run: |
          set -euo pipefail
          if [ -f stable.skip ]; then
            if wrangler r2 object get "bitty/install/latest.txt" --remote --pipe | cmp - retained.txt; then
              echo "verified retained pointer (byte-identical)"
            else
              echo "::error::R2 content mismatch for retained pointer"
              exit 1
            fi
          elif wrangler r2 object get "bitty/install/latest.txt" --remote --pipe | cmp - latest.txt; then
            echo "verified latest.txt (byte-identical)"
          else
            echo "::error::R2 content mismatch for latest.txt"
            exit 1
          fi
      # CTX-1210 (#1847): read-back-verify the stable scripts byte-identical
      # to the tag's sources, mirroring the latest.txt verify above. The skip
      # path verifies nothing: the retained scripts are not in this tree, and
      # the publish step left the keys untouched.
      - name: Verify install scripts read-back
        run: |
          set -euo pipefail
          if [ -f stable.skip ]; then
            echo "stable pointer retained; install scripts untouched, nothing to verify"
            exit 0
          fi
          if wrangler r2 object get "bitty/install/install.sh" --remote --pipe | cmp - scripts/install.sh; then
            echo "verified install.sh (byte-identical)"
          else
            echo "::error::R2 content mismatch for install.sh"
            exit 1
          fi
          if wrangler r2 object get "bitty/install/install.ps1" --remote --pipe | cmp - scripts/install.ps1; then
            echo "verified install.ps1 (byte-identical)"
          else
            echo "::error::R2 content mismatch for install.ps1"
            exit 1
          fi

  # CTX-1436 (#2417): one table in the run summary for every package channel.
  # v0.0.25 published all channels except `bitty-bin`; the run went red, but
  # the only trace was that one job's log. This job names the failed channel in
  # the summary and as an annotation, and fails so a partial release cannot be
  # read as a successful one. Skipped channels are toggles or blocked upstream;
  # they are listed but never counted as success or failure on their own.
  channel-summary:
    name: Summarize package channels
    needs: [r2-mirror, aur, aur-bin, homebrew, scoop, copr, apt, nix]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Summarize package channels
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          R2_RESULT: ${{ needs.r2-mirror.result }}
          AUR_RESULT: ${{ needs.aur.result }}
          AUR_BIN_RESULT: ${{ needs.aur-bin.result }}
          HOMEBREW_RESULT: ${{ needs.homebrew.result }}
          SCOOP_RESULT: ${{ needs.scoop.result }}
          COPR_RESULT: ${{ needs.copr.result }}
          APT_RESULT: ${{ needs.apt.result }}
          NIX_RESULT: ${{ needs.nix.result }}
        run: |
          set -euo pipefail
          LABELS=(
            "R2 mirror (prerequisite)"
            "AUR source (bitty)"
            "AUR binary (bitty-bin)"
            "Homebrew (bitty formula)"
            "Scoop (bitty manifest)"
            "Fedora Copr (bitty rpm)"
            "Debian/Ubuntu APT (R2)"
            "Nix Flake (Cachix)"
          )
          RESULTS=(
            "$R2_RESULT"
            "$AUR_RESULT"
            "$AUR_BIN_RESULT"
            "$HOMEBREW_RESULT"
            "$SCOOP_RESULT"
            "$COPR_RESULT"
            "$APT_RESULT"
            "$NIX_RESULT"
          )
          {
            echo "## Package channels for ${TAG}"
            echo
            echo "| Channel | Result |"
            echo "| --- | --- |"
          } >>"$GITHUB_STEP_SUMMARY"
          for i in "${!LABELS[@]}"; do
            printf '| %s | %s |\n' "${LABELS[$i]}" "${RESULTS[$i]}" >>"$GITHUB_STEP_SUMMARY"
          done
          failed=0
          skipped=0
          for i in "${!LABELS[@]}"; do
            case "${RESULTS[$i]}" in
              success) ;;
              skipped)
                skipped=$((skipped + 1))
                printf -- '- %s skipped (publish toggle disabled or an upstream job failed).\n' \
                  "${LABELS[$i]}" >>"$GITHUB_STEP_SUMMARY"
                ;;
              *)
                printf -- '- **%s failed** (result: %s).\n' \
                  "${LABELS[$i]}" "${RESULTS[$i]}" >>"$GITHUB_STEP_SUMMARY"
                echo "::error::package channel ${LABELS[$i]} result: ${RESULTS[$i]}"
                failed=1
                ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            {
              echo
              echo "Repair published channel state without moving the tag:"
              echo
              echo '```sh'
              echo "gh workflow run repair-release-channels.yml \\"
              echo "  --ref ${DEFAULT_BRANCH} -f tag=${TAG} -f channels=all"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "one or more package channels failed; see the run summary" >&2
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "${skipped} package channel(s) skipped; none failed"
          else
            echo "all package channels succeeded"
          fi

  # CTX-2504 (#2504): every leg asserts the installed binary reports EXACTLY
  # the release version. A bare `bitty --version | grep -F "<version>"` (or a
  # `Select-String` that prints nothing) exits 0 when the string is missing, and
  # the 0.0.26 literals went stale the moment the next tag was cut. The expected
  # version is derived from the tag that triggered the run, so the tag stays the
  # single source of truth and no leg carries its own version literal.
  post-release-smoke:
    name: Post-release E2E (${{ matrix.channel }})
    needs: [channel-summary, r2-stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: "Linux install.sh (R2)"
            os: ubuntu-latest
            run: |
              curl -fsSL https://cdn.bitty.run/install/install.sh | bash
              scripts/check-version-output.sh "$RELEASE_VERSION" ~/.local/bin/bitty
          - channel: "macOS Homebrew (R2)"
            os: macos-latest
            run: |
              brew tap bitty-terminal/homebrew-tap
              brew trust bitty-terminal/homebrew-tap
              brew install bitty
              scripts/check-version-output.sh "$RELEASE_VERSION" bitty
          - channel: "Windows install.ps1 (R2)"
            os: windows-latest
            run: |
              $expected = $env:RELEASE_VERSION
              if (-not $expected) { throw 'RELEASE_VERSION is not set' }
              irm https://cdn.bitty.run/install/install.ps1 | iex
              $exe = Join-Path $env:LocalAppData 'bitty\bin\bitty.exe'
              if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "bitty.exe is not a file: $exe" }
              $out = (& $exe --version 2>&1 | Out-String)
              $code = $LASTEXITCODE
              if ($code -ne 0) { throw "bitty --version exited $code" }
              $pattern = '\Abitty ' + [regex]::Escape($expected) + ' \([^\s()]+ [^\s()]+\)(?:\r\n|\n)\z'
              Write-Host "bitty --version => $($out.TrimEnd())"
              if ($out -cnotmatch $pattern) {
                throw "unexpected bitty version: '$out' (want $expected)"
              }
          - channel: "Windows Scoop (R2)"
            os: windows-latest
            run: |
              $expected = $env:RELEASE_VERSION
              if (-not $expected) { throw 'RELEASE_VERSION is not set' }
              Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
              irm get.scoop.sh | iex
              scoop bucket add bitty https://github.com/bitty-terminal/scoop-bucket
              scoop install bitty
              $shim = (scoop which bitty | Select-Object -First 1)
              if ([string]::IsNullOrWhiteSpace($shim)) { throw 'scoop which bitty returned no path' }
              $shim = $shim.Trim()
              if (-not (Test-Path -LiteralPath $shim -PathType Leaf)) {
                throw "scoop which bitty did not resolve to an existing file: $shim"
              }
              if ([IO.Path]::GetExtension($shim) -notin @('.exe', '.cmd', '.bat', '.ps1')) {
                throw "scoop which bitty did not resolve to an executable shim: $shim"
              }
              $out = (& $shim --version 2>&1 | Out-String)
              $code = $LASTEXITCODE
              if ($code -ne 0) { throw "bitty --version exited $code" }
              $pattern = '\Abitty ' + [regex]::Escape($expected) + ' \([^\s()]+ [^\s()]+\)(?:\r\n|\n)\z'
              Write-Host "bitty --version => $($out.TrimEnd())"
              if ($out -cnotmatch $pattern) {
                throw "unexpected bitty version: '$out' (want $expected)"
              }
    steps:
      # The tag is the only version input: `vX.Y.Z` -> `X.Y.Z`, exported to
      # every leg through $GITHUB_ENV. An unexpected tag shape fails here
      # instead of turning into an unmatched (and therefore failing) assertion.
      - name: Resolve expected release version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected stable release tag: ${TAG}" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${version}" >>"$GITHUB_ENV"
          echo "expected bitty version: ${version}"
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test installation from CDN (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ${{ matrix.run }}
      - name: Test installation from CDN (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ${{ matrix.run }}
