[package]
name = "bitty-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
winit = "0.30"
# ADR-0004 wrapper-rule exception: raw display/window handles are unavoidable
# at the GPU surface boundary (wgpu 25 consumes 0.6), so the exact version is
# pinned and re-exported; see crate-level ownership rules and src/surface.rs.
raw-window-handle = "=0.6.2"

[features]
# Opt-in integration tests that require a live display server (Wayland/X11).
# They are excluded from CI and from the default test run; execute locally with
# `cargo test -p bitty-platform --features gui-tests`.
gui-tests = []

# Runs as a plain process entry point (`harness = false`) because winit
# requires event-loop creation on the OS main thread; see the file header.
[[test]]
name = "headless_run"
harness = false

