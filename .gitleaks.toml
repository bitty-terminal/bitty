title = "bitty gitleaks configuration"

# CTX-0415 / GitHub #672: placeholder fixtures in
# crates/bitty-agent/src/tool.rs tests are synthetic sequential strings
# (ghp_abcdefgh12345678, abcdefgh12345678), never real credentials. They
# exercise the credential scrubber and must stay greppable in tests, so they
# are allowlisted here instead of being rotated or removed. If a real secret
# is ever suspected, rotate at the source and do not extend this list.

[extend]
useDefault = true

[[allowlists]]
description = "CTX-0415 placeholder fixtures in bitty-agent tool.rs tests, not real secrets (issue #672)"
targetRules = ["generic-api-key"]
regexes = [
  '''ghp_abcdefgh12345678''',
  '''abcdefgh12345678''',
]

[[allowlists]]
description = "CTX-1481 public Bitty APT archive key fingerprint (packaging/apt/bitty-archive-keyring.gpg); a public key identifier, not a credential"
targetRules = ["generic-api-key"]
regexes = [
  '''BCB87D7B489A64168080D900DF4751B6EA711CB8''',
]
