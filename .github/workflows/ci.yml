      # graph, so full DWARF dominated their footprint. Line tables keep
      # file:line in panic output at a fraction of the disk, the same policy
      # the quality and compat jobs already apply.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # #2561: the hosted image ships multi-GB SDKs this Rust workspace never
      # uses. Reclaim them before the caches restore and the build starts, the
      # same step the quality job runs since #2448; this is the headroom the
      # shared-target bench build below is measured against.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      # CTX-0971 R4: same Cargo.lock-scoped sccache namespace as quality so
      # the three ubuntu jobs share dep units.
      - name: Scope sccache namespace to Cargo.lock hash
        run: echo "SCCACHE_GHA_VERSION=v1-$(sha256sum Cargo.lock | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Resolve validation pins
        id: validation-pins
        run: |
          set -a
          . ./validation-pins.env
          set +a
          echo "compat-lab-rev=$BITTY_COMPAT_LAB_REV" >> "$GITHUB_OUTPUT"
          echo "perf-rev=$BITTY_PERF_REV" >> "$GITHUB_OUTPUT"

      - name: Check out pinned bitty-perf suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitty-terminal/bitty-perf
          ref: ${{ steps.validation-pins.outputs.perf-rev }}
          path: external/bitty-perf

