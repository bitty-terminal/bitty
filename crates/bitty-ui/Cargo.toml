[package]
name = "bitty-ui"
description = "View, layout and selection primitives for Bitty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["ui", "layout", "terminal", "bitty"]
categories = ["gui", "data-structures"]
publish = true

[lints]
workspace = true

[dependencies]
bitty-term-state = { version = "0.0.26", path = "../bitty-term-state" }
# CTX-1362 / #2257: the accepted W-134 snapshot-model seam. The extension
# owns `Role`/`SceneKind`/`SnapshotBuilder`/`Adapter` and the bounded host
# contract; Core implements `SnapshotHost` over its terminal projection and
# keeps derivation, focus association, and validation. This is the only
# Core library edge to `bitty-a11y`; the W-147 fence records it deliberately
# (`SEAM_CRATES` plus the `SOURCE_SEAM_FILES` restriction in
# verify_w147_small_core_graph.rs).
# CTX-1362 / #2257: linked SnapshotHost model seam. This remains the safe
# fallback and keeps the already-reviewed model pin independent of the
# component protocol pin below.
bitty-a11y = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-a11y", rev = "8e02ab5" }
# CTX-1466 / #2496 / #2257: default-off component protocol pin. This is the
# merged bitty-a11y#19 protocol revision (squash of #18 plus the MSRV fix).
# Keep the component path default-off; W-147 confines both names to
# a11y_host.rs.
bitty-a11y-component = { package = "bitty-a11y", version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-a11y", rev = "99486eef216d77b8f81d2b67f2cef856af266a3f" }


[dev-dependencies]
bitty-rich = { version = "0.0.26", path = "../bitty-rich" }
bitty-term-state = { version = "0.0.26", path = "../bitty-term-state" }
bitty-vt = { version = "0.0.26", path = "../bitty-vt" }
