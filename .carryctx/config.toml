schema_version = 1

[project]
id = "01M0WAMWPGZ2YDGM6M88AT3YGT"
name = "bitty"
task_prefix = "CTX"

[git]
main_branch = "main"
branch_template = "carryctx/{task_id}-{slug}"

[session]
stale_after = "2h"
single_active_session_per_agent = true

[task]
single_active_task_per_agent = true
strict_completion = false
list_limit = 200

[context]
default_mode = "compact"
max_events = 10
lookback = "7d"
include_git_status = true

[checkpoint]
require_before_session_end = true
capture_diff_stats = true
capture_untracked_files = true

[output]
color = "auto"
unicode = true
verbose = false

[output.fields]

[agent]

[verification]
commands = ["just check", "cargo check --workspace --all-targets --locked", "cargo check --target x86_64-pc-windows-gnu --workspace --all-targets --locked", "act -n --workflows .github/workflows/ci.yml --workflows .github/workflows/codeql.yml"]
