name: Snapshot source

# Verifies that the CarryCtx publication at refs/heads/carryctx-snapshots was
# taken from the current main HEAD. In-repo publication retired the separate
# *-workflow mirror: the commander's merge closeout runs `just workflow-publish`
# (native `carryctx export --publication` + `git push` of the snapshot branch).
#
# Triggers:
#   - push to main: fails while a newer main HEAD is unpublished, so a red run
#     is the closeout signal to publish.
#   - push to carryctx-snapshots: re-checks and turns green once the closeout
#     publishes the snapshot for the pending main HEAD.
# Pull requests are unaffected: neither trigger is a pull_request event, so PR
# builds and their required checks are untouched. Before the first publication
# the branch does not exist yet; the check then passes with a notice so main is
# not blocked while in-repo publication rolls out.

on:
  push:
    branches:
      - main
      - carryctx-snapshots

permissions:
  contents: read

concurrency:
  group: snapshot-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-source:
    name: Snapshot source matches main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch main and snapshot refs
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/carryctx-snapshots:refs/remotes/origin/carryctx-snapshots || true

      - name: Verify CarryCtx-Source trailer matches main HEAD
        run: |
          set -euo pipefail
          snapshot_ref=refs/remotes/origin/carryctx-snapshots
          if ! git rev-parse --verify -q "$snapshot_ref" >/dev/null; then
            echo "::notice title=CarryCtx snapshot::refs/heads/carryctx-snapshots is not published yet; skipping source check."
            exit 0
          fi
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          source_line="$(git log -1 --format=%B "$snapshot_ref" | sed -n 's/^CarryCtx-Source: //p' | head -n1)"
          if [ -z "$source_line" ]; then
            echo "::error::snapshot tip has no CarryCtx-Source trailer"
            exit 1
          fi
          # Trailer shape: `<project>@<short-rev> (<branch>)`.
          rev="${source_line#*@}"
          rev="${rev%% *}"
          if [ -z "$rev" ] || [ "$rev" = "$source_line" ]; then
            echo "::error::cannot parse CarryCtx-Source trailer: $source_line"
            exit 1
          fi
          case "$main_sha" in
          "$rev"*)
            echo "snapshot source $rev matches main HEAD $main_sha"
            ;;
          *)
            echo "::error::snapshot refs/heads/carryctx-snapshots source ($rev) != main HEAD ($main_sha); run 'just workflow-publish' during merge closeout"
            exit 1
            ;;
          esac
