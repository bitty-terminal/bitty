  macos:
    name: macOS ARM64 check and test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # W-105: compat-lab suites run from this pinned checkout (see the
      # validation-pins steps below); runtime M1 suites run in-workspace.
      BITTY_COMPAT_LAB_DIR: external/bitty-compat-lab
      # #2561: the pinned perf bench build shares the workspace target dir
      # here too, so this job holds one product graph instead of two. The
      # macOS runner has more disk headroom than the Linux one, so it keeps
      # the default profile debuginfo and build parallelism.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve validation pins
        id: validation-pins
        run: |
          set -a
          . ./validation-pins.env
          set +a
          echo "compat-lab-rev=$BITTY_COMPAT_LAB_REV" >> "$GITHUB_OUTPUT"
          echo "perf-rev=$BITTY_PERF_REV" >> "$GITHUB_OUTPUT"

      - name: Check out pinned bitty-perf suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitty-terminal/bitty-perf
          ref: ${{ steps.validation-pins.outputs.perf-rev }}
          path: external/bitty-perf

      - name: Check out pinned bitty-compat-lab suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitty-terminal/bitty-compat-lab
          ref: ${{ steps.validation-pins.outputs.compat-lab-rev }}
          path: external/bitty-compat-lab

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy

      # HK-07: compilation cache on the managed Cache backend. Scoped to
      # OS + toolchain (+ job, Cargo.lock, and rustc hashes appended by the
      # action) with prefix fallback on restore. Raw target/ stays out of
      # actions/cache; nothing here keys on sources, and no install step is
      # gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}

      # CTX-0697: deny rustc warnings so new warnings fail CI going forward.
      - name: Check workspace compilation (macOS ARM64)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --locked

      # CTX-0847: nextest (isolated processes, bounded timeouts, capped
      # real-process group) replaces the libtest run; doctests and the two
      # harness=false platform entry points run explicitly since nextest
      # covers neither.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.145

      - name: Run tests (macOS ARM64, nextest ci profile)
        run: cargo nextest run --workspace --locked --profile ci

      - name: Run doctests (macOS ARM64)
        run: cargo test --workspace --doc --locked

      - name: Run harness=false platform entry points (macOS ARM64)
        run: cargo test -p bitty-platform --test headless_run --test winit_window --locked

      # CTX-0922: the default nextest run only covers the compiled-out
      # `bitty dev` paths; rerun the CLI tests with the opt-in dev-tools
      # feature so the dev-tool success paths keep macOS coverage.
      # (`bitty dev trace` has no enabling feature since the W-105
      # relocation; its disabled diagnostic is covered by the default run.)
      - name: Run bitty dev CLI tests (macOS ARM64, dev-tools feature)
        run: |
          cargo test -p bitty-terminal --features dev-tools --test cli_dev --locked

      # CTX-1061 (#1861): macOS live leg for the bootstrap installers. Same
      # fixture test as the quality job: latest.txt pointer fetch plus real
      # download, sidecar verify, and install against a file:// fake-CDN
      # (no external network). Running it here proves the script under the
      # macOS host shell (shasum fallback, Darwin auto-detect leg); the
      # Linux bundle legs skip here by design (GNU tar -I) and run on Linux.
      - name: Check install scripts live legs (fake-CDN fixture test)
        run: bash scripts/tests/install-scripts.test.sh

      # #2561: report the budget around the bench build; macOS keeps the
      # default profile and parallelism (more disk headroom than Linux), so
      # this step is diagnostics only.
      - name: Report bench disk budget (macOS ARM64)
        run: ./scripts/ci-disk-budget.sh --label "before pinned bitty-perf benches (macOS ARM64)"

      # CTX-0847: the previous `--all-targets` run also executed the bitty-perf
      # benches; nextest runs none of them, so that coverage is kept
      # explicitly here, executed in the pinned external bitty-perf checkout
      # (W-105 thin gate). The bitty-ipc example moved with the CTX-1585
      # extraction to the independent bitty-ipc repository (own CI).
      - name: Run benches (macOS ARM64, pinned bitty-perf suite)
        working-directory: external/bitty-perf
        env:
          # #2561: bound concurrent rustc/link jobs so the peak stays flat.
          CARGO_BUILD_JOBS: "2"
        run: cargo test --benches --locked

      - name: Report bench disk usage (macOS ARM64)
        if: always()
        run: ./scripts/ci-disk-budget.sh --label "after pinned bitty-perf benches (macOS ARM64)"

      # #2561: the bench build shares the workspace target dir, so this only
      # drops a stale tree if one reappears (see the linux-x11 reclaim step).
      - name: Reclaim perf build directory
        run: |
          rm -rf external/bitty-perf/target
          df -h "$GITHUB_WORKSPACE"

      # M1-10 / CTX-0574: macOS ARM64 leg of the M1 compatibility matrix. The
      # suites are headless and free of window/font/GPU dependencies, so the
      # macOS path is exercised without a display.
      - name: Run M1 compatibility matrix
        run: ./scripts/m1-matrix.sh run --platform macos --out m1-results/macos.tsv

      - name: Upload M1 matrix result (macos)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-results-macos
          path: m1-results/macos.tsv
          if-no-files-found: error
          retention-days: 7

      # PERF-11 / CTX-0692: macOS ARM64 leg of the compat release matrix.
      # The suites are headless and free of window/font/GPU dependencies.
      - name: Run compat release matrix
        run: ./scripts/compat-matrix.sh run --platform macos --out compat-results/macos.tsv

      - name: Upload compat matrix result (macos)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # CTX-1624 / #2753: stable name, overwritten on a re-run (see the
          # compat-linux-x11 upload).
          name: compat-results-macos
          path: compat-results/macos*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  supply-chain:
    name: Supply chain (deny/audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2

      - name: Check dependencies (licenses, bans, sources)
        run: cargo deny check

      # Observation only (research 042 item 5, CTX-0505): duplicated transitive
      # versions are expected from winit/wgpu/crossfont/arboard/image/
      # portable-pty and must not be force-unified. `cargo tree --duplicates`
      # exits 0; this step prints the resolved duplicates for PR visibility and
      # never fails the job.
      - name: Observe duplicate dependency versions (informational)
        run: cargo tree --workspace --duplicates --locked

      # unmaintained advisories for ttf-parser/paste are tracked via deny.toml
      # and ignored for audit until upstream replacement lands (winit/metal paths)
      # RUSTSEC-2026-0009 (time < 0.3.47) is the rcgen/yasna path behind the
      # opt-in publication-control feature; deny.toml carries the full
      # justification (parsing feature off, no RFC 2822 input). Remove this
      # ignore when MSRV 1.88 allows time >= 0.3.47.
      # cargo-deny and cargo-audit share ~/.cargo/advisory-db; deny populates it
      # so clear before audit to avoid "Refusing to initialize non-empty directory" failure.
      - name: Audit advisories
        run: rm -rf ~/.cargo/advisory-db && cargo audit --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0192 --ignore RUSTSEC-2026-0009

  windows:
    name: Windows check and test
    runs-on: windows-latest
    # A Cargo.lock dependency bump invalidates rust-cache, so a cold Windows
    # run needs ~31-33 minutes: every test step passes, then the post-cache
    # save expires at the old 30-minute ceiling. 40 keeps the gate honest
    # (each test step has its own bounds) without failing on cache-write time.
    timeout-minutes: 40
    env:
      # W-105: compat-lab suites run from this pinned checkout (see the
      # validation-pins steps below); runtime M1 suites run in-workspace.
      BITTY_COMPAT_LAB_DIR: external/bitty-compat-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve validation pins
        id: validation-pins
        shell: bash
        run: |
          set -a
          . ./validation-pins.env
          set +a
          echo "compat-lab-rev=$BITTY_COMPAT_LAB_REV" >> "$GITHUB_OUTPUT"

      - name: Check out pinned bitty-compat-lab suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitty-terminal/bitty-compat-lab
          ref: ${{ steps.validation-pins.outputs.compat-lab-rev }}
          path: external/bitty-compat-lab

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy

      # HK-07: compilation cache on the managed Cache backend. Scoped to
      # OS + toolchain (+ job, Cargo.lock, and rustc hashes appended by the
      # action) with prefix fallback on restore. Raw target/ stays out of
      # actions/cache; nothing here keys on sources, and no install step is
      # gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}

      # CTX-0697: deny rustc warnings so new warnings fail CI going forward.
      - name: Check workspace compilation
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --locked

      # CTX-1378 (bitty#2288): `publication-control` is default-off, so the
      # workspace check above never compiles the non-Unix adapter
      # (`ai_publication_launch/unsupported.rs`) or the feature-enabled paths
      # that surround it. Compile the shipped graph (no test-support: the
      # fixture TLS server is Unix-only) with warnings denied so the
      # fail-closed Windows arm is type-checked on MSVC.
      #
      # aws-lc-sys (through bitty-network-publication) builds its C sources
      # with CMake, which the image ships, and assembles with NASM, which it
      # does not. `AWS_LC_SYS_PREBUILT_NASM` selects the crate's bundled
      # prebuilt object files when NASM is absent and is ignored when it is
      # present, so this stays valid on either image.
      - name: Check publication-control feature compilation
        env:
          RUSTFLAGS: "-D warnings"
          AWS_LC_SYS_PREBUILT_NASM: "1"
        run: cargo check -p bitty-runtime --features publication-control --all-targets --locked

      # The non-Unix fail-closed fixture lives behind the same default-off
      # feature plus `publication-control-test-support` (the Unix fixture TLS
      # server), so no other leg compiles or runs it. Build the lib test
      # harness with both features and run the single refusal test: preparation
      # must reject the platform before generating material or handles.
      - name: Run publication-control fail-closed test (Windows)
        shell: bash
        env:
          AWS_LC_SYS_PREBUILT_NASM: "1"
        run: cargo test -p bitty-runtime --features publication-control-test-support --lib --locked preparation_fails_closed_on_non_unix_platforms

      # CTX-0847: nextest (isolated processes, bounded timeouts, capped
      # real-process group) replaces the libtest run; doctests and the two
      # harness=false platform entry points run explicitly since nextest
      # covers neither. `shell: bash` keeps the git-bash environment.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.145

      - name: Run tests (nextest ci profile)
        shell: bash
        run: cargo nextest run --workspace --locked --profile ci

      - name: Run doctests
        shell: bash
        run: cargo test --workspace --doc --locked

      - name: Run harness=false platform entry points
        shell: bash
        run: cargo test -p bitty-platform --test headless_run --test winit_window --locked

      # CTX-0922: the default nextest run only covers the compiled-out
      # `bitty dev` paths; rerun the CLI tests with the opt-in dev-tools
      # feature so the dev-tool success paths keep Windows coverage.
      # (`bitty dev trace` has no enabling feature since the W-105
      # relocation; its disabled diagnostic is covered by the default run.)
      - name: Run bitty dev CLI tests (dev-tools feature)
        shell: bash
        run: |
          cargo test -p bitty-terminal --features dev-tools --test cli_dev --locked

      # CTX-1114 (#1908): Windows WSL2 trampoline leg (explicitly labeled until
      # verified end-to-end, never a silent-empty cell). Runs the gated
      # integration plus the component unit suites; skips with notice when WSL
      # is absent on the runner (must NOT fail the suite there). Unix legs prove
      # the no-op contract via the same tests.
      - name: Verify WSL2 trampoline (Windows, gated — skips with notice when WSL absent)
        shell: bash
        run: |
          cargo test -p bitty-runtime --test component_wsl_trampoline --locked -- --nocapture
          cargo test -p bitty-runtime --lib --locked component::wsl::
          cargo test -p bitty-terminal --bin bitty --locked component::

      # M1-10 / CTX-0574: Windows x86_64 (ConPTY) leg of the M1 compatibility
      # matrix, the third ADR-0002 Tier 1 platform. `shell: bash` selects the
      # Git Bash on windows-latest; the suites are headless and the rasterizer
      # used by the color/title golden is the deterministic headless one, so no
      # window or GPU is required.
      - name: Run M1 compatibility matrix
        shell: bash
        run: ./scripts/m1-matrix.sh run --platform windows --out m1-results/windows.tsv

      - name: Upload M1 matrix result (windows)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-results-windows
          path: m1-results/windows.tsv
          if-no-files-found: error
          retention-days: 7

      # PERF-11 / CTX-0692: Windows x86_64 (ConPTY) leg of the compat release
      # matrix. `shell: bash` selects the Git Bash on windows-latest; the
      # suites are headless, so no window or GPU is required.
      - name: Run compat release matrix
        shell: bash
        run: ./scripts/compat-matrix.sh run --platform windows --out compat-results/windows.tsv

      - name: Upload compat matrix result (windows)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # CTX-1624 / #2753: stable name, overwritten on a re-run (see the
          # compat-linux-x11 upload).
          name: compat-results-windows
          path: compat-results/windows*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # CTX-1061 (#1861): Windows live execution for install.ps1. The shell
      # fixture test pins the URL templates statically; this leg proves the
      # script parses and runs on Windows itself (dry-run + PrintUrl, no
      # network: -Version bypasses the latest.txt pointer fetch). Dry-run
      # logs via Write-Host, so only a clean exit is asserted there; the
      # literal layout-table templates (packaging/README.md) are asserted
      # exactly via -PrintUrl, plus prerelease rejection and static asserts.
      - name: Verify install.ps1 dry-run and URL templates (PowerShell 7+)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/install.ps1'
          # Dry-run resolves the plan without downloading (a throw fails the
          # step via $ErrorActionPreference; no native process runs, so
          # $LASTEXITCODE is not meaningful here).
          & $script -Version 0.0.23 -Target x64 -DryRun
          Write-Host 'x64 dry-run OK'
          & $script -Version 0.0.23 -Target arm64 -DryRun
          Write-Host 'arm64 dry-run OK'
          $urls = @( & $script -Version 0.0.23 -Target x64 -PrintUrl )
          if ($urls[0] -ne 'https://cdn.bitty.run/releases/v0.0.23/bitty-0.0.23-windows-x86_64.zip') { throw "x64 PrintUrl mismatch: $($urls[0])" }
          if ($urls[1] -ne 'https://cdn.bitty.run/releases/v0.0.23/bitty-0.0.23-windows-x86_64.zip.sha256') { throw "x64 sidecar mismatch: $($urls[1])" }
          $urlsArm = @( & $script -Version 0.0.23 -Target arm64 -PrintUrl )
          if ($urlsArm[0] -ne 'https://cdn.bitty.run/releases/v0.0.23/bitty-aarch64-pc-windows-msvc.exe') { throw "arm64 PrintUrl mismatch: $($urlsArm[0])" }
          if ($urlsArm[1] -ne 'https://cdn.bitty.run/releases/v0.0.23/bitty-aarch64-pc-windows-msvc.exe.sha256') { throw "arm64 sidecar mismatch: $($urlsArm[1])" }
          Write-Host 'PrintUrl templates OK'
          try {
            & $script -Version 0.0.23-rc1 -Target x64 -DryRun | Out-Null
            throw 'prerelease -Version accepted but rejection was expected'
          } catch {
            if ("$($_.Exception.Message)" -match 'accepted but rejection') { throw }
            Write-Host 'prerelease rejection OK'
          }
          $text = Get-Content -Path $script -Raw
          foreach ($needle in @('install/latest.txt', 'Expand-Archive', 'Get-FileHash', 'irm https://cdn.bitty.run/install/install.ps1 | iex')) {
            if ("$text" -notmatch [regex]::Escape($needle)) { throw "install.ps1 missing '$needle'" }
          }
          Write-Host 'install.ps1 static asserts OK'

      # Same dry-run smoke under Windows PowerShell 5.1: install.ps1 must stay
      # 5.1-clean (review-only until this leg). Reduced to the x64 plan plus
      # its PrintUrl template; the full matrix above runs on 7+.
      - name: Verify install.ps1 dry-run (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/install.ps1'
          # A throw fails the step via $ErrorActionPreference ($LASTEXITCODE
          # is not meaningful: the dry-run path spawns no native process).
          & $script -Version 0.0.23 -Target x64 -DryRun
          $urls = @( & $script -Version 0.0.23 -Target x64 -PrintUrl )
          if ($urls[0] -ne 'https://cdn.bitty.run/releases/v0.0.23/bitty-0.0.23-windows-x86_64.zip') { throw "x64 PrintUrl mismatch: $($urls[0])" }
          if ($urls[1] -ne 'https://cdn.bitty.run/releases/v0.0.23/bitty-0.0.23-windows-x86_64.zip.sha256') { throw "x64 sidecar mismatch: $($urls[1])" }
          Write-Host 'install.ps1 5.1 dry-run OK'

  # M1-10 / CTX-0574: aggregate the four ADR-0002 Tier 1 platform legs into a
  # single pass/fail view. Each platform job runs the M1 evidence suites by
  # name and uploads a `m1-results-<platform>` artifact; this job stitches them
  # into one table on the run summary and fails if any platform is missing a
  # suite, reported a fail, or had a failed job result. That makes a regression
  # on one Tier 1 platform a single visible check instead of four scattered
  # job logs.
  #
  # MSRV is intentionally not a leg: it is a compile-floor gate
  # (`cargo +1.85 check`), not a Tier 1 platform run. The M1 suites are
  # exercised on Linux X11, Linux Wayland, macOS ARM64, and Windows x86_64
  # above, which is the full Tier 1 platform set.
  m1-matrix:
    name: M1 matrix (Tier 1 aggregate)
    if: always()
    needs: [linux-x11, linux-wayland, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      M1_JOB_LINUX_X11: ${{ needs['linux-x11'].result }}
      M1_JOB_LINUX_WAYLAND: ${{ needs['linux-wayland'].result }}
      M1_JOB_MACOS: ${{ needs.macos.result }}
      M1_JOB_WINDOWS: ${{ needs.windows.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download per-platform M1 results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: m1-results-*
          path: m1-results
          merge-multiple: true

      - name: Aggregate M1 matrix
        run: |
          ls -l m1-results || true
          ./scripts/m1-matrix.sh aggregate --dir m1-results --summary "$GITHUB_STEP_SUMMARY"

  # PERF-11 / CTX-0692: aggregate the four ADR-0002 Tier 1 platform legs of
  # the compat release matrix (14 surfaces x 4 terminals) into a single
  # pass/fail view. Each platform job runs the release-matrix suites by name
  # and uploads a `compat-results-<platform>` artifact; this job
  # stitches the run's four into one table on the run summary and fails if
  # any platform is missing a suite, reported a fail, or had a failed job
  # result. That makes a regression on one Tier 1 platform a single visible
  # check instead of four scattered job logs.
  #
  # #2448: the Linux legs run in their own `compat-linux-x11` /
  # `compat-linux-wayland` jobs (one product graph per runner) rather than
  # inline in the platform test jobs, so the `needs`/env mapping below reads
  # those results. The macOS and Windows legs still run inline in their
  # platform jobs. Coverage and the gate are unchanged.
  #
  # CTX-1439 / #2429 introduced per-attempt artifact names because a re-upload
  # to a fixed name appended artifacts instead of replacing them, so
  # `pattern: compat-results-*` with `merge-multiple: true` unpacked every
  # attempt into one directory and the aggregate read a superseded attempt's
  # TSV first (run 39658576023).
  #
  # CTX-1624 / #2753: the attempt suffix cannot survive a partial re-run.
  # `gh run rerun --failed` re-runs only the failed jobs while
  # `${{ github.run_attempt }}` increments for the whole run, so succeeded legs
  # keep their `-N-1` artifacts while this job looks for `-N` and downloads
  # nothing (run 40500927980 attempt 3). The names are therefore stable per
  # platform again, and every upload passes `overwrite: true`, which deletes
  # the same-named artifact in the run before recreating it. A re-run leg
  # replaces its own TSV, untouched legs keep publishing theirs, and the
  # un-suffixed pattern below selects exactly one result per platform - the
  # append ambiguity above is resolved by the overwrite instead of by naming.
  # The `m1-results-*` matrix already relies on the same stable-name contract.
  #
  # MSRV is intentionally not a leg: it is a compile-floor gate
  # (`cargo +1.85 check`), not a Tier 1 platform run.
  compat-matrix:
    name: Compat release matrix (Tier 1 aggregate)
    if: always()
    needs:
      - compat-linux-x11
      - compat-linux-wayland
      - macos
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPAT_JOB_LINUX_X11: ${{ needs.compat-linux-x11.result }}
      COMPAT_JOB_LINUX_WAYLAND: ${{ needs.compat-linux-wayland.result }}
      COMPAT_JOB_MACOS: ${{ needs.macos.result }}
      COMPAT_JOB_WINDOWS: ${{ needs.windows.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download per-platform compat results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # CTX-1624 / #2753: names are stable per platform and every upload
          # overwrites its own artifact, so this pattern selects exactly one
          # TSV per platform even after a partial re-run.
          pattern: compat-results-*
          path: compat-results
          merge-multiple: true

      # CTX-1624 / #2753: fail closed (and name the platform) when a leg
      # produced no artifact at all, instead of letting the aggregate report
      # the same absence once per suite.
      - name: Verify every platform result is present
        run: |
          set -euo pipefail
          missing=()
          while read -r platform; do
            [ -n "$platform" ] || continue
            [ -f "compat-results/${platform}.tsv" ] || missing+=("$platform")
          done < <(./scripts/compat-matrix.sh platforms)
          if ((${#missing[@]} > 0)); then
            echo "::error::compat aggregate is missing results for platform(s): ${missing[*]}"
            ls -l compat-results || true
            exit 1
          fi

      - name: Aggregate compat release matrix
        run: |
          ls -l compat-results || true
          ./scripts/compat-matrix.sh aggregate --dir compat-results --summary "$GITHUB_STEP_SUMMARY"
