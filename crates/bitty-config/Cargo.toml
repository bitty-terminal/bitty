[package]
name = "bitty-config"
description = "Typed, validated configuration pipeline for Bitty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["config", "terminal", "bitty"]
categories = ["config", "command-line-utilities"]
publish = true

[lints]
workspace = true

[dependencies]
bitty-lua = { version = "0.0.39", path = "../bitty-lua" }
bitty-ui = { version = "0.0.39", path = "../bitty-ui" }

[features]
default = []
# Test-only I/O denial harness (`bitty#2869` acceptance): denies and records
# every external configuration read plus every configuration module-loader
# install, so `--safe` can be proved to perform none. Never enabled for a
# shipped build.
io-denied-harness = []
