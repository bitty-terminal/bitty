[package]
name = "bitty-render"
description = "GPU rendering pipeline for Bitty (wgpu + crossfont, with harfrust/swash opt-in)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["render", "gpu", "wgpu", "terminal", "bitty"]
categories = ["graphics", "rendering"]
publish = true

[lints]
workspace = true
[features]
default = []
# Software fallback seed: a bounded CPU alpha-blit of glyph bitmaps onto an
# in-memory RGBA surface. Opt-in; see `src/software.rs`.
sw-fallback = []


[dependencies]
# ADR-0003 dependency rule 3: bitty-render consumes only the public
# Snapshot/Damage render surface of bitty-term-state, never grid internals.
bitty-term-state = { version = "0.0.21", path = "../bitty-term-state" }
# ADR-0003/ADR-0004 platform seam: GpuContext consumes the owned SurfaceTarget
# produced by bitty-platform without leaking winit types.
bitty-platform = { version = "0.0.21", path = "../bitty-platform" }
# Theme preset registry: render consumes bitty-config's single source of
# truth for clear color, default fg/bg, cursor, selection, and ANSI 0-15
# (CTX-0147). bitty-config stays dependency-free (pure std), so no cycle.
bitty-config = { version = "0.0.21", path = "../bitty-config" }
# ADR-0004 rendering rows: ADOPT wgpu (~26.x line); WRAP crossfont
# (production default, CTX-0957 additive landing per DEC-0095); WRAP
# harfrust/swash/fontdb as the explicit opt-in stack (shape with harfrust
# 0.14, rasterize with swash 0.2 over shared skrifa/read-fonts, discover
# with fontdb 0.24, which vendors its query-time parser subset instead of
# depending on external ttf-parser, bitty#1692). Full removal of the
# crossfont wrap is deferred to
# CTX-0961 (chain policy + dynamic fallback + per-OS evidence).
# Neither upstream type may appear in this crate's public API.
wgpu = "26.0"
crossfont = "0.9"
# HarfBuzz shaping port (MIT, rust-version 1.85 exact). Exact pin: the
# fontations floor drifts under swash (see skrifa note below).
harfrust = "=0.14.0"
# Outline + bitmap rasterization (Apache-2.0 OR MIT, no declared MSRV:
# verified on the 1.85 toolchain by the CTX-0957 implementation task).
# Explicit std+scale+render (== upstream defaults, pinned for audit).
swash = { version = "=0.2.10", default-features = false, features = ["std", "scale", "render"] }
# Font discovery (MIT, rust-version 1.71). memmap stays OFF (owned Vec<u8>
# under MAX_FACE_BYTES instead): no persistent-mmap unsafe, no lifetime
# coupling on the hot path. fontconfig XML discovery stays ON (Linux).
# 0.24 vendors its query-time parser subset: no external ttf-parser edge
# on the fontdb path (bitty#1692; ttf-parser remains only via the
# winit/sctk-adwaita/ab_glyph decoration path until CTX-0961).
fontdb = { version = "=0.24.0", default-features = false, features = ["std", "fs", "fontconfig"] }


[dev-dependencies]
# Tests drive the pipeline through real State action scripts; GraphemeCell
# lives in bitty-vt (dev-only edge; the ADR-0003 DAG stays acyclic).
bitty-vt = { version = "0.0.21", path = "../bitty-vt" }
