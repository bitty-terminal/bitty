name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.0.1)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validate packaging metadata before building (nfpm + nix)
  validate:
    name: Validate packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Prepare dummy artifacts for nfpm validation
        run: |
          mkdir -p target/release terminfo
          echo '#!/bin/sh
          echo "bitty 0.0.1"' > target/release/bitty
          chmod +x target/release/bitty
          echo "# dummy" > terminfo/bitty.terminfo
      - name: Validate nfpm (deb/rpm/apk/archlinux)
        run: |
          nfpm package --config nfpm.yaml --packager deb --target /tmp/bitty.deb
          nfpm package --config nfpm.yaml --packager rpm --target /tmp/bitty.rpm
          nfpm package --config nfpm.yaml --packager apk --target /tmp/bitty.apk
          nfpm package --config nfpm.yaml --packager archlinux --target /tmp/bitty.pkg.tar.zst
          ls -lh /tmp/bitty.deb /tmp/bitty.rpm /tmp/bitty.apk /tmp/bitty.pkg.tar.zst
      - name: Check flake syntax
        run: |
          if command -v nix >/dev/null 2>&1; then
            nix flake check --no-build || echo "nix flake check attempted"
          else
            echo "nix not available in validate job, checking flake.nix syntax via nix-instantiate fallback"
            python3 -c "import pathlib; p=pathlib.Path('flake.nix'); assert p.exists(); t=p.read_text(); assert 'description' in t and 'nixpkgs' in t, 'flake.nix missing required fields'; print('flake.nix syntax appears valid')"
          fi
      - name: Validate PKGBUILD syntax
        run: |
          bash -n packaging/PKGBUILD
          bash -n PKGBUILD
          echo "PKGBUILD syntax OK"
      - name: Validate Scoop manifest
        run: |
          python3 -m json.tool bucket/bitty.json > /dev/null && echo "scoop manifest valid"
          python3 -m json.tool packaging/scoop-bitty.json > /dev/null && echo "scoop packaging manifest valid"
      - name: Validate Homebrew Formula syntax
        run: |
          ruby -c Formula/bitty.rb
          ruby -c homebrew/Formula/bitty.rb
          echo "Homebrew Formula syntax OK"

  build:
    name: Build ${{ matrix.target }} (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
            packagers: "deb,rpm,apk,archlinux"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
            packagers: "deb,rpm,apk,archlinux"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            packagers: ""
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
            packagers: ""
          - os: macos-14
            target: x86_64-apple-darwin
            arch: amd64
            packagers: ""
          - os: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            packagers: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install cross compilation deps (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config libfontconfig1-dev:arm64 libfreetype6-dev:arm64

      - name: Install font stack (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Build bitty-app
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
        run: cargo build --release --locked -p bitty-app --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BIN="target/${TARGET}/release/bitty-app"
          if [[ "$TARGET" == *windows* ]]; then
            BIN="${BIN}.exe"
          fi
          ls -lh "$BIN"
          mkdir -p dist
          EXT=""
          if [[ "$TARGET" == *windows* ]]; then
            EXT=".exe"
          fi
          cp "$BIN" "dist/bitty-${TARGET}${EXT}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/bitty-${TARGET}${EXT}" | tee "dist/bitty-${TARGET}${EXT}.sha256"
          else
            shasum -a 256 "dist/bitty-${TARGET}${EXT}" | tee "dist/bitty-${TARGET}${EXT}.sha256"
          fi

      - name: Package (nfpm) - Linux only
        if: contains(matrix.packagers, 'deb')
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          GOPATH_BIN="$(go env GOPATH)/bin"
          export PATH="$GOPATH_BIN:$PATH"
          echo "$GOPATH_BIN" >> "$GITHUB_PATH"
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/bitty-app" target/release/bitty
          # Map target arch to nfpm arch
          NFPM_ARCH="${{ matrix.arch }}"
          if [[ "$NFPM_ARCH" == "arm64" ]]; then NFPM_ARCH="arm64"; fi
          # Override arch in nfpm.yaml via env substitution (simple sed)
          sed "s/^arch:.*/arch: $NFPM_ARCH/" nfpm.yaml > /tmp/nfpm.yaml
          cat /tmp/nfpm.yaml
          for pkg in deb rpm apk archlinux; do
            nfpm package --config /tmp/nfpm.yaml --packager "$pkg" --target "dist/bitty-${{ matrix.target }}.${pkg}"
            ls -lh "dist/bitty-${{ matrix.target }}.${pkg}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bitty-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS and provenance
        run: |
          set -euo pipefail
          ls -R dist
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n  "commit": "%s",\n  "tag": "%s",\n  "date": "%s",\n  "toolchain": "1.97.1",\n  "build_runner": "github-actions"\n}\n' "$COMMIT" "${{ github.ref_name }}" "$DATE" > dist/provenance.json
          cat dist/provenance.json
      - name: Create Release
        uses: softprops/action-gh-release@ff5a07e93bd6d4420dd6ff32c51809449f6bc13c5 # v2.4.1
        with:
          files: |
            dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false

  aur:
    name: Publish AUR (Arch)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && vars.AUR_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "AUR_SSH_PRIVATE_KEY not set, skipping AUR publish"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo "Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            StrictHostKeyChecking no" > ~/.ssh/config
          # Clone AUR package
          git clone ssh://aur@aur.archlinux.org/bitty.git aur-bitty
          # Update PKGBUILD version from tag
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" aur-bitty/PKGBUILD || cp packaging/PKGBUILD aur-bitty/PKGBUILD && sed -i "s/^pkgver=.*/pkgver=$VERSION/" aur-bitty/PKGBUILD
          # Update checksums (SKIP for VCS, otherwise use updpkgsums if available)
          cd aur-bitty
          if command -v updpkgsums >/dev/null 2>&1; then
            updpkgsums
          fi
          # Generate .SRCINFO
          if command -v makepkg >/dev/null 2>&1; then
            makepkg --printsrcinfo > .SRCINFO
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "chore(aur): bump bitty to $VERSION"
          git push

  homebrew:
    name: Bump Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && vars.HOMEBREW_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Update Homebrew Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping"
            exit 0
          fi
          echo "Homebrew bump would run here: update Formula/bitty.rb sha256 and version from release"
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "Version $VERSION"
          # In a real tap, this would clone homebrew-bitty and push updated Formula

  scoop:
    name: Bump Scoop Manifest
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && vars.SCOOP_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Update Scoop manifest
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SCOOP_BUCKET_TOKEN:-}" ]; then
            echo "SCOOP_BUCKET_TOKEN not set, skipping"
            exit 0
          fi
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "Scoop bump to $VERSION"
          python3 -c "import json, pathlib; p=pathlib.Path('bucket/bitty.json'); d=json.loads(p.read_text()); d['version']='$VERSION'; p.write_text(json.dumps(d, indent=4)+'\n'); print('updated scoop manifest to', d['version'])"
          cat bucket/bitty.json
