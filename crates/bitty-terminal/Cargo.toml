[package]
name = "bitty-terminal"
description = "Bitty terminal binary — thin composition root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["terminal", "bitty"]
categories = ["command-line-utilities"]
# Never published to crates.io: thin composition root, and the `bitty` name
# on crates.io belongs to an unrelated project (see packaging/README.md and
# packaging/INSTALL.md). Install from git instead.
publish = false

[lints]
workspace = true

[[bin]]
name = "bitty"
path = "src/main.rs"

# CTX-1479: the storage-component fixture is this harness-free test binary
# (invoked with --root by the host). Keeping it a test target leaves exactly
# one release binary, so packaging recipes need no change.
[[test]]
name = "storage_component_host"
path = "tests/storage_component_host.rs"
harness = false
required-features = ["storage-component"]

# CTX-1361: the composition root's component-store/staging implementation is
# also exposed as a library so integration tests in `bitty-runtime` can drive
# the real `bitty extension add` code path instead of duplicating it. The
# binary keeps using the same source modules; this target adds no runtime
# behavior and pulls no new dependency.
[lib]
name = "bitty_terminal"
path = "src/lib.rs"
# Test seam only: the binary owns this crate's unit/integration coverage, and
# the module's tests reference binary-only modules (`crate::plugin`). Keeping
# the library untested here avoids compiling a second, partial module graph.
test = false
doctest = false

[dependencies]
bitty-config = { version = "0.0.27", path = "../bitty-config" }
bitty-ipc = { git = "https://github.com/bitty-terminal/bitty-ipc", rev = "9493674" }
# CTX-0939 (W-146): the composition root owns the extracted storage
# mechanics. This is the ONLY crate in the workspace that may depend on
# `bitty-storage`: Core library crates consume persistence exclusively
# through Core-owned traits (`SessionFileBackend`, `KvCommitBackend`), so
# the dependency direction stays one-way (extension mechanics behind the
# Core gate, never Core importing the extension).
bitty-storage = { git = "https://github.com/bitty-terminal/bitty-storage", rev = "7bf5177" }
# CTX-1479 / bitty#2495: the storage component host is deliberately opt-in
# while the enable/migration task is still open.  The component pin is the
# merged storage#18 merge commit (`502c7f5`), kept separate from the linked
# model pin above so default builds link no component code.
# Re-pin instructions live in `src/storage_component_host.rs`.
bitty-storage-component = { package = "bitty-storage", git = "https://github.com/bitty-terminal/bitty-storage", rev = "502c7f5", optional = true }
bitty-package = { version = "0.0.27", path = "../bitty-package" }
# CTX-0981 (W-110): the composition root owns the extracted observability
# contract. This is the ONLY crate in the workspace that may depend on
# `bitty-observability-api`: Core library crates never link it (Core keeps
# its own thin verification over these canonical zero-dependency types, so
# the dependency direction stays one-way and default builds link no
# exporters, metrics pipeline, or tracing runtime).
bitty-observability-api = { git = "https://github.com/bitty-terminal/bitty-observability", rev = "f1d08f4" }
bitty-platform = { version = "0.0.27", path = "../bitty-platform" }
bitty-plugin-host = { version = "0.0.27", path = "../bitty-plugin-host" }
bitty-runtime = { version = "0.0.27", path = "../bitty-runtime" }
bitty-render = { version = "0.0.27", path = "../bitty-render" }
bitty-rich = { version = "0.0.27", path = "../bitty-rich" }
bitty-term-state = { version = "0.0.27", path = "../bitty-term-state" }
bitty-vt = { version = "0.0.27", path = "../bitty-vt" }
pollster = { workspace = true }
# CTX-1265 (#2136): Unix TTY single-keypress picker navigation. `nix` (already
# workspace-pinned) provides the safe termios/poll wrappers: cbreak mode
# (ICANON/ECHO off, ISIG kept) plus readiness polling for ESC disambiguation.
# Unix-only; Windows and piped setups keep the line loop (no new crates).
[target.'cfg(unix)'.dependencies]
# `process`/`signal` are the storage component host's process-group isolation
# and kill path (CTX-1479); `user` is the watchdog's owner checks (CTX-1472).
# No other feature changes behavior.
nix = { workspace = true, features = ["fs", "poll", "process", "signal", "term", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[features]
default = []
# CTX-1479 / bitty#2495: explicit architecture seam for the storage component
# host.  This does not change startup wiring, migrate existing XDG state, or
# remove the linked adapter, and stays default-off until the enable/migration
# task lands.
storage-component = ["dep:bitty-storage-component"]
# Enables `bitty dev capture|synthesize|dump|overlay` (CTX-0922): developer
# headless captures, dumps, and overlay proofs stay out of release builds.
dev-tools = []
# Explicit, default-off application boundary regression infrastructure.
input-vm-test-support = ["bitty-platform/input-vm-test-support", "bitty-runtime/input-vm-test-support"]

[dev-dependencies]
# Hermetic `ServeContext` constructors and unbound bearer minters (#1519).
bitty-ipc = { git = "https://github.com/bitty-terminal/bitty-ipc", rev = "9493674", features = ["test-support"] }
# CTX-0939: storage-parity tests build plugin-store values through the same
# `LuaValue` type Core validates; test-only, never linked into the binary.
bitty-lua = { path = "../bitty-lua" }
bitty-test-support = { path = "../bitty-test-support" }
