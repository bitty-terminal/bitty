[package]
name = "bitty-ui"
description = "View, layout and selection primitives for Bitty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty"
keywords = ["ui", "layout", "terminal", "bitty"]
categories = ["gui", "data-structures"]
publish = true

[lints]
workspace = true

[dependencies]
bitty-term-state = { version = "0.0.22", path = "../bitty-term-state" }
# CTX-1176: SnapshotHost seam owns snapshot semantics; Core implements the
# host side only. `version` satisfies `cargo publish`; the git rev stays the
# build source until bitty-a11y lands on crates.io.
bitty-a11y = { version = "0.0.1", git = "https://github.com/bitty-terminal/bitty-a11y", rev = "206b3bc" }


[dev-dependencies]
bitty-rich = { version = "0.0.22", path = "../bitty-rich" }
bitty-term-state = { version = "0.0.22", path = "../bitty-term-state" }
bitty-vt = { version = "0.0.22", path = "../bitty-vt" }
