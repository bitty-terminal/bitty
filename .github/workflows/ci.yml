name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test-heavy jobs (quality, linux-x11, linux-wayland, macos, windows) run the
  # full debug suite, measured at 11-15m on 2026-09-06/07 (CTX-0218; precedent
  # CTX-0193 raised soak 90s->120s the same way). Budget is 30m; do not reduce
  # to 15m. Fast jobs (msrv, supply-chain) stay at 15m. The compat matrix legs
  # (compat-linux-x11, compat-linux-wayland, #2448) build one pinned product
  # graph from scratch on a fresh runner, so they get 40m for a cold sccache
  # namespace.
  # CTX-0971 R4: quality is sharded 2-way via matrix (nextest hash
  # partitions) to cut the 11-15m wall toward total/2 plus setup. The matrix
  # aggregates pass/fail: the job is green only when both shards are green.
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # CTX-0971 R4: sccache with the GHA backend shares compiled dep units
    # across the three ubuntu jobs (quality, linux-x11, linux-wayland), which
    # otherwise cold-build in 6 isolated per-(OS,toolchain,job) rust-cache
    # instances. rust-cache stays alongside (target-dir reuse); sccache adds
    # compiler-output reuse. GHA cache quota is 10 GiB per repo shared with
    # rust-cache/apt: monitor eviction warnings on the Actions cache page.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # The quality shards build the full workspace test graph and then the
      # debug binary. Default debug info fills the runner disk and rust-lld
      # dies with SIGBUS during the runtime-deps gate; the gate does not need
      # DWARF. Keep symbols for backtraces, drop the bulk.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      # #2561: one target tree per runner. Shard 2 also builds the pinned
      # bitty-perf suite from `external/bitty-perf`; without an absolute
      # CARGO_TARGET_DIR that invocation allocates its own full
      # `external/bitty-perf/target` debug tree beside this workspace's, and
      # the duplicate product graph exhausted the hosted disk (ld SIGBUS,
      # then ENOSPC). Absolute so the bench step's working directory cannot
      # fork it. The same dir serves the M1 compat-lab suites in the platform
      # jobs below.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # CI compiles each unit once, so incremental state is dead weight in
      # target/debug/incremental (multi-GB) and only adds disk churn.
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hosted image ships several multi-GB SDKs this Rust workspace never
      # uses. Reclaim them before the build so the shards cannot exhaust the
      # runner disk mid-link (observed as `ld ... signal 7 [Bus error]`).
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      # #2568: v0.0.27 shipped a flake.lock whose nixpkgs narHash (and every
      # github input's lastModified) did not match the pinned revisions. The
      # Cachix publish job only runs on release tags, so PR CI never resolved
      # the lock and the release job failed with "NAR hash mismatch in input".
      # Resolve the lock and evaluate the package graph (no build, no cache
      # push) whenever the flake changes; unrelated PRs pay nothing.
      - name: Detect flake changes
        if: matrix.shard == 1
        id: flake
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          run=true
          if [[ -n "${BASE_SHA:-}" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            if git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
              run=false
              if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(flake\.nix|flake\.lock)$'; then
                run=true
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install Nix (flake lock check)
        if: matrix.shard == 1 && steps.flake.outputs.run == 'true'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Verify flake.lock resolves
        if: matrix.shard == 1 && steps.flake.outputs.run == 'true'
        run: ./scripts/check-nix-lock.sh

      # CTX-0971 R4: scope the sccache GHA namespace to the Cargo.lock hash so
      # dep bumps invalidate stale dep units (mirrors the rust-cache key,
      # which appends Cargo.lock automatically). Set after checkout via
      # GITHUB_ENV because hashFiles in job env evaluates before checkout.
      - name: Scope sccache namespace to Cargo.lock hash
        run: echo "SCCACHE_GHA_VERSION=v1-$(sha256sum Cargo.lock | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      # W-105 relocation (bitty CTX-0931): the compat-lab and perf suites live
      # in independent validation repositories at pinned immutable revisions
      # (validation-pins.env, W-75 pin discipline). The product change path
      # keeps thin required invocations against those pins below; the suite
      # logic itself is owned externally.
      - name: Resolve validation pins
        id: validation-pins
        run: |
          set -a
          . ./validation-pins.env
          set +a
          {
            echo "compat-lab-rev=$BITTY_COMPAT_LAB_REV"
            echo "perf-rev=$BITTY_PERF_REV"
            echo "plugins-repo=$BITTY_PLUGINS_REPO"
            echo "plugins-rev=$BITTY_PLUGINS_REV"
          } >> "$GITHUB_OUTPUT"

      - name: Check out pinned bitty-perf suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitty-terminal/bitty-perf
          ref: ${{ steps.validation-pins.outputs.perf-rev }}
          path: external/bitty-perf

      - name: Check out pinned bitty-compat-lab suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitty-terminal/bitty-compat-lab
          ref: ${{ steps.validation-pins.outputs.compat-lab-rev }}
          path: external/bitty-compat-lab

      # Official plugin catalog source (registry/official/*.toml + gitlink
      # pins). Checked out at the validation pin so the drift gate below is
      # deterministic; submodules stay uninitialized (only gitlinks are read).
      - name: Check out pinned bitty-plugins registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.validation-pins.outputs.plugins-repo }}
          ref: ${{ steps.validation-pins.outputs.plugins-rev }}
          path: external/bitty-plugins

      # bitty-render wraps crossfont (ADR-0004), which links the platform
      # font stack on Linux (FreeType + fontconfig) via pkg-config.
      # HK-07: cache downloaded .deb archives across runs (key = OS + the
      # package lists in this file). Install steps below still run
      # unconditionally; a cold archive just refetches.
      - name: Prepare apt archive directory (cache ownership)
        run: sudo mkdir -p /var/cache/apt/archives && sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Glob only the .deb files: caching the directory itself makes the
          # post-job save walk into /var/cache/apt/archives/partial, which
          # `apt-get install` recreates as root while downloading. tar then
          # fails with "Cannot open: Permission denied" and emits a cache-save
          # warning. In-progress downloads are not worth caching anyway.
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install font stack development libraries
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          libfontconfig1-dev libfreetype6-dev

      # The pinned channel lives in rust-toolchain.toml; resolve it instead of
      # repeating the literal so the workflow tracks the file.
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        # Windows runners default to PowerShell: force bash (git-bash) so the
        # command substitution above parses. No-op on Linux/macOS.
        shell: bash

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: rustfmt, clippy

      # act lacks the Actions runtime cache credentials. Keep the compiler
      # wrapper and use bounded disk caches under the persisted target mount;
      # each shard owns a directory because disk caches support one server.
      # A nonempty GHA namespace enables that backend even when disabled.
      - name: Configure local sccache backend
        if: env.ACT
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=false"
            echo "SCCACHE_GHA_VERSION="
            echo "SCCACHE_DIR=$CARGO_TARGET_DIR/sccache-${{ matrix.shard }}"
            echo "SCCACHE_CACHE_SIZE=1G"
          } >> "$GITHUB_ENV"

      # CTX-0971 R4: sccache server on the GHA backend (shares dep units with
      # the linux-x11/linux-wayland jobs via the same SCCACHE_GHA_VERSION
      # namespace). Kept alongside rust-cache below; posts stats automatically.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # HK-07: compilation cache on the managed Cache backend. Scoped to
      # OS + toolchain (+ job, Cargo.lock, and rustc hashes appended by the
      # action) with prefix fallback on restore. Raw target/ stays out of
      # actions/cache; nothing here keys on sources, and no install step is
      # gated on cache-hit.
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}

      # CTX-0971 R4 sharding: lint/check steps run once (shard 1) so the two
      # shards do not duplicate clippy/fmt/packaging work. Test steps below
      # are partitioned or split across both shards.
      - name: Check local Quality dispatch and cache setup
        if: matrix.shard == 1
        run: bash scripts/tests/ci-local.test.sh

      - name: Check Rust formatting
        if: matrix.shard == 1
        run: cargo fmt --all -- --check

      # CTX-1611 (bitty#2735): a private intra-doc link must fail the PR.
      # Shares the workspace build cache with the steps above; `--no-deps`
      # keeps third-party docs out of the gate.
      - name: Check rustdoc
        if: matrix.shard == 1
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      # CTX-1605: `winit` is a patched path dependency (vendor/winit). A
      # requirement bump otherwise resolves to crates.io with only a "patch was
      # not used" warning, dropping the Wayland Occluded edge while staying
      # green. No build; needs the local cargo index/cache.
      - name: Check the vendored winit resolution
        if: matrix.shard == 1
        run: ./scripts/check-vendored-winit.sh

      # Arch tooling is absent on ubuntu-24.04, so this gate runs its
      # in-tree assertions and skips the makepkg --printsrcinfo probe.
      - name: Validate packaging recipes (artifact-install consistency)
        if: matrix.shard == 1
        run: |
          bash scripts/check-pkgbuild-source.sh
          bash scripts/check-pkgbuild-bin.sh
          bash scripts/check-spec.sh
          bash scripts/tests/check-distro-recipes.test.sh
          bash scripts/tests/check-package-manifests.test.sh
          bash scripts/tests/check-release-smoke-fail-closed.test.sh
          bash scripts/tests/check-aur-bin-render.test.sh
          bash scripts/tests/check-apt-repo.test.sh
          bash scripts/tests/import-apt-gpg-key.test.sh
          bash scripts/tests/check-release-channels.test.sh
          bash scripts/tests/check-nix-flake.test.sh
          bash scripts/tests/check-nix-patch-stub.test.sh

      - name: Check terminfo shipping decision (034 item 6)
        if: matrix.shard == 1
        run: |
          bash scripts/check-terminfo.sh
          bash scripts/tests/check-terminfo.test.sh

      - name: Install desktop/AppStream validation tools
        if: matrix.shard == 1
        run: >-
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          appstream desktop-file-utils libxml2-utils

      - name: Check desktop integration and AppStream metadata (034 item 7)
        if: matrix.shard == 1
        run: |
          bash scripts/check-desktop-integration.sh
          bash scripts/tests/check-desktop-integration.test.sh

      - name: Run Clippy
        if: matrix.shard == 1
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # CTX-1378 (bitty#2288): `publication-control` is default-off, so the
      # workspace lint above only ever sees the feature's code as compiled
      # out. Lint the shipped graph with the feature on, but deliberately
      # WITHOUT `publication-control-test-support`: that combination is where
      # the test-only accessors lose their only callers, so this step is the
      # regression gate for feature-combination dead code.
      - name: Run Clippy (bitty-runtime publication-control feature)
        if: matrix.shard == 1
        run: cargo clippy -p bitty-runtime --features publication-control --all-targets --locked -- -D warnings

      # CTX-0922: `bitty dev capture|synthesize|dump|overlay` is compiled only
      # with the opt-in `dev-tools` feature; lint that configuration too.
      # (`bitty dev trace` measurement lives in the external bitty-perf suite
      # since the W-105 relocation and is never linked here, so there is no
      # trace feature configuration left to lint.)
      - name: Run Clippy (bitty-terminal dev-tools feature)
        if: matrix.shard == 1
        run: cargo clippy -p bitty-terminal --features dev-tools --all-targets --locked -- -D warnings

      # #1519 / CTX-0855: hermetic `test-support` entry points (bitty-ipc's
      # authority-less ServeContext constructors and unbound bearer minters)
      # may be enabled only from dev-dependencies. Clippy above always builds
      # the dev graph, so this resolves the production feature graph instead.
      - name: Check test-support feature gate
        if: matrix.shard == 1
        run: bash scripts/check-test-support-gate.sh

      # CTX-0847: cargo-nextest isolates every test in its own process, caps
      # the real-process `live-pty` group so system suites cannot starve each
      # other on small runners, bounds each test with a timeout, and reports
      # retries visibly. It does not run doctests and cannot list
      # `harness = false` binaries, which are run explicitly just below.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.145

      # CTX-0971 R4: hash-partition the nextest suite across 2 shards.
      # hash:N/M is deterministic per (binary, test name): adding tests never
      # moves an existing test to another shard, so flakes stay reproducible
      # to their shard. Both shards must pass for the job to pass.
      - name: Run tests (nextest, ci profile, shard ${{ matrix.shard }}/2)
        run: cargo nextest run --workspace --locked --profile ci --partition hash:${{ matrix.shard }}/2

      # bitty#2605: the fake-server half of the shared conformance corpus. It
      # runs on every consumer-relevant change (the whole Quality job) and its
      # evidence is uploaded separately from the real-service row, so a fake
      # run can never close a real row. Shard 1 only: artifact names are unique
      # per workflow run.
      - name: Run bittyd conformance (fake reference server)
        if: matrix.shard == 1
        run: cargo test -p bitty-daemon --test conformance --locked fake_conformance_corpus

      - name: Upload bittyd conformance evidence (fake)
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bittyd-conformance-fake
          path: target/conformance/linux-x86_64.fake.json
          if-no-files-found: error
          retention-days: 7

      # CTX-1332 (issue #2213): the cold-delivery phase/origin/fence suites are
      # behind the default-off `input-vm-test-support` feature. This required
      # step runs the same feature-on selection as `just cold-delivery-test`,
      # so the gate cannot be skipped by the default workspace invocation.
      - name: Run cold-delivery feature-on tests
        if: matrix.shard == 1
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo nextest run -p bitty-terminal --features input-vm-test-support --locked -E 'test(input_vm_boundary)'
          cargo nextest run -p bitty-runtime --features input-vm-test-support --locked -E 'test(dispatch_ui_command_fences_origin_and_lifecycle) | test(band_origin_publishes_only_after_a_presented_frame) | test(version_one_remount_and_edge_move_invalidate_the_old_origin) | test(cancellation_drops_queued_admissions_and_keeps_the_release_swallow) | test(chrome_band_versions_include_the_band_edge) | test(cold_selection_bound_is_sixteen_and_leaves_the_tail_queued)'

      # CTX-1373 (bitty#2199): the provider-publication launch seam and its
      # fixture tests are behind the default-off `publication-control`
      # feature. This required step runs the same feature-on selection as
      # `just publication-control-test`, including the Unix handle plumbing,
      # bootstrap zeroization, and the in-process TLS refusal/deadline cases.
      - name: Run publication-control feature-on tests
        if: matrix.shard == 1
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
        run: cargo nextest run -p bitty-runtime --features publication-control-test-support --lib --locked -E 'test(ai_publication_launch)'

      # CTX-0971 R4: nextest covers neither doctests nor harness=false
      # binaries nor benches, so split them explicitly across shards to keep
      # coverage identical without running them twice. Shard 1 takes doctests
      # plus the two harness=false platform entry points; shard 2 takes the
      # pinned bitty-perf benches, the dev-tools reruns, and the parser
      # throughput baseline (all in the external checkout).
      - name: Run doctests
        if: matrix.shard == 1
        run: cargo test --workspace --doc --locked

      - name: Run harness=false platform entry points
        if: matrix.shard == 1
        run: cargo test -p bitty-platform --test headless_run --test winit_window --locked

      # #2561: the bench build shares this job's target dir, so report the
      # budget before it starts and fail with an infrastructure signal when it
      # cannot fit, instead of letting `ld` die on an mmap write.
      - name: Report bench disk budget (perf suite, quality shard 2)
        if: matrix.shard == 2
        run: ./scripts/ci-disk-budget.sh --label "before pinned bitty-perf benches (quality)" --min-free-mib 6144

      # CTX-0847: the previous `cargo test --all-targets` also executed the
      # bitty-perf benches; nextest runs none of them, so that coverage is
      # kept explicitly here, now executed in the pinned external bitty-perf
      # checkout (W-105 thin gate). The bitty-ipc example moved with the
      # CTX-1585 extraction to the independent bitty-ipc repository (own CI)
      # and is no longer a workspace member here.
      - name: Run benches (pinned bitty-perf suite)
        if: matrix.shard == 2
        working-directory: external/bitty-perf
        env:
          # #2561: each bench binary statically links the whole product graph,
          # so bound concurrent rustc/link jobs to keep the peak predictable.
          CARGO_BUILD_JOBS: "2"
        run: cargo test --benches --locked

      # #2561: peak footprint of the bench build, and proof that it compiled
      # into the shared workspace target dir instead of a second tree.
      - name: Report bench disk usage (perf suite, quality shard 2)
        if: always() && matrix.shard == 2
        run: ./scripts/ci-disk-budget.sh --label "after pinned bitty-perf benches (quality)"

      # #2561: the bench graph lives in the shared workspace target dir, so
      # there is no separate perf tree to free. Keep the removal as a fail-safe
      # against a stale tree restored from cache or reintroduced by a
      # step-level CARGO_TARGET_DIR (see the linux-x11 reclaim step).
      - name: Reclaim perf build directory (quality shard 2)
        if: matrix.shard == 2
        run: |
          rm -rf external/bitty-perf/target
          df -h "$GITHUB_WORKSPACE"

      # CTX-0922: the default nextest run only covers the compiled-out
      # `bitty dev` paths; rerun the CLI suite and the `dev::` unit tests
      # with the opt-in `dev-tools` feature so the tool success paths stay
      # covered. (`bitty dev trace` has no enabling feature since the W-105
      # relocation; its disabled diagnostic is covered by the default run.)
      - name: Run bitty dev tool tests (dev-tools feature)
        if: matrix.shard == 2
        run: |
          cargo test -p bitty-terminal --features dev-tools --test cli_dev --locked
          cargo test -p bitty-terminal --features dev-tools --bin bitty --locked dev::

      # M1-10 / CTX-0574: pin the M1 matrix driver's reporting logic (suite
      # floors, ignored-test rejection, aggregate failure modes, step summary)
      # without running the real suites here; the four Tier 1 platform legs and
      # the `m1-matrix` aggregate job below run the suites themselves. This is
      # also what the mandatory local `just ci-local` run (which targets this
      # job) validates for the new wiring.
      - name: Check M1 matrix driver (fixture test)
        if: matrix.shard == 1
        run: bash scripts/tests/m1-matrix.test.sh

      # #2561: the pinned perf suite must compile into the shared workspace
      # target dir (one target tree per runner), keep its defensive reclaim
      # step, and bracket the bench step with disk breadcrumbs.
      - name: Check perf-suite disk guard (fixture test)
        if: matrix.shard == 1
        run: bash scripts/tests/perf-disk.test.sh

      # M1-11 / CTX-0576: the committed parser-throughput baseline guards the
      # compatibility-milestone performance requirement (no pathological
      # regression versus plain-text throughput). The check is bounded
      # (512 KiB/corpus, 3 rounds), deterministic, and headless; the ratio gate
      # is deliberately generous so shared runners do not flake. Executes in
      # the pinned external bitty-perf checkout (W-105 thin gate).
      - name: Check parser throughput regression (M1-11 baseline)
        if: matrix.shard == 2
        working-directory: external/bitty-perf
        run: cargo test --test parser_throughput_regression --locked

      # W-105: the external compat-lab suite vendors product test/scenario
      # snapshots (fixtures/); this fails when they drift from this workspace.
      - name: Check compat fixture freshness
        if: matrix.shard == 1
        run: bash scripts/check-compat-fixture-freshness.sh --lab-dir external/bitty-compat-lab

      - name: Check compat fixture gate (fixture test)
        if: matrix.shard == 1
        run: bash scripts/tests/check-compat-fixture-freshness.test.sh

      # The generator's environment boundary is a regression surface: Git hooks
      # export GIT_DIR/GIT_INDEX_FILE, and the catalog gate must still read the
      # pinned registry checkout. Hermetic fixtures; no network.
      - name: Test official plugin catalog generator
        if: matrix.shard == 1
        run: python3 scripts/tests/test_generate_official_catalog.py

      # Core embeds a build-time official plugin catalog. The checked-in
      # generated file must match the pinned registry source; a registry pin
      # or entry bump that is not reflected in Core fails here instead of
      # silently going stale. This is the strict registry gate (`just
      # check-registry`) and stays separate from `just check`, which must pass
      # without a registry checkout; the invocation is explicit so CI never
      # falls back to another tree. Read-only, no runtime fetch.
      - name: Check official plugin catalog freshness (strict registry gate)
        if: matrix.shard == 1
        env:
          BITTY_PLUGINS_REV: ${{ steps.validation-pins.outputs.plugins-rev }}
        run: >-
          python3 scripts/generate-official-catalog.py --check
          --registry external/bitty-plugins
          --revision "$BITTY_PLUGINS_REV"

      - name: Check status drift gate (OQ/RFC/crate-count/submodule)
        if: matrix.shard == 1
        run: |
          bash scripts/check-status-drift.sh
          bash scripts/tests/check-status-drift.test.sh

      # 034 item 4 / CTX-0449: the declared deb/rpm/archlinux runtime deps must
      # cover exactly the sonames the linked binary needs. The fixture test
      # pins the gate logic; the debug-binary run catches nfpm.yaml and
      # packaging/linux/runtime-deps.toml drift on every PR.
      # CTX-0697: deny rustc warnings on the workspace build so new build
      # warnings fail CI going forward (clippy already runs with -D warnings).
      - name: Check runtime dependency declarations (ldd/readelf gate)
        if: matrix.shard == 1
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          bash scripts/tests/check-runtime-deps.test.sh
          cargo build --locked -p bitty-terminal
          bash scripts/check-runtime-deps.sh --binary target/debug/bitty --packagers deb,rpm,archlinux

      # 034 item 5 / CTX-0450: pin the install-smoke driver's distro leg
      # (package discovery, install command, --version/doctor/headless smoke)
      # without starting a container; the release workflow runs the real legs.
      - name: Check install smoke driver (fixture test)
        if: matrix.shard == 1
        run: bash scripts/tests/install-smoke.test.sh

      # CTX-1061 (#1861): live per-OS verification for the bootstrap
      # installers. The offline URL/arg legs live in the same fixture test;
      # these are the live legs: latest.txt pointer fetch plus real download,
      # sidecar verify, extract/install against a file:// fake-CDN fixture
      # (no external network). macos/windows jobs run the same test (macOS)
      # or the pwsh leg (Windows) below.
      - name: Check install scripts live legs (fake-CDN fixture test)
        if: matrix.shard == 1
        run: |
          command -v zstd >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd; }
          bash scripts/tests/install-scripts.test.sh

      # CTX-1063 (#1792): pin the R2 prebuilt component dist mechanics
      # (per-target tarball + SHA256SUMS manifest + CDN URL templates)
      # without network or uploads; the release-time R2 publisher lands
      # with the first shippable component.
      - name: Check component dist driver (fixture test)
        if: matrix.shard == 1
        run: bash scripts/tests/make-component-dist.test.sh

      - name: Lint GitHub Actions workflows
        if: matrix.shard == 1
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/repo"
          --workdir /repo
